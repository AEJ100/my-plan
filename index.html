<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; transition: 0.3s; 
            min-height: 100vh; background-color: var(--bg); color: var(--text); box-sizing: border-box; padding-bottom: 140px;
        }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); position: relative; }
        
        /* 상단 레이아웃 */
        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -2px; }
        .quote-side { background: rgba(0,113,227,0.05); border-left: 4px solid var(--primary); padding: 12px 18px; border-radius: 0 15px 15px 0; font-size: 0.95rem; line-height: 1.5; }
        .total-percent { font-size: 1.3em; font-weight: bold; color: var(--primary); margin-top: 8px; }

        /* 비전 & 목표 (접기/펼치기) */
        details { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 15px; overflow: hidden; background: var(--card); transition: 0.3s; }
        summary { padding: 18px; font-weight: bold; background: var(--bg); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }
        .goal-item { padding: 0 20px 20px 20px; }
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 1em; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; margin-bottom: 15px; font-family: inherit; box-sizing: border-box; transition: 0.2s; }
        .goal-area:focus { outline: none; border-color: var(--primary); }

        /* 타이머 */
        .timer-box { background: var(--primary); color: white; padding: 15px 25px; border-radius: 20px; text-align: center; min-width: 150px; box-shadow: 0 10px 20px rgba(0,113,227,0.2); }
        .timer-display { font-size: 2.2em; font-weight: 800; letter-spacing: 1px; }

        /* 할 일 목록 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
        .todo-item { display: flex; align-items: center; background: var(--bg); padding: 12px; border-radius: 12px; margin-bottom: 10px; gap: 10px; border: 1px solid var(--border); transition: 0.2s; }
        .todo-item:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .star-btn { cursor: pointer; font-size: 1.3em; color: #ccc; border: none; background: none; transition: 0.2s; padding: 0; }
        .star-btn.active { color: var(--gold); transform: scale(1.1); }
        .done-stamp { position: absolute; top: 10px; right: 10px; font-size: 1.5em; }

        /* 하단 도크 */
        .save-dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: var(--card); padding: 12px 25px; border-radius: 50px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: bold; padding: 10px 18px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
        <h1 id="main-title" onclick="editTitle()" style="cursor:pointer; margin:0; font-size: 1.6em;">🏆 12-Week Masterpiece</h1>
        <button onclick="toggleTheme()" style="background:var(--text); color:var(--card); font-size:0.85em;">🌓 테마 전환</button>
    </div>

    <div class="header-grid">
        <div class="dday-box">
            <div id="dday-display" class="dday-big">D-Day</div>
            <div id="total-percent-display" class="total-percent">달성률: 0%</div>
        </div>
        
        <div class="quote-side">
            <div id="quote-display">"인생에서 가장 큰 영광은 넘어지지 않는 것이 아니라 넘어질 때마다 일어나는 데 있다."</div>
            <div id="quote-author" style="font-size: 0.85em; color: var(--quote-sub); margin-top: 5px;">- 넬슨 만델라</div>
        </div>

        <div class="timer-box">
            <div style="font-size: 0.75em; opacity: 0.9; margin-bottom: 3px; font-weight: bold;">FOCUS</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); margin-top:8px; width:100%; padding:6px; font-size: 0.85em;">START</button>
        </div>
    </div>

    <div style="margin-bottom: 30px; font-size: 0.95em; font-weight: bold;">
        📅 시작일: <input type="date" id="start-date" onchange="data.startDate=this.value; save(); render();" style="border:1px solid var(--border); padding:6px; border-radius:10px; background:var(--card); color:var(--text); outline:none;">
    </div>

    <details>
        <summary>🖼️ 비전 보드 & 3단계 목표 시스템 (열기/닫기)</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <div class="goal-item">
            <label style="font-weight:bold; color:var(--primary); font-size:0.9em; display:block; margin-bottom:8px;">🌟 원대한 목표 (내 인생의 북극성)</label>
            <textarea id="goal-long" class="goal-area" placeholder="내 인생에서 가장 이루고 싶은 꿈을 적으세요..." onchange="data.goals.long=this.value; save();"></textarea>
            
            <label style="font-weight:bold; color:var(--primary); font-size:0.9em; display:block; margin-bottom:8px;">🎯 3년 목표 (구체적인 이정표)</label>
            <textarea id="goal-3yr" class="goal-area" placeholder="3년 뒤 나의 모습은 어떠해야 할까요?" onchange="data.goals.three=this.value; save();"></textarea>
            
            <label style="font-weight:bold; color:var(--primary); font-size:0.9em; display:block; margin-bottom:8px;">🚀 12주 핵심 계획 (지금 당장의 실행)</label>
            <textarea id="goal-12wk" class="goal-area" placeholder="이번 시즌에 반드시 끝내야 할 단 하나는?" onchange="data.goals.twelve=this.value; save();"></textarea>
        </div>
    </details>

    <div class="card">
        <h2 style="margin:0 0 15px 0; font-size: 1.25em;">📊 주간 성공 추이</h2>
        <div style="height:200px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#5856d6; color:white;" onclick="importData()">📥 복원</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "가장 위대한 영광은 한 번도 실패하지 않음이 아니라, 넘어질 때마다 다시 일어남에 있다.", a: "넬슨 만델라" },
        { q: "할 수 있다고 믿는 순간 이미 절반은 이룬 것이다.", a: "테오도르 루스벨트" },
        { q: "미래를 예측하는 가장 좋은 방법은 미래를 직접 창조하는 것이다.", a: "피터 드러커" },
        { q: "어제와 똑같이 살면서 다른 미래를 기대하는 것은 정신병 초기 증세이다.", a: "알베르트 아인슈타인" },
        { q: "작은 일에 충실한 사람이 큰 일에도 충실할 수 있다.", a: "성경" },
        { q: "당신의 시간은 한정되어 있다. 다른 사람의 삶을 사느라 낭비하지 마라.", a: "스티브 잡스" },
        { q: "성공이란 열정을 잃지 않고 실패에서 실패로 나아가는 능력이다.", a: "윈스턴 처칠" },
        { q: "시작하기 위해 위대해질 필요는 없지만, 위대해지기 위해 시작해야 한다.", a: "지그 지글러" },
        { q: "계획 없는 목표는 단지 희망사항에 불과하다.", a: "생텍쥐페리" },
        { q: "오늘 당신이 하는 일이 당신의 미래를 결정한다.", a: "간디" }
    ];

    let data = JSON.parse(localStorage.getItem('12WeekMasterV5')) || {
        theme: 'light', title: "🏆 12-Week Masterpiece", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function editTitle() { const v = prompt('대시보드 제목 수정:', data.title); if(v) { data.title = v; save(); render(); } }
    
    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else {
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerDisplay();
                if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 시간이 끝났습니다! 휴식을 취하세요."); timeLeft=1500; updateTimerDisplay(); isRunning=false; document.getElementById('timer-btn').innerText = "START"; }
            }, 1000);
            document.getElementById('timer-btn').innerText = "STOP";
        }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function save() { localStorage.setItem('12WeekMasterV5', JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("브라우저에 데이터가 성공적으로 저장되었습니다!"); }
    
    function resetAll() {
        if(confirm("모든 데이터(목표, 할 일, 이미지)가 삭제됩니다. 정말 초기화할까요?")) {
            localStorage.removeItem('12WeekMasterV5');
            location.reload();
        }
    }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-percent-display').innerText = `전체 달성률: ${per}%`;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `12week-backup-${data.startDate}.json`; a.click();
    }
    function importData() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data = JSON.parse(reader.result); save(); render(); alert("복원이 완료되었습니다!"); };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks.map(w => w.title),
                datasets: [{ 
                    label: '성공률(%)', data: scores, borderColor: '#0071e3', 
                    borderWidth: 3, tension: 0.3, fill: true, 
                    backgroundColor: 'rgba(0,113,227,0.1)', pointBackgroundColor: '#0071e3'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
        });
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-3yr').value = data.goals.three;
        document.getElementById('goal-12wk').value = data.goals.twelve;

        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${randomQuote.q}"`;
        document.getElementById('quote-author').innerText = `- ${randomQuote.a}`;

        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁 완료";

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : `<span style="color:var(--border); font-size:1.5em;">+</span>`}</div>`;
        });

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            // 별표(중요) 표시된 할 일이 위로 오도록 정렬
            w.todos.sort((a, b) => (b.important - a.important));
            
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            const isDone = total > 0 && per === 100;

            board.innerHTML += `
                <div class="card" style="${isDone ? 'border-color:var(--success); border-width:2px;' : ''}">
                    ${isDone ? '<span class="done-stamp">🔥</span>' : ''}
                    <h3 style="margin:0 0 10px 0; font-size: 1.15em;">${w.title} <span style="color:var(--primary); float:right;">${per}%</span></h3>
                    <div style="background:var(--bg); height:8px; border-radius:4px; overflow:hidden; border:1px solid var(--border);">
                        <div style="width:${per}%; background:${per===100?'var(--success)':'var(--primary)'}; height:100%; transition:0.5s;"></div>
                    </div>
                    <div style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" style="${t.important ? 'border-left: 5px solid var(--gold); background:rgba(255,204,0,0.05);' : ''}">
                                <button class="star-btn ${t.important ? 'active' : ''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})" style="width:18px; height:18px; cursor:pointer;">
                                <span style="flex:1; font-size: 0.95em; ${t.done?'text-decoration:line-through;opacity:0.4':''}">${t.text}</span>
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="color:var(--accent); background:none; font-size:1.2em;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 입력..." style="flex:1; border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--bg); color:var(--text); outline:none;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">추가</button>
                    </div>
                    <textarea placeholder="이번 주 회고..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="height:70px; width:100%; border:1px solid var(--border); border-radius:12px; background:var(--bg); color:var(--text); padding:10px; margin-top:10px; font-family:inherit; font-size: 0.9em; box-sizing:border-box;">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart();
        calculateTotalPercent();
    }

    // 기능 함수들
    function addTodo(wIdx) {
        const v = document.getElementById(`in-${wIdx}`);
        if(v.value) { data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); }
    }
    function toggleTodo(wIdx, tIdx) {
        data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done;
        if(data.weeks[wIdx].todos[tIdx].done) confetti();
        save(); render();
    }
    function toggleStar(wIdx, tIdx) {
        data.weeks[wIdx].todos[tIdx].important = !data.weeks[wIdx].todos[tIdx].important;
        save(); render();
    }
    function deleteTodo(wIdx, tIdx) {
        data.weeks[wIdx].todos.splice(tIdx, 1);
        save(); render();
    }

    render();
</script>
</body>
</html>
