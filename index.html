<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Full Vision V17.6</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }
        
        /* 제목 영역 최적화: 가려지지 않고 쭉 이어짐 */
        .header-flex { display: flex; flex-direction: column; margin-bottom: 15px; gap: 5px; }
        .title-row { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 10px; }
        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 100%; outline: none; white-space: normal; overflow: visible; }
        .auth-btn { padding: 8px 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; font-size: 0.8em; white-space: nowrap; }
        
        /* 대시보드 구조 개선 */
        .dashboard { display: grid; grid-template-columns: 1fr 1.5fr 1.8fr; gap: 12px; margin-bottom: 15px; }
        @media (max-width: 800px) { .dashboard { grid-template-columns: 1fr; } }
        
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); }
        .dday-box { font-size: 3em; font-weight: 900; color: var(--accent); text-align: center; }
        
        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
        .timer-part { background: var(--primary); color: white; border-radius: 12px; padding: 12px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .mini-label { font-size: 0.75em; font-weight: 900; margin-bottom: 4px; }
        .mini-display { font-size: 1.6em; font-weight: 900; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: 0.6s ease; }

        /* 사진 및 목표 관리 */
        .vision-card { aspect-ratio:1/1; background:var(--input-bg); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position: relative; }
        .vision-card img { width: 100%; height: 100%; object-fit: cover; }
        .img-controls { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; opacity: 0; transition: 0.2s; }
        .vision-card:hover .img-controls { opacity: 1; }
        .img-btn { background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 6px; padding: 4px 6px; font-size: 10px; cursor: pointer; }

        #lightbox { display: none; position: fixed; z-index: 9500; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; cursor: zoom-out; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 15px; box-shadow: 0 0 30px rgba(255,255,255,0.3); }

        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; }
        
        .goal-accordion { margin: 10px 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .goal-accordion summary { padding: 10px 15px; background: var(--input-bg); color: var(--primary); font-weight: 900; font-size: 1em; cursor: pointer; }
        .goal-textarea { width: 100%; background: var(--card); border: none; color: var(--text); padding: 18px; box-sizing: border-box; resize: vertical; min-height: 100px; font-size: 1.4em; font-weight: 800; line-height: 1.5; outline: none; }

        /* 투두 리스트 */
        .block-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .block-card { background: var(--card); border-radius: 18px; padding: 25px; border: 3px solid var(--border); transition: 0.3s; cursor: pointer; text-align: center; }
        .block-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .block-card h3 { margin: 0; font-size: 1.3em; font-weight: 900; }

        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card); margin: 3vh auto; padding: 20px; border-radius: 24px; width: 95%; max-width: 600px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        
        .day-section { margin-bottom: 10px; background: var(--input-bg); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        .day-header { padding: 12px 15px; font-weight: 900; color: var(--primary); font-size: 1.1em; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--card); }
        .day-content { padding: 10px; display: none; }
        .day-content.active { display: block; }
        
        .todo-item { display: flex; align-items: center; background: var(--card); padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; gap: 8px; border: 1px solid var(--border); transition: 0.2s; }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 1em; }
        .star-icon { cursor: pointer; color: #ccc; font-size: 1.2em; } .star-icon.active { color: var(--gold); }
        .todo-check { width: 20px; height: 20px; cursor: pointer; accent-color: var(--success); }

        .pending-tag { font-size: 0.95em; font-weight: 900; color: var(--primary); width: 85px; display: inline-block; background: var(--border); padding: 2px 6px; border-radius: 6px; text-align: center; margin-right: 10px; }

        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 4000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .dock-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.75em; background: var(--success); color: white; padding: 5px 15px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 6000; font-weight: bold; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">구름 저장 완료 ☁️</div>
<div id="lightbox" onclick="this.style.display='none'"><img src="" id="lightbox-img"></div>

<div id="planner-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0; color:var(--primary); text-align: center;">기수 정보</h2>
        <div id="planner-container"></div>
        <button style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:18px; font-weight:900; cursor:pointer; margin-top:10px;" onclick="closeModal()">닫기</button>
    </div>
</div>

<div class="container">
    <div class="header-flex">
        <div class="title-row">
            <input type="text" id="master-title" class="main-title-input" placeholder="제목을 입력하세요" oninput="autoSaveField('title', this.value)">
            <div id="auth-zone">
                <button id="btn-login" class="auth-btn" style="background:var(--primary); color:white;" onclick="googleLogin()">🔑 로그인</button>
                <div id="user-info" style="display:none; text-align:right;">
                    <span id="user-name" style="font-size:0.8em; font-weight:bold; display:block;"></span>
                    <button onclick="googleLogout()" style="color:var(--accent); background:none; border:none; font-size:0.6em; cursor:pointer;">로그아웃</button>
                </div>
            </div>
        </div>
        <span id="season-display" style="font-weight:bold; color:var(--primary); font-size:0.9em;">제 1기 진행 중</span>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="text-align:center; margin-top:10px;"><input type="date" id="start-date" style="border:none; background:transparent; color:var(--text); font-weight:bold; width: 120px;" onchange="data.startDate=this.value; save(); render();"></div>
        </div>
        <div class="dual-card">
            <div class="timer-part">
                <div class="mini-label">집중 타이머</div>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); border:none; border-radius:5px; font-size:0.65em; cursor:pointer; font-weight:bold; padding:4px 10px; margin-top:5px;">START</button>
            </div>
            <div class="progress-part">
                <div class="mini-label" style="color:var(--quote-sub)">전체 성공률</div>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container"><div id="main-progress-bar" class="progress-bar-fill"></div></div>
            </div>
        </div>
        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" style="font-weight:800; border-left:4px solid var(--primary); padding-left:15px; font-size:0.95em;"></div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.8em; margin-top:8px; margin-left:19px;"></div>
        </div>
    </div>

    <button style="background: var(--gold); color: black; border: none; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; margin-bottom: 15px; width: 100%;" onclick="archiveSeason()">🏆 이번 기수 마감 및 제 다음 기수 시작</button>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표</summary>
        <div style="padding: 20px 0;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px 20px;"></div>
            
            <details class="goal-accordion" open>
                <summary>✨ 원대한 장기목표</summary>
                <textarea id="goal-long" class="goal-textarea" placeholder="나의 가장 큰 꿈을 적어보세요" oninput="autoSaveGoal('long', this.value)"></textarea>
            </details>
            
            <details class="goal-accordion" open>
                <summary>🎯 3년 중기목표</summary>
                <textarea id="goal-three" class="goal-textarea" placeholder="3년 뒤 나의 모습은?" oninput="autoSaveGoal('three', this.value)"></textarea>
            </details>
            
            <details class="goal-accordion" open>
                <summary>🚀 12주 목표</summary>
                <textarea id="goal-twelve" class="goal-textarea" placeholder="이번 12주 동안 이룰 것은?" oninput="autoSaveGoal('twelve', this.value)"></textarea>
            </details>
        </div>
    </details>

    <div class="block-grid" id="board"></div>

    <details class="vision-section" id="pending-section" open>
        <summary>📌 미완료 리스트 모아보기</summary>
        <div id="pending-container" style="padding: 20px;"></div>
    </details>

    <details class="vision-section" open>
        <summary>📜 지나간 기수 기록 (보관함)</summary>
        <div id="history-grid" class="block-grid" style="padding: 20px;"></div>
    </details>
</div>

<div class="dock">
    <button class="dock-btn" onclick="toggleTheme()" title="밝기 조절">🌓</button>
    <button class="dock-btn" onclick="resetAll()" title="데이터 초기화" style="color:var(--accent);">🧹</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ", authDomain: "week-project-29b17.firebaseapp.com", projectId: "week-project-29b17", storageBucket: "week-project-29b17.firebasestorage.app", messagingSenderId: "277326942781", appId: "1:277326942781:web:aef86a0c4bd94c4300d054", measurementId: "G-X9NWJ5SSW1" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
    const quotes = [{q:"실행은 모든 것을 이긴다.", a:"마크 저커버그"}, {q:"완벽을 기다리면 늦는다.", a:"리드 호프먼"}, {q:"속도가 완벽을 이긴다.", a:"스타트업 격언"}];
    const dayNames = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];

    let data = JSON.parse(localStorage.getItem('12W_V17_6')) || { 
        theme:'dark', title:"🏆 12주 마스터피스", startDate:new Date().toISOString().split('T')[0], 
        goals:{long:"", three:"", twelve:""}, images:[null,null,null], 
        currentSeason: 1, history: [],
        weeks: Array.from({length:12}, (_, i) => ({ title: (i+1) + "주차", days: Array.from({length:7}, () => ({ todos: [] })) }))
    };
    
    let currentW = null, openDayIdx = null, timerInterval, timeLeft = 1500, isRunning = false;

    function googleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function googleLogout() { auth.signOut().then(()=>location.reload()); }
    auth.onAuthStateChanged(user => { if(user){ document.getElementById('btn-login').style.display='none'; document.getElementById('user-info').style.display='block'; document.getElementById('user-name').innerText=user.displayName+'님'; loadFromCloud(user.uid); } });

    function save() { 
        localStorage.setItem('12W_V17_6', JSON.stringify(data)); 
        const user = auth.currentUser; 
        if(user) db.collection("users").doc(user.uid).set(data).then(() => { 
            const s=document.getElementById('save-status'); s.style.opacity='1'; setTimeout(()=>s.style.opacity='0',800); 
        }); 
        render();
    }

    function loadFromCloud(uid) { db.collection("users").doc(uid).get().then(doc => { if(doc.exists){ data=doc.data(); render(); } }); }
    function getStatusColor(per) { if(per >= 100) return 'var(--success)'; if(per >= 70) return 'var(--primary)'; if(per >= 30) return '#ff9500'; return 'var(--border)'; }
    function getWeekRangeText(baseDate, wIdx) {
        const start = new Date(baseDate);
        const wStart = new Date(start); wStart.setDate(start.getDate() + (wIdx * 7));
        const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 6);
        return `${wStart.getMonth()+1}/${wStart.getDate()} ~ ${wEnd.getMonth()+1}/${wEnd.getDate()}`;
    }

    function zoomImage(src) { if(!src) return; document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }
    function removeImage(idx) { if(confirm("사진을 삭제할까요?")) { data.images[idx] = null; save(); } }

    function archiveSeason() {
        if(!confirm(`제 ${data.currentSeason}기를 마감하고 보관함에 저장할까요?`)) return;
        data.history.unshift({ season: data.currentSeason, title: data.title, startDate: data.startDate, goals: JSON.parse(JSON.stringify(data.goals)), images: JSON.parse(JSON.stringify(data.images)), weeks: JSON.parse(JSON.stringify(data.weeks)) });
        data.currentSeason += 1; data.startDate = new Date().toISOString().split('T')[0];
        data.weeks = Array.from({length:12}, (_, i) => ({ title: (i+1) + "주차", days: Array.from({length:7}, () => ({ todos: [] })) }));
        confetti(); save();
    }

    function openModal(wIdx) { currentW = wIdx; renderPlanner(wIdx); document.getElementById('planner-modal').style.display = "block"; }
    function renderPlanner(wIdx) {
        const container = document.getElementById('planner-container');
        document.getElementById('modal-title').innerText = `${wIdx + 1}주 계획 (${getWeekRangeText(data.startDate, wIdx)})`;
        container.innerHTML = dayNames.map((day, dIdx) => {
            const dayData = data.weeks[wIdx].days[dIdx];
            dayData.todos.sort((a,b) => {
                if(a.important !== b.important) return a.important ? -1 : 1;
                if(a.done !== b.done) return a.done ? 1 : -1;
                return 0;
            });
            const isActive = openDayIdx === dIdx ? 'active' : '';
            return `<div class="day-section"><div class="day-header" onclick="toggleDay(${dIdx})"><span>📅 ${day}</span><span>${isActive ? '▲' : '▼'}</span></div><div class="day-content ${isActive}">${dayData.todos.map((t, tIdx) => `<div class="todo-item" style="${t.done?'opacity:0.5':''}"><span class="star-icon ${t.important?'active':''}" onclick="toggleStar(${wIdx},${dIdx},${tIdx})">★</span><input type="checkbox" class="todo-check" ${t.done?'checked':''} onclick="toggleTodo(${wIdx},${dIdx},${tIdx})"><input type="text" class="todo-input" value="${t.text}" oninput="editTodo(${wIdx},${dIdx},${tIdx},this.value)" onkeypress="if(event.key==='Enter') addTodo(${wIdx},${dIdx})" style="${t.done?'text-decoration:line-through':''}"><button onclick="deleteTodo(${wIdx},${dIdx},${tIdx})" style="border:none; background:none; color:var(--accent); cursor:pointer;">×</button></div>`).join('')}<input type="text" id="in-${wIdx}-${dIdx}" placeholder="+ 새 계획 (Enter)" onkeypress="if(event.key==='Enter') addTodo(${wIdx},${dIdx})" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); box-sizing:border-box; margin-top:5px;"></div></div>`;
        }).join('');
    }

    function toggleDay(dIdx) { openDayIdx = (openDayIdx === dIdx) ? null : dIdx; renderPlanner(currentW); }
    function closeModal() { document.getElementById('planner-modal').style.display = "none"; openDayIdx = null; render(); }
    function addTodo(wIdx, dIdx) { const v = document.getElementById(`in-${wIdx}-${dIdx}`); if(v.value.trim()){ data.weeks[wIdx].days[dIdx].todos.push({text: v.value, done: false, important: false}); v.value = ''; renderPlanner(wIdx); setTimeout(() => document.getElementById(`in-${wIdx}-${dIdx}`).focus(), 10); } }
    function toggleTodo(wIdx, dIdx, tIdx) { data.weeks[wIdx].days[dIdx].todos[tIdx].done = !data.weeks[wIdx].days[dIdx].todos[tIdx].done; if(data.weeks[wIdx].days[dIdx].todos[tIdx].done) confetti(); renderPlanner(wIdx); save(); }
    function toggleStar(wIdx, dIdx, tIdx) { data.weeks[wIdx].days[dIdx].todos[tIdx].important = !data.weeks[wIdx].days[dIdx].todos[tIdx].important; renderPlanner(wIdx); save(); }
    function editTodo(wIdx, dIdx, tIdx, val) { data.weeks[wIdx].days[dIdx].todos[tIdx].text = val; }
    function deleteTodo(wIdx, dIdx, tIdx) { data.weeks[wIdx].days[dIdx].todos.splice(tIdx, 1); renderPlanner(wIdx); save(); }

    function viewHistory(hIdx) {
        const h = data.history[hIdx];
        const container = document.getElementById('planner-container');
        document.getElementById('modal-title').innerText = `제 ${h.season}기 기록: ${h.title}`;
        let total = 0, done = 0; h.weeks.forEach(w => w.days.forEach(d => { total += d.todos.length; done += d.todos.filter(t => t.done).length; }));
        const per = total === 0 ? 0 : Math.round((done/total)*100);
        container.innerHTML = `<div style="text-align:center; padding:15px; background:var(--input-bg); border-radius:15px; margin-bottom:15px;"><div style="font-size:2em; font-weight:900; color:${getStatusColor(per)}">${per}% 달성</div></div><div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:15px;">${h.images.map(img => `<div onclick="zoomImage('${img}')" style="aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:#eee; cursor:pointer;">${img?`<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : ''}</div>`).join('')}</div>${h.weeks.map(w => { const wTasks = w.days.flatMap((d, dIdx) => d.todos.map(t => ({...t, day: dayNames[dIdx]}))); if(wTasks.length === 0) return ''; return `<div class="day-section"><div class="day-header" onclick="this.nextElementSibling.classList.toggle('active')"><span>${w.title}</span><span>▼</span></div><div class="day-content">${wTasks.map(t => `<div class="todo-item" style="opacity:0.7;"><span style="font-weight:900; color:var(--primary); min-width:40px;">${t.day[0]}</span><span style="flex:1; ${t.done?'text-decoration:line-through':''}">${t.text}</span><span>${t.done?'✅':'❌'}</span></div>`).join('')}</div></div>`; }).join('')}`;
        document.getElementById('planner-modal').style.display = "block";
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('season-display').innerText = `제 ${data.currentSeason}기 진행 중`;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div'); div.className = 'vision-card';
            if(img) {
                div.innerHTML = `<img src="${img}" onclick="zoomImage('${img}')"><div class="img-controls"><button class="img-btn" onclick="event.stopPropagation(); handleImage(${i})">🔄</button><button class="img-btn" onclick="event.stopPropagation(); removeImage(${i})">🗑️</button></div>`;
            } else {
                div.innerHTML = '+'; div.onclick = () => handleImage(i);
            }
            gallery.appendChild(div);
        });
        
        const board = document.getElementById('board'); board.innerHTML = '';
        let totalAll = 0, doneAll = 0;
        data.weeks.forEach((w, wIdx) => {
            let weekTotal = 0, weekDone = 0; w.days.forEach(d => { weekTotal += d.todos.length; weekDone += d.todos.filter(t => t.done).length; });
            const per = weekTotal === 0 ? 0 : Math.round((weekDone / weekTotal) * 100);
            totalAll += weekTotal; doneAll += weekDone;
            board.innerHTML += `<div class="block-card" style="border-color:${getStatusColor(per)}" onclick="openModal(${wIdx})"><span class="block-date">${getWeekRangeText(data.startDate, wIdx)}</span><h3>${w.title}</h3><div style="font-size:1.5em; font-weight:900; color:${getStatusColor(per)}; margin:10px 0;">${per}%</div></div>`;
        });
        const totalRate = totalAll === 0 ? 0 : Math.round((doneAll / totalAll) * 100);
        document.getElementById('total-per-text').innerText = totalRate + '%';
        document.getElementById('main-progress-bar').style.width = totalRate + '%';
        document.getElementById('main-progress-bar').style.backgroundColor = getStatusColor(totalRate);
        renderPendingList(); renderHistory(); updateDDay();
    }

    function renderPendingList() {
        const container = document.getElementById('pending-container'); container.innerHTML = '';
        data.weeks.forEach((w, wIdx) => { w.days.forEach((d, dIdx) => { d.todos.forEach((t, tIdx) => { if (!t.done) { container.innerHTML += `<div class="todo-item"><span class="pending-tag">${wIdx+1}주-${dayNames[dIdx][0]}</span><input type="checkbox" style="width:18px; height:18px;" onclick="toggleTodo(${wIdx},${dIdx},${tIdx})"><span style="flex:1;">${t.text}</span></div>`; } }); }); });
    }

    function renderHistory() {
        const container = document.getElementById('history-grid'); container.innerHTML = '';
        if (data.history.length === 0) { container.innerHTML = '<p style="text-align:center; opacity:0.5; width:100%;">아직 보관된 기록이 없습니다.</p>'; return; }
        data.history.forEach((h, hIdx) => {
            let hTotal = 0, hDone = 0; h.weeks.forEach(w => w.days.forEach(d => { hTotal += d.todos.length; hDone += d.todos.filter(t => t.done).length; }));
            const per = hTotal === 0 ? 0 : Math.round((hDone / hTotal) * 100);
            container.innerHTML += `<div class="block-card" onclick="viewHistory(${hIdx})" style="border-color:${getStatusColor(per)}"><span class="block-date">${h.startDate}</span><h3>제 ${h.season}기</h3><div style="font-size:1.2em; font-weight:900; color:${getStatusColor(per)};">${per}%</div></div>`;
        });
    }

    function autoSaveField(f, v) { data[f] = v; save(); }
    function autoSaveGoal(f, v) { data.goals[f] = v; save(); }
    function updateDDay() { const start=new Date(data.startDate); const end=new Date(start); end.setDate(start.getDate()+84); const diff=Math.ceil((end-new Date())/(1000*60*60*24)); document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁"; }
    function refreshQuote() { const rq=quotes[Math.floor(Math.random()*quotes.length)]; document.getElementById('quote-display').innerText=`"${rq.q}"`; document.getElementById('quote-author').innerText=`- ${rq.a}`; }
    function toggleTimer() { if(isRunning){ clearInterval(timerInterval); isRunning=false; document.getElementById('timer-btn').innerText="START"; } else { isRunning=true; document.getElementById('timer-btn').innerText="STOP"; timerInterval=setInterval(()=>{ timeLeft--; updateTimerDisp(); if(timeLeft<=0){ clearInterval(timerInterval); alert("집중 끝!"); timeLeft=1500; updateTimerDisp(); isRunning=false; } }, 1000); } }
    function updateTimerDisp() { const m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer').innerText=`${m}:${s<10?'0':''}${s}`; }
    function handleImage(idx) { const i=document.createElement('input'); i.type='file'; i.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader(); r.onload=ev=>{ data.images[idx]=ev.target.result; save(); }; r.readAsDataURL(f); }; i.click(); }
    function toggleTheme() { data.theme = data.theme==='dark'?'light':'dark'; save(); }
    function resetAll() { if(confirm("초기화할까요?")){ localStorage.clear(); location.reload(); } }
    refreshQuote(); render();
</script>
</body>
</html>
