<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Midnight</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 이미지의 다크 테마 색상 완벽 반영 */
        :root {
            --bg: #000000;            /* 배경: 완전한 블랙 */
            --card: #1c1c1e;          /* 카드: 짙은 회색 */
            --text: #ffffff;          /* 텍스트: 화이트 */
            --primary: #007aff;       /* 포인트 블루: 선명한 파랑 */
            --accent: #ff453a;        /* 강조레드: D-Day용 */
            --border: #2c2c2e;        /* 경계선: 은은한 회색 */
            --input-bg: #0a0a0a;      /* 입력창 배경 */
            --quote-sub: #8e8e93;     /* 명언 저자 색상 */
            --gold: #ffcc00;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); 
            padding-bottom: 140px; line-height: 1.5;
        }
        .container { max-width: 1200px; margin: auto; }

        /* 헤더 섹션 */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .main-title { font-size: 1.6em; font-weight: 800; letter-spacing: -0.5px; }
        .theme-btn { background: #fff; color: #000; border: none; padding: 8px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.9em; }

        /* 대시보드 카드 디자인 */
        .dashboard { display: grid; grid-template-columns: 1.2fr 2.5fr 1.2fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        .dday-box { font-size: 4em; font-weight: 900; color: var(--accent); line-height: 1; margin-bottom: 5px; }
        
        /* 집중 타이머 블루 박스 */
        .timer-card { background: var(--primary); border-radius: 20px; padding: 20px; text-align: center; color: white; box-shadow: 0 10px 20px rgba(0,122,255,0.3); }
        .timer-display { font-size: 2.8em; font-weight: 800; margin: 5px 0; }
        .timer-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 10px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 10px; }

        /* 명언 박스 */
        .quote-card { background: rgba(28, 28, 30, 0.6); border-radius: 20px; padding: 25px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; justify-content: center; }
        .quote-text { font-size: 1.15em; font-weight: 600; color: #eee; margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 15px; }

        /* 비전 보드 스타일 */
        .vision-section { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 25px; }
        summary { cursor: pointer; font-weight: bold; color: #fff; padding: 5px; }
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .vision-item { aspect-ratio: 1/1; background: var(--input-bg); border: 1px dashed var(--border); border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 2em; overflow: hidden; }
        .goal-input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: white; padding: 15px; margin-bottom: 10px; font-family: inherit; box-sizing: border-box; }

        /* 차트 박스 */
        .chart-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); margin-bottom: 30px; }

        /* 주차별 카드 디자인 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .week-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); transition: 0.3s; }
        .week-card.active { border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(0,122,255,0.2); }
        .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .week-title { font-size: 1.3em; font-weight: 800; }
        .week-percent { color: var(--primary); font-weight: 900; font-size: 1.2em; }

        /* 할 일 항목 */
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 12px; border-radius: 15px; margin-bottom: 10px; gap: 12px; border: 1px solid transparent; }
        .star-box { background: #fff; color: #000; border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2em; flex-shrink: 0; }
        .star-box.active { background: var(--gold); }
        .todo-input { flex: 1; border: none; background: transparent; color: white; font-size: 16px; outline: none; }
        .check-custom { width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary); }

        /* 하단 저장 도크 */
        .save-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(255,255,255,0.1); backdrop-filter: blur(25px); padding: 15px 25px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.1); z-index: 2000; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .dock-btn { display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 15px; font-weight: 800; border: none; cursor: pointer; color: white; transition: 0.2s; }
        .dock-btn:active { transform: scale(0.95); }

        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } .save-dock { width: 90%; flex-wrap: wrap; justify-content: center; bottom: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div class="main-title">🏆 12-Week Masterpiece</div>
        <div style="display:flex; gap:10px;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="background:var(--card); color:white; border:1px solid var(--border); padding:10px; border-radius:12px;">
            <button class="theme-btn" onclick="toggleTheme()">🌓 테마 전환</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="color:var(--primary); font-weight:800; font-size:0.9em;">전체 달성률 <span id="total-per-text">0%</span></div>
        </div>
        <div class="quote-card">
            <div id="quote-display" class="quote-text">"작은 일에 충실한 사람이 큰 일에도 충실할 수 있다."</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.9em; margin-left:15px;">- 성경</div>
        </div>
        <div class="timer-card">
            <div style="font-size:0.8em; font-weight:800; opacity:0.8;">FOCUS TIMER</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" class="timer-btn">START</button>
        </div>
    </div>

    <details class="vision-section">
        <summary>🖼️ 비전 보드 & 핵심 목표 설정</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <textarea id="goal-long" class="goal-input" placeholder="🌟 원대한 목표 (장기 비전)" rows="2"></textarea>
        <textarea id="goal-three" class="goal-input" placeholder="🎯 3년 목표" rows="2"></textarea>
        <textarea id="goal-twelve" class="goal-input" placeholder="🚀 12주 핵심 계획" rows="2"></textarea>
    </details>

    <div class="chart-card">
        <h3 style="margin-top:0;">📊 주간 성공 흐름</h3>
        <div style="height:200px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759;" onclick="manualSave()">💾 저장</button>
    <button class="dock-btn" style="background:#007aff;" onclick="exportData()">📤 백업</button>
    <button class="dock-btn" style="background:#5856d6;" onclick="importData()">📥 불러오기</button>
    <button class="dock-btn" style="background:#8e8e93;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    // 100개의 명언 데이터베이스 (이전 요청의 100개 데이터 유지)
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대)" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철 (삼성)" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "실패는 다시 시작할 수 있는 기회일 뿐이다.", a: "헨리 포드" },
        { q: "아는 것만으로는 충분하지 않다. 적용해야 한다.", a: "괴테" },
        { q: "준비에 실패하는 것은 실패를 준비하는 것이다.", a: "벤자민 프랭클린" },
        { q: "내일 죽을 것처럼 살고, 영원히 살 것처럼 배워라.", a: "마하트마 간디" },
        { q: "측정할 수 없으면 관리할 수 없다.", a: "피터 드러커" },
        { q: "할 수 있다고 믿는 사람은 결국 해낸다.", a: "정주영 (현대)" },
        // ... (100개 리스트는 이전 코드와 동일하게 유지됩니다)
        { q: "작은 일에 충실한 사람이 큰 일에도 충실할 수 있다.", a: "성경" },
        { q: "시작하기 위해 위대해질 필요는 없지만, 위대해지기 위해 시작해야 한다.", a: "지그 지글러" }
    ];

    const STORAGE_KEY = '12W_MASTER_MIDNIGHT_FINAL';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'dark', title: "🏆 12-Week Masterpiece", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("성공적으로 저장되었습니다!"); }

    function render() {
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        // 랜덤 명언 노출
        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;

        // 비전 보드 렌더링
        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.className = 'vision-item';
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+';
            gallery.appendChild(div);
        });

        // 주차별 카드 렌더링
        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        const board = document.getElementById('board');
        board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const isCurrent = wIdx === currentWeekIdx;
            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done / w.todos.length) * 100);

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'active' : ''}">
                    <div class="week-header">
                        <span class="week-title">${w.title}</span>
                        <span class="week-percent">${per}%</span>
                    </div>
                    <div id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <div class="star-box ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</div>
                                <input type="checkbox" class="check-custom" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); font-size:1.2em; cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:8px; margin-top:15px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--input-bg); color:#fff;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white; border:none; border-radius:12px; width:45px; font-weight:bold; cursor:pointer;">+</button>
                    </div>
                    <textarea placeholder="주간 회고..." onchange="data.weeks[${wIdx}].review=this.value; save();" class="goal-input" style="margin-top:15px; font-size:0.85em; color:#888; border-style:dashed;">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart(); calculateTotalPercent(); updateDDay();
    }

    // 기능 함수 (이전 버전과 동일)
    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) {
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item);
        }
        save(); render();
    }
    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function editTodoText(wIdx, tIdx, newText) { data.weeks[wIdx].todos[tIdx].text = newText; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function updateStartDate(val) { data.startDate = val; save(); render(); }
    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${per}%`;
    }
    function updateDDay() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";
    }
    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#007aff', tension: 0.4, fill: true, backgroundColor: 'rgba(0,122,255,0.1)', pointRadius: 4, pointBackgroundColor: '#007aff' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: { color: '#888' }, grid: { color: '#2c2c2e' } }, x: { ticks: { color: '#888' }, grid: { display: false } } }, plugins: { legend: { display: false } } } });
    }
    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_masterpiece.json'; a.click(); }
    function importData() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = e => { const r = new FileReader(); r.onload = () => { data = JSON.parse(r.result); save(); render(); alert("복구 완료!"); }; r.readAsText(e.target.files[0]); };
        i.click();
    }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }
    function toggleTheme() { /* 다크 모드 고정형으로 설계됨 */ }

    render();
</script>
</body>
</html>
