<style>
    /* 하단 버튼 바(Dock) 스타일 보강 */
    .save-dock { 
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
        display: flex; gap: 10px; background: var(--card); padding: 12px 24px; 
        border-radius: 50px; border: 1px solid var(--border); z-index: 2000; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
    }
    .dock-btn { 
        padding: 8px 18px; border-radius: 10px; font-weight: 800; border: none; 
        cursor: pointer; color: white; font-size: 0.85em; transition: 0.2s;
    }
    .dock-btn:hover { opacity: 0.8; transform: translateY(-2px); }
    
    .btn-backup { background: var(--success); }
    .btn-restore { background: #5856d6; }
    .btn-reset { background: #8e8e93; }
</style>

<div class="save-dock">
    <button class="dock-btn btn-backup" onclick="exportData()" title="현재까지 작성된 데이터를 파일로 저장합니다.">📤 백업 파일 저장</button>
    <button class="dock-btn btn-restore" onclick="importData()" title="저장했던 백업 파일을 불러옵니다.">📥 데이터 복원</button>
    <button class="dock-btn btn-reset" onclick="resetAll()" title="모든 데이터를 삭제하고 초기화합니다.">🧹 전체 초기화</button>
</div>

<script>
    /* (중략: 명언 데이터 및 렌더링 로직) */

    // 1. 백업 기능 (JSON 파일 다운로드)
    function exportData() { 
        // 마지막 백업 시간 업데이트
        data.lastBackup = new Date().getTime();
        save();

        const dataStr = JSON.stringify(data, null, 2); // 보기 좋게 포맷팅
        const blob = new Blob([dataStr], { type: 'application/json' }); 
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        const now = new Date();
        const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        
        a.href = url;
        a.download = `12주_마스터피스_백업_${dateStr}.json`; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // 2. 복원 기능 (JSON 파일 업로드)
    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // 데이터 구조 검증 (최소한의 안전장치)
                    if (importedData.weeks && importedData.goals) {
                        data = importedData;
                        save();
                        render();
                        alert("✅ 데이터 복원이 성공적으로 완료되었습니다!");
                    } else {
                        throw new Error("올바른 백업 파일 형식이 아닙니다.");
                    }
                } catch (err) {
                    alert("❌ 파일 읽기 실패: " + err.message);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // 3. 초기화 기능
    function resetAll() {
        if (confirm("⚠️ 경고: 모든 데이터가 삭제됩니다.\n초기화 전에 백업 파일을 저장하셨나요? 정말 초기화할까요?")) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload(); // 페이지 새로고침하여 초기 상태로 복구
        }
    }

    // (나머지 render, save, calculateTotalPercent 함수들은 이전과 동일)
</script>
