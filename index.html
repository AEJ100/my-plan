<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Compact</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); 
            padding-bottom: 120px; line-height: 1.4; transition: 0.3s;
        }
        .container { max-width: 1000px; margin: auto; }

        /* 1. UI 크기 최적화 (Compact) */
        .main-title-input {
            background: transparent; border: none; color: var(--text);
            font-size: 1.4em; font-weight: 800; width: 60%;
            outline: none; margin: 0; padding: 5px 0; transition: 0.2s;
        }
        .main-title-input:focus { border-bottom: 2px solid var(--primary); }

        .dashboard { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; margin-bottom: 15px; }
        
        .stat-card, .quote-card, .timer-card { 
            background: var(--card); border-radius: 16px; padding: 15px; 
            border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center;
        }
        
        /* 2. D-Day 및 시작일 문구 */
        .dday-box { font-size: 2.8em; font-weight: 900; color: var(--accent); line-height: 1; text-align: center; }
        .date-picker-group { margin-top: 10px; font-size: 0.8em; display: flex; align-items: center; gap: 5px; justify-content: center; }
        .date-picker { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 3px; border-radius: 6px; cursor: pointer; }

        .quote-text { font-size: 0.95em; font-weight: 600; border-left: 3px solid var(--primary); padding-left: 12px; }
        .timer-card { background: var(--primary); color: white; text-align: center; border: none; }
        .timer-display { font-size: 1.8em; font-weight: 800; margin: 2px 0; }
        .timer-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 6px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.8em; }

        /* 4. 비전보드 접이식 (Details/Summary) */
        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        .vision-section summary::after { content: '▼'; font-size: 0.7em; }
        .vision-section[open] summary::after { content: '▲'; }
        
        .vision-content { padding: 15px; }
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .vision-item { aspect-ratio: 1/1; background: var(--input-bg); border: 1px dashed var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5em; overflow: hidden; }
        
        .goal-group { margin-bottom: 10px; }
        .goal-label { font-weight: bold; margin-bottom: 4px; display: block; color: var(--primary); font-size: 0.85em; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px; font-family: inherit; box-sizing: border-box; resize: vertical; min-height: 50px; font-size: 0.9em; }

        .chart-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        .final-success-rate { font-size: 1.1em; font-weight: 900; color: var(--primary); }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); border-radius: 18px; padding: 15px; border: 1px solid var(--border); position: relative; }
        .week-card.active { border: 2px solid var(--primary); }
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 8px; border-radius: 12px; margin-bottom: 8px; gap: 8px; border: 1px solid var(--border); }
        .star-box { background: #fff; color: #000; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 1em; }
        .star-box.active { background: var(--gold); }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 0.95em; outline: none; }

        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .dock-btn { padding: 8px 16px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; color: white; font-size: 0.85em; }

        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } .main-title-input { width: 100%; } }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <input type="text" id="master-title" class="main-title-input" onchange="data.title=this.value; save();">
        <button onclick="toggleTheme()" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:5px 10px; border-radius:8px; cursor:pointer; font-size:0.8em;">🌓 테마 전환</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="font-weight:bold; font-size:0.8em; text-align:center; margin-top:5px;">달성률 <span id="total-per-text">0%</span></div>
            <div class="date-picker-group">
                <span>시작일:</span>
                <input type="date" id="start-date" class="date-picker" onchange="updateStartDate(this.value)">
            </div>
        </div>

        <div class="quote-card">
            <div id="quote-display" class="quote-text">"..."</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.8em; margin-top:5px; margin-left:12px;"></div>
        </div>

        <div class="timer-card">
            <div style="font-size:0.7em; font-weight:800; opacity:0.8;">FOCUS</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" class="timer-btn">START</button>
        </div>
    </div>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표 설정</summary>
        <div class="vision-content">
            <div class="vision-grid" id="vision-gallery"></div>
            <div class="goal-group">
                <span class="goal-label">✨ 원대한 목표 (장기비전)</span>
                <textarea id="goal-long" class="goal-textarea" onchange="data.goals.long=this.value; save();" placeholder="내용을 입력하세요..."></textarea>
            </div>
            <div class="goal-group">
                <span class="goal-label">🎯 3년 목표</span>
                <textarea id="goal-three" class="goal-textarea" onchange="data.goals.three=this.value; save();" placeholder="내용을 입력하세요..."></textarea>
            </div>
            <div class="goal-group">
                <span class="goal-label">🚀 12주 핵심 계획</span>
                <textarea id="goal-twelve" class="goal-textarea" onchange="data.goals.twelve=this.value; save();" placeholder="내용을 입력하세요..."></textarea>
            </div>
        </div>
    </details>

    <div class="chart-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h4 style="margin:0;">📊 주간 성공 흐름</h4>
            <div class="final-success-rate">성공률: <span id="final-rate">0%</span></div>
        </div>
        <div style="height:150px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759;" onclick="manualSave()">💾 저장</button>
    <button class="dock-btn" style="background:#007aff;" onclick="exportData()">📤 백업</button>
    <button class="dock-btn" style="background:#5856d6;" onclick="importData()">📥 복원</button>
    <button class="dock-btn" style="background:#8e8e93;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "작은 일에 충실한 사람이 큰 일에도 충실할 수 있다.", a: "성경" },
        { q: "미래를 예측하는 가장 좋은 방법은 미래를 창조하는 것이다.", a: "피터 드러커" },
        { q: "할 수 있다고 믿는 사람은 결국 해낸다.", a: "정주영" },
        { q: "실패는 다시 시작할 수 있는 기회일 뿐이다.", a: "헨리 포드" },
        { q: "운은 준비가 기회를 만났을 때 일어난다.", a: "세네카" }
    ];

    const STORAGE_KEY = '12W_MASTER_COMPACT_V1';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'dark', title: "🏆 12-Week Masterpiece",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("저장 완료!"); }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;

        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.className = 'vision-item';
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+';
            gallery.appendChild(div);
        });

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        const board = document.getElementById('board');
        board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const isCurrent = wIdx === currentWeekIdx;
            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done / w.todos.length) * 100);

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'active' : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="font-weight:bold; font-size:1em;">${w.title}</span>
                        <span style="color:var(--primary); font-weight:800; font-size:0.9em;">${per}%</span>
                    </div>
                    <div id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <div class="star-box ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</div>
                                <input type="checkbox" style="width:18px; height:18px;" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:8px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:0.9em;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white; border:none; border-radius:8px; width:35px; cursor:pointer;">+</button>
                    </div>
                </div>`;
        });
        updateChart(); calculateTotalPercent(); updateDDay();
    }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${rate}%`;
        document.getElementById('final-rate').innerText = `${rate}%`;
    }

    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) { data.weeks[wIdx].todos.splice(tIdx, 1); data.weeks[wIdx].todos.unshift(item); }
        save(); render();
    }
    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function editTodoText(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function updateStartDate(val) { data.startDate = val; save(); render(); }
    function updateDDay() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks.map(w => w.title),
                datasets: [{ data: scores, borderColor: '#007aff', tension: 0.4, fill: true, backgroundColor: 'rgba(0,113,227,0.1)', pointRadius: 3 }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#2c2c2e' } }, x: { ticks: { color: '#888', font: { size: 9 } }, grid: { display: false } } }, plugins: { legend: { display: false } } }
        });
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("시간 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_master_backup.json'; a.click(); }
    function importData() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = e => { const r = new FileReader(); r.onload = () => { data = JSON.parse(r.result); save(); render(); alert("복구 완료!"); }; r.readAsText(e.target.files[0]); };
        i.click();
    }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    render();
</script>
</body>
</html>
