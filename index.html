<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Classic Restored V21.5</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; padding-top: max(30px, env(safe-area-inset-top)); }
        .container { max-width: 1000px; margin: auto; }
        
        /* 상단 헤더 원래대로 */
        .header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 10px; }
        .title-zone { flex: 1; }
        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 100%; outline: none; resize: none; overflow: hidden; min-height: 40px; line-height: 1.3; font-family: inherit; }
        .auth-btn { padding: 8px 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; font-size: 0.8em; white-space: nowrap; background: var(--primary); color: white; }
        
        /* 대시보드 원래대로 */
        .dashboard { display: grid; grid-template-columns: 1fr 1.8fr 1.5fr; gap: 12px; margin-bottom: 15px; }
        @media (max-width: 600px) { .dashboard { grid-template-columns: 1fr; } }
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); transition: 0.3s; }
        .dday-box { font-size: 3em; font-weight: 900; color: var(--accent); text-align: center; }
        
        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .timer-part { background: var(--primary); color: white; border-radius: 12px; padding: 10px; text-align: center; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
        .mini-display { font-size: 1.8em; font-weight: 900; margin: 4px 0; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: 0.6s ease; }

        /* 주차별 나열 (4개씩 정렬) */
        .block-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        @media (max-width: 800px) { .block-grid { grid-template-columns: repeat(2, 1fr); } }
        .block-card { background: var(--card); border-radius: 18px; padding: 20px; border: 3px solid var(--border); transition: 0.3s; cursor: pointer; text-align: center; }
        .block-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .block-card h3 { margin: 0; font-size: 1.2em; font-weight: 900; }
        .block-date { font-size: 0.75em; opacity: 0.7; margin-bottom: 5px; display: block; }

        /* 비전 보드 */
        .vision-card { aspect-ratio:1/1; background:var(--input-bg); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position: relative; }
        .vision-card img { width: 100%; height: 100%; object-fit: cover; }
        .img-controls { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; opacity: 0; transition: 0.2s; }
        .vision-card:hover .img-controls { opacity: 1; }
        .img-btn { background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 6px; padding: 4px 6px; font-size: 10px; cursor: pointer; }

        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; }
        .goal-accordion { margin: 10px 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .goal-accordion summary { padding: 10px 15px; background: var(--input-bg); color: var(--primary); font-weight: 900; font-size: 1em; cursor: pointer; }
        .goal-textarea { width: 100%; background: var(--card); border: none; color: var(--text); padding: 18px; box-sizing: border-box; resize: vertical; min-height: 100px; font-size: 1.4em; font-weight: 800; line-height: 1.5; outline: none; }

        /* 모달 원래대로 */
        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card); margin: 3vh auto; padding: 20px; border-radius: 24px; width: 95%; max-width: 600px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; position: relative; }
        .day-section { margin-bottom: 10px; background: var(--input-bg); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        .day-header { padding: 12px 15px; font-weight: 900; color: var(--primary); font-size: 1.1em; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--card); }
        .day-content { padding: 10px; display: none; }
        .day-content.active { display: block; }
        .todo-item { display: flex; align-items: center; background: var(--card); padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; gap: 8px; border: 1px solid var(--border); transition: 0.2s; }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; }
        .todo-check { width: 20px; height: 20px; cursor: pointer; accent-color: var(--success); }
        .pending-tag { font-size: 0.85em; font-weight: 900; color: var(--primary); width: 75px; display: inline-block; background: var(--border); padding: 2px 6px; border-radius: 6px; text-align: center; margin-right: 10px; }

        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 4000; }
        .dock-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status" style="position:fixed; top:10px; left:50%; transform:translateX(-50%); background:var(--success); color:white; padding:5px 15px; border-radius:20px; opacity:0; transition:0.5s; z-index:6000; font-weight:bold;">저장 완료 ☁️</div>

<div id="planner-modal" class="modal" onclick="if(event.target.id==='planner-modal') closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-title" style="margin-top:0; color:var(--primary); text-align: center;">기수 정보</h2>
        <div id="planner-container"></div>
        <button style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:18px; font-weight:900; cursor:pointer; margin-top:10px;" onclick="closeModal()">완료</button>
    </div>
</div>

<div class="container">
    <div class="header-flex">
        <div class="title-zone">
            <textarea id="master-title" class="main-title-input" placeholder="제목을 입력하세요" rows="1" oninput="autoSaveField('title', this.value); resizeTitle(this)"></textarea>
            <span id="season-display" style="font-weight:bold; color:var(--primary); font-size:0.8em;">제 1기 진행 중</span>
        </div>
        <div id="auth-zone">
            <button id="btn-login" class="auth-btn" onclick="googleLogin()">🔑 로그인</button>
            <div id="user-info" style="display:none; text-align:right;">
                <span id="user-name" style="font-size:0.8em; font-weight:bold; display:block;"></span>
                <button onclick="googleLogout()" style="color:var(--accent); background:none; border:none; font-size:0.6em; cursor:pointer;">로그아웃</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="text-align:center; margin-top:10px;"><input type="date" id="start-date" style="border:none; background:transparent; color:var(--text); font-weight:bold;" onchange="data.startDate=this.value; save(); render();"></div>
        </div>
        <div class="quote-card" onclick="refreshQuote()" style="cursor:pointer;">
            <div id="quote-display" style="font-weight:800; border-left:4px solid var(--primary); padding-left:15px;">시작하는 방법은 말을 그만두고 행동하는 것이다.</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.8em; margin-top:8px; margin-left:19px;">- 월트 디즈니</div>
        </div>
        <div class="dual-card">
            <div class="timer-part">
                <div style="font-size:0.7em; font-weight:800;">집중 타이머</div>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); border:none; border-radius:5px; font-size:0.6em; cursor:pointer; font-weight:bold; padding:3px 8px;">START</button>
            </div>
            <div class="progress-part">
                <div style="font-size:0.7em; font-weight:800; color:var(--quote-sub)">전체 성공률</div>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container"><div id="main-progress-bar" class="progress-bar-fill"></div></div>
            </div>
        </div>
    </div>

    <button style="background: var(--gold); color: black; border: none; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; margin-bottom: 15px; width: 100%;" onclick="archiveSeason()">🏆 이번 기수 마감 및 제 다음 기수 시작</button>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표</summary>
        <div style="padding: 20px 0;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px 20px;"></div>
            <details class="goal-accordion" open><summary>✨ 장기목표</summary><textarea id="goal-long" class="goal-textarea" oninput="autoSaveGoal('long', this.value)"></textarea></details>
            <details class="goal-accordion" open><summary>🎯 3년 목표</summary><textarea id="goal-three" class="goal-textarea" oninput="autoSaveGoal('three', this.value)"></textarea></details>
            <details class="goal-accordion" open><summary>🚀 12주 목표</summary><textarea id="goal-twelve" class="goal-textarea" oninput="autoSaveGoal('twelve', this.value)"></textarea></details>
        </div>
    </details>

    <div class="block-grid" id="board"></div>
    <details class="vision-section" id="pending-section" open><summary>📌 미완료 리스트 모아보기</summary><div id="pending-container" style="padding: 20px;"></div></details>
    <details class="vision-section" open><summary>📜 지나간 기수 기록 (보관함)</summary><div id="history-grid" class="block-grid" style="padding: 20px;"></div></details>
</div>

<div class="dock">
    <button class="dock-btn" onclick="toggleTheme()">🌓</button>
    <button class="dock-btn" onclick="resetAll()" style="color:var(--accent);">🧹</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ", authDomain: "week-project-29b17.firebaseapp.com", projectId: "week-project-29b17", storageBucket: "week-project-29b17.firebasestorage.app", messagingSenderId: "277326942781", appId: "1:277326942781:web:aef86a0c4bd94c4300d054", measurementId: "G-X9NWJ5SSW1" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
    
    const quotes = [
        {q:"이봐, 해봤어?", a:"정주영"}, {q:"시련은 있어도 실패는 없다.", a:"정주영"}, {q:"내가 나를 사랑하지 않으면 아무도 나를 사랑하지 않는다.", a:"유재석"},
        {q:"포기하는 순간 핑계를 찾고, 믿는 순간 방법을 찾는다.", a:"김연아"}, {q:"인생은 속도가 아니라 방향이다.", a:"괴테"},
        {q:"실행은 모든 것을 이긴다.", a:"마크 저커버그"}, {q:"자신을 믿는 순간 삶의 길을 알게 된다.", a:"괴테"},
        {q:"어제와 똑같이 살면서 다른 미래를 기대하지 마라.", a:"아인슈타인"}, {q:"사랑받고 싶다면 사랑하라.", a:"벤자민 프랭클린"},
        {q:"계획 없는 목표는 단지 희망사항일 뿐이다.", a:"생텍쥐페리"}, {q:"행복은 목적지가 아니라 여행하는 과정이다.", a:"알프레드 디수자"},
        {q:"시작하는 방법은 말을 그만두고 행동하는 것이다.", a:"월트 디즈니"}, {q:"나를 죽이지 못하는 고통은 나를 더 강하게 만든다.", a:"니체"},
        {q:"지옥을 걷고 있다면 계속 걸어가라.", a:"윈스턴 처칠"}, {q:"멈추지 않는다면 얼마나 천천히 가는지는 중요치 않다.", a:"공자"}
    ];

    const dayNames = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];
    let data = JSON.parse(localStorage.getItem('12W_Classic')) || { 
        theme:'dark', title:"🏆 나의 12주 마스터피스", startDate:new Date().toISOString().split('T')[0], 
        goals:{long:"", three:"", twelve:""}, images:[null,null,null], currentSeason: 1, history: [],
        weeks: Array.from({length:12}, (_, i) => ({ title: (i+1) + "주차", days: Array.from({length:7}, () => ({ todos: [] })) }))
    };
    
    let currentW = null, openDayIdx = null, timerInterval, timeLeft = 1500, isRunning = false;

    function googleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function googleLogout() { auth.signOut().then(()=>location.reload()); }
    auth.onAuthStateChanged(user => { if(user){ document.getElementById('btn-login').style.display='none'; document.getElementById('user-info').style.display='block'; document.getElementById('user-name').innerText=user.displayName+'님'; loadFromCloud(user.uid); } });

    function save() { 
        localStorage.setItem('12W_Classic', JSON.stringify(data)); 
        const user = auth.currentUser; 
        if(user) db.collection("users").doc(user.uid).set(data).then(() => { 
            const s=document.getElementById('save-status'); s.style.opacity='1'; setTimeout(()=>s.style.opacity='0',800); 
        }); 
        render();
    }

    function loadFromCloud(uid) { db.collection("users").doc(uid).get().then(doc => { if(doc.exists){ data=doc.data(); render(); } }); }
    function getStatusColor(per) { if(per >= 100) return 'var(--success)'; if(per >= 70) return 'var(--primary)'; if(per >= 30) return '#ff9500'; return 'var(--border)'; }
    function getWeekRangeText(baseDate, wIdx) {
        const start = new Date(baseDate); const wStart = new Date(start); wStart.setDate(start.getDate() + (wIdx * 7));
        const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 6);
        return `${wStart.getMonth()+1}/${wStart.getDate()}~${wEnd.getMonth()+1}/${wEnd.getDate()}`;
    }

    function openModal(wIdx) { currentW = wIdx; renderPlanner(wIdx); document.getElementById('planner-modal').style.display = "block"; }
    function renderPlanner(wIdx) {
        const container = document.getElementById('planner-container');
        document.getElementById('modal-title').innerText = `${wIdx + 1}주차 계획`;
        container.innerHTML = dayNames.map((day, dIdx) => {
            const dayData = data.weeks[wIdx].days[dIdx];
            dayData.todos.sort((a,b) => (a.important === b.important ? (a.done === b.done ? 0 : a.done ? 1 : -1) : a.important ? -1 : 1));
            const isActive = openDayIdx === dIdx ? 'active' : '';
            return `<div class="day-section">
                <div class="day-header" onclick="toggleDay(${dIdx})"><span>📅 ${day}</span><span>${isActive ? '▲' : '▼'}</span></div>
                <div class="day-content ${isActive}">
                    ${dayData.todos.map((t, tIdx) => `<div class="todo-item" style="opacity:${t.done?0.5:1}"><input type="checkbox" class="todo-check" ${t.done?'checked':''} onclick="toggleTodo(${wIdx},${dIdx},${tIdx})"><input type="text" class="todo-input" value="${t.text}" oninput="data.weeks[${wIdx}].days[${dIdx}].todos[${tIdx}].text=this.value" style="${t.done?'text-decoration:line-through':''}"></div>`).join('')}
                    <input type="text" placeholder="+ 할 일 추가 (Enter)" onkeypress="if(event.key==='Enter') { data.weeks[${wIdx}].days[${dIdx}].todos.push({text:this.value, done:false}); this.value=''; renderPlanner(${wIdx}); save(); }" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); margin-top:5px; background:var(--card); color:var(--text);">
                </div></div>`;
        }).join('');
    }

    function toggleDay(dIdx) { openDayIdx = (openDayIdx === dIdx) ? null : dIdx; renderPlanner(currentW); }
    function closeModal() { document.getElementById('planner-modal').style.display = "none"; render(); }
    function toggleTodo(wIdx, dIdx, tIdx) { 
        data.weeks[wIdx].days[dIdx].todos[tIdx].done = !data.weeks[wIdx].days[dIdx].todos[tIdx].done; 
        if(data.weeks[wIdx].days[dIdx].todos[tIdx].done) confetti(); 
        if(currentW !== null) renderPlanner(currentW); save(); 
    }

    function archiveSeason() {
        if(!confirm("이번 기수를 마감하고 보관함에 저장할까요?")) return;
        const snapshot = JSON.parse(JSON.stringify({ season: data.currentSeason, title: data.title, startDate: data.startDate, goals: data.goals, images: data.images, weeks: data.weeks }));
        data.history.unshift(snapshot);
        data.currentSeason++; data.startDate = new Date().toISOString().split('T')[0];
        data.weeks = Array.from({length:12}, (_, i) => ({ title: (i+1) + "주차", days: Array.from({length:7}, () => ({ todos: [] })) }));
        confetti(); save();
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('season-display').innerText = `제 ${data.currentSeason}기 진행 중`;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-three').value = data.goals.three;
        document.getElementById('goal-twelve').value = data.goals.twelve;
        
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => { gallery.innerHTML += `<div class="vision-card" onclick="handleImage(${i})">${img ? `<img src="${img}"><div class="img-controls"><button class="img-btn" onclick="event.stopPropagation(); handleImage(${i})">🔄</button></div>` : '+'}</div>`; });
        
        const board = document.getElementById('board'); board.innerHTML = '';
        let totalAll = 0, doneAll = 0;
        data.weeks.forEach((w, wIdx) => {
            let weekTotal = 0, weekDone = 0; w.days.forEach(d => { weekTotal += d.todos.length; weekDone += d.todos.filter(t => t.done).length; });
            const per = weekTotal === 0 ? 0 : Math.round((weekDone / weekTotal) * 100);
            totalAll += weekTotal; doneAll += weekDone;
            board.innerHTML += `<div class="block-card" style="border-color:${getStatusColor(per)}" onclick="openModal(${wIdx})"><span class="block-date">${getWeekRangeText(data.startDate, wIdx)}</span><h3>${w.title}</h3><div style="font-size:1.5em; font-weight:900; color:${getStatusColor(per)}; margin:10px 0;">${per}%</div></div>`;
        });
        const totalRate = totalAll === 0 ? 0 : Math.round((doneAll / totalAll) * 100);
        document.getElementById('total-per-text').innerText = totalRate + '%';
        document.getElementById('main-progress-bar').style.width = totalRate + '%';
        document.getElementById('main-progress-bar').style.backgroundColor = getStatusColor(totalRate);
        
        const pending = document.getElementById('pending-container'); pending.innerHTML = '';
        data.weeks.forEach((w, wIdx) => w.days.forEach((d, dIdx) => d.todos.forEach((t, tIdx) => {
            if(!t.done) {
                const item = document.createElement('div'); item.className = 'todo-item';
                item.innerHTML = `<span class="pending-tag">${wIdx+1}주-${dayNames[dIdx][0]}</span><input type="checkbox" class="todo-check"><span style="flex:1;">${t.text}</span>`;
                item.querySelector('input').onclick = () => toggleTodo(wIdx, dIdx, tIdx);
                pending.appendChild(item);
            }
        })));
        
        const history = document.getElementById('history-grid'); history.innerHTML = '';
        data.history.forEach((h, hIdx) => { history.innerHTML += `<div class="block-card"><span>${h.startDate}</span><h3>제 ${h.season}기</h3></div>`; });
        updateDDay();
    }

    function autoSaveField(f, v) { data[f] = v; save(); }
    function autoSaveGoal(f, v) { data.goals[f] = v; save(); }
    function resizeTitle(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    function updateDDay() { const start=new Date(data.startDate); const end=new Date(start); end.setDate(start.getDate()+84); const diff=Math.ceil((end-new Date())/(1000*60*60*24)); document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁"; }
    function refreshQuote() { const rq=quotes[Math.floor(Math.random()*quotes.length)]; document.getElementById('quote-display').innerText=`${rq.q}`; document.getElementById('quote-author').innerText=`- ${rq.a}`; }
    function toggleTimer() { if(isRunning){ clearInterval(timerInterval); isRunning=false; document.getElementById('timer-btn').innerText="START"; } else { isRunning=true; document.getElementById('timer-btn').innerText="STOP"; timerInterval=setInterval(()=>{ timeLeft--; updateTimerDisp(); if(timeLeft<=0){ clearInterval(timerInterval); alert("집중 끝!"); timeLeft=1500; updateTimerDisp(); isRunning=false; } }, 1000); } }
    function updateTimerDisp() { const m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer').innerText=`${m}:${s<10?'0':''}${s}`; }
    function handleImage(idx) { 
        const i=document.createElement('input'); i.type='file'; 
        i.onchange=e=>{ 
            const f=e.target.files[0]; if(f.size > 1.2*1024*1024) { alert("1.2MB 이하 사진만 가능해요!"); return; }
            const r=new FileReader(); r.onload=ev=>{ data.images[idx]=ev.target.result; save(); }; r.readAsDataURL(f); 
        }; i.click(); 
    }
    function toggleTheme() { data.theme = data.theme==='dark'?'light':'dark'; save(); }
    function resetAll() { if(confirm("초기화할까요?")){ localStorage.clear(); location.reload(); } }
    refreshQuote(); render();
</script>
</body>
</html>
