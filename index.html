<style>
    /* 드래그 애니메이션 및 스타일 */
    .todo-item { 
        transition: transform 0.2s, box-shadow 0.2s;
        touch-action: none; /* 모바일 드래그 충돌 방지 */
    }
    .todo-item.dragging {
        opacity: 0.5;
        background: var(--primary) !important;
        color: white;
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .todo-list-container {
        min-height: 20px;
    }
</style>

<script>
    // ... (기존 변수 및 초기화 로직 동일)

    // 드래그 관련 상태 변수
    let dragSrcIndex = null;
    let dragSrcWeek = null;

    function render() {
        // ... (상단 대시보드 렌더링 로직 동일)

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            // 날짜 계산 및 달성도 로직 동일...
            
            board.innerHTML += `
                <div class="card ${statusClass} ${isCurrent ? 'current-week-card' : ''}">
                    ${isCurrent ? '<small style="color:var(--primary); font-weight:bold;">진행 중인 주차 🔥</small>' : ''}
                    <h3 style="margin-top:0; margin-bottom:2px;">${w.title} <span style="float:right; color:var(--primary);">${per}%</span></h3>
                    <div class="date-range">${dateStr}</div>
                    
                    <div class="todo-list-container" 
                         id="list-${wIdx}" 
                         ondragover="handleDragOver(event)" 
                         style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" 
                                 draggable="true" 
                                 ondragstart="handleDragStart(${wIdx}, ${tIdx}, event)"
                                 ondragend="handleDragEnd(event)"
                                 ondrop="handleDrop(${wIdx}, ${tIdx}, event)">
                                <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; color:var(--accent); font-size:1.2em; padding:5px;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    
                    </div>`;
        });
        updateChart(); calculateTotalPercent();
    }

    // --- 정교해진 드래그 앤 드롭 로직 ---
    function handleDragStart(wIdx, tIdx, e) {
        dragSrcIndex = tIdx;
        dragSrcWeek = wIdx;
        e.target.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
        e.target.classList.remove('dragging');
        // 드래그가 끝날 때 전체 렌더링을 하지 않아도 브라우저가 위치를 잡지만, 
        // 데이터 정합성을 위해 호출
    }

    function handleDragOver(e) {
        e.preventDefault(); // 드롭을 허용하기 위해 필수
        e.dataTransfer.dropEffect = 'move';
        return false;
    }

    function handleDrop(destWeek, destIdx, e) {
        e.stopPropagation();
        e.preventDefault();

        // 같은 주차 내에서만 이동 가능하게 설정 (주차 간 이동 방지 - 데이터 엉킴 방지)
        if (dragSrcWeek !== destWeek) return;
        
        if (dragSrcIndex !== destIdx) {
            const list = data.weeks[destWeek].todos;
            const movedItem = list.splice(dragSrcIndex, 1)[0];
            list.splice(destIdx, 0, movedItem);
            
            save();
            render(); // 순서가 바뀐 데이터를 화면에 즉시 반영
        }
    }

    // 별표 클릭 시 최상단 이동 로직 보강
    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        
        if(item.important) {
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item); // 맨 위로
        } else {
            // 별표 해제 시에는 굳이 위치를 바꾸지 않음 (사용자 의도 존중)
        }
        save(); render();
    }
    
    // ... (이하 addTodo, save, deleteTodo 등 기존 함수들 모두 유지)
</script>
