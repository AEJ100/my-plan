<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #f8f9fa; --card: #ffffff; --text: #212529;
            --primary: #007aff; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #e9ecef; --sub: #868e96;
        }
        [data-theme='dark'] {
            --bg: #121212; --card: #1e1e1e; --text: #e9ecef;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #2c2c2e; --sub: #a1a1a6;
        }
        body { font-family: '-apple-system', 'BlinkMacSystemFont', 'Pretendard', sans-serif; margin: 0; padding: env(safe-area-inset-top) 20px 140px; background-color: var(--bg); color: var(--text); transition: background 0.3s; line-height: 1.5; }
        .container { max-width: 1100px; margin: auto; }
        
        /* 헤더 스타일 */
        .glass-header { position: sticky; top: 0; background: rgba(248, 249, 250, 0.8); backdrop-filter: blur(10px); z-index: 100; padding: 15px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        [data-theme='dark'] .glass-header { background: rgba(18, 18, 18, 0.8); }

        .card { background: var(--card); border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); margin-bottom: 25px; border: 1px solid var(--border); overflow: hidden; transition: transform 0.2s; }
        
        /* 상태별 색상 피드백 */
        .status-perfect { border-top: 6px solid var(--success); }
        .status-good { border-top: 6px solid var(--primary); }
        .status-warning { border-top: 6px solid var(--accent); }

        /* 할 일 항목 디자인 (노션 스타일) */
        .todo-list { padding: 0 20px; }
        .todo-item { display: flex; align-items: center; padding: 10px 0; gap: 12px; border-bottom: 1px solid var(--border); background: var(--card); }
        .todo-item:last-child { border-bottom: none; }
        .drag-handle { cursor: grab; color: var(--sub); font-size: 1.2em; user-select: none; padding: 0 5px; }
        .drag-handle:active { cursor: grabbing; }
        .todo-edit-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 16px; transition: 0.2s; }
        .todo-edit-input:focus { color: var(--primary); }
        
        /* 체크박스 & 별표 커스텀 */
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
        .star-btn { cursor: pointer; font-size: 1.3em; color: #ddd; border: none; background: none; transition: 0.2s; padding: 0; }
        .star-btn.active { color: var(--gold); }

        /* 대시보드 그리드 */
        .stats-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 850px) { .stats-grid { grid-template-columns: 1fr; } }

        .dday-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto; }
        .dday-num { font-size: 2em; font-weight: 800; color: var(--accent); }

        /* 하단 독 (Dock) */
        .save-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 1000; background: var(--card); padding: 10px 25px; border-radius: 100px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border: 1px solid var(--border); }
        .btn { padding: 10px 18px; border-radius: 50px; font-weight: 600; font-size: 0.9em; border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-sub { background: var(--border); color: var(--text); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* 입력 폼 */
        .add-todo-form { display: flex; padding: 15px 20px; gap: 10px; background: var(--bg); border-radius: 15px; margin: 10px 20px 20px; }
        .add-input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.95em; color: var(--text); }

        .ghost { opacity: 0.4; background: var(--border) !important; }
    </style>
</head>
<body data-theme="light">

<div class="glass-header">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="main-title" onclick="editTitle()" style="margin:0; font-weight:800; letter-spacing:-1px;">🏆 MASTERPIECE</h2>
        <div style="display:flex; gap:10px;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="border:none; background:var(--border); padding:8px 12px; border-radius:10px; font-weight:600;">
            <button class="btn btn-sub" onclick="toggleTheme()" style="padding:8px 12px;">🌓</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="card" style="padding:25px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <span style="font-weight:700; font-size:1.1em;">Progress Trend</span>
                <span id="total-per-text" style="color:var(--primary); font-weight:800;">0%</span>
            </div>
            <canvas id="weeklyChart" style="height:180px;"></canvas>
        </div>
        <div class="card" style="padding:25px; text-align:center; display:flex; flex-direction:column; justify-content:center;">
            <div class="dday-circle">
                <span style="font-size:0.7em; font-weight:bold; color:var(--sub);">REMAINING</span>
                <span id="dday-display" class="dday-num">D-00</span>
            </div>
            <p id="quote-display" style="margin-top:20px; font-style:italic; font-size:0.9em; color:var(--sub);">"Loading..."</p>
        </div>
    </div>

    <details class="card" style="border:none;" open>
        <summary style="padding:20px; font-weight:700; cursor:pointer;">🖼️ Vision Board & Strategy</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <div style="padding:0 20px 20px;">
            <label style="font-size:0.8em; font-weight:bold; color:var(--sub);">LONG-TERM VISION</label>
            <textarea id="goal-long" class="goal-area" onchange="data.goals.long=this.value; save();"></textarea>
            <label style="font-size:0.8em; font-weight:bold; color:var(--sub);">3-YEAR TARGET</label>
            <textarea id="goal-3yr" class="goal-area" onchange="data.goals.three=this.value; save();"></textarea>
            <label style="font-size:0.8em; font-weight:bold; color:var(--sub);">12-WEEK KPI</label>
            <textarea id="goal-12wk" class="goal-area" onchange="data.goals.twelve=this.value; save();"></textarea>
        </div>
    </details>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="btn btn-success" onclick="manualSave()">💾 Save</button>
    <button class="btn btn-primary" onclick="exportData()">📤 Backup</button>
    <button class="btn btn-sub" onclick="importData()">📥 Restore</button>
    <button class="btn btn-sub" style="color:var(--accent);" onclick="resetAll()">🧹 Reset</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('12WeekMasterV5')) || {
        theme: 'light', title: "🏆 MASTERPIECE", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let myChart;
    const quotes = ["Think different.", "Just do it.", "Stay hungry, stay foolish.", "Done is better than perfect."];

    function save() { localStorage.setItem('12WeekMasterV5', JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("Saved to Browser!"); }
    function updateStartDate(val) { data.startDate = val; render(); save(); }

    function calculateTotalPercent() {
        let t = 0, d = 0;
        data.weeks.forEach(w => { t += w.todos.length; d += w.todos.filter(x => x.done).length; });
        const per = t === 0 ? 0 : Math.round((d / t) * 100);
        document.getElementById('total-per-text').innerText = per + '%';
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-3yr').value = data.goals.three;
        document.getElementById('goal-12wk').value = data.goals.twelve;
        document.getElementById('quote-display').innerText = quotes[Math.floor(Math.random()*quotes.length)];

        // D-Day 계산
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date().setHours(0,0,0,0)) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : '🏁';

        // 비전 갤러리
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => { gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : '<span style="color:var(--sub);">+</span>'}</div>`; });

        // 보드 렌더링
        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const wS = new Date(start); wS.setDate(start.getDate() + (wIdx * 7));
            const wE = new Date(wS); wE.setDate(wS.getDate() + 6);
            const done = w.todos.filter(x => x.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            
            let statusClass = total > 0 ? (per >= 80 ? 'status-perfect' : per >= 50 ? 'status-good' : 'status-warning') : '';
            const isCurrent = Math.floor((new Date() - start) / 604800000) === wIdx;

            board.innerHTML += `
                <div class="card ${statusClass}" style="${isCurrent ? 'border: 2px solid var(--primary);' : ''}">
                    <div style="padding:20px 20px 10px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:800; font-size:1.1em;">${w.title}</span>
                            <span style="font-weight:700; color:var(--primary);">${per}%</span>
                        </div>
                        <div style="font-size:0.75em; color:var(--sub);">${wS.getMonth()+1}/${wS.getDate()} - ${wE.getMonth()+1}/${wE.getDate()}</div>
                    </div>
                    
                    <div class="todo-list" id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" data-id="${tIdx}">
                                <div class="drag-handle">⠿</div>
                                <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodo(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through; color:var(--sub);':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="border:none; background:none; color:var(--sub); cursor:pointer;">✕</button>
                            </div>
                        `).join('')}
                    </div>

                    <div class="add-todo-form">
                        <input type="text" class="add-input" id="in-${wIdx}" placeholder="New task..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})">
                        <button onclick="addTodo(${wIdx})" style="border:none; background:none; color:var(--primary); font-weight:bold; cursor:pointer;">Add</button>
                    </div>

                    <textarea placeholder="Weekly Review..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="width:calc(100% - 40px); margin:0 20px 20px; border:none; background:var(--bg); border-radius:12px; padding:12px; font-size:0.85em; font-family:inherit; resize:none;">${w.review || ''}</textarea>
                </div>`;
            
            // SortableJS 적용 (드래그 앤 드롭)
            setTimeout(() => {
                new Sortable(document.getElementById(`list-${wIdx}`), {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'ghost',
                    onEnd: (evt) => {
                        const items = data.weeks[wIdx].todos;
                        const [movedItem] = items.splice(evt.oldIndex, 1);
                        items.splice(evt.newIndex, 0, movedItem);
                        save(); calculateTotalPercent(); updateChart();
                    }
                });
            }, 0);
        });
        updateChart(); calculateTotalPercent();
    }

    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) { // 별표 시 최상단 이동
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item);
        }
        save(); render();
    }

    function addTodo(wIdx) { 
        const v = document.getElementById(`in-${wIdx}`); 
        if(v.value) { 
            data.weeks[wIdx].todos.push({text: v.value, done: false, important: false}); 
            v.value=''; save(); render(); 
        } 
    }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function editTodo(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { 
            type: 'line', 
            data: { 
                labels: data.weeks.map(w => w.title), 
                datasets: [{ data: scores, borderColor: '#007aff', borderWidth: 3, pointRadius: 4, tension: 0.4, fill: true, backgroundColor: 'rgba(0,122,255,0.05)' }] 
            }, 
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { display: false, min: 0, max: 100 }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } } 
        });
    }

    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'})); a.download='12weeks.json'; a.click(); }
    function importData() { const i = document.createElement('input'); i.type='file'; i.onchange=e=>{ const r=new FileReader(); r.onload=()=>{data=JSON.parse(r.result); save(); render();}; r.readAsText(e.target.files[0]); }; i.click(); }
    function resetAll() { if(confirm("초기화할까요?")) { localStorage.clear(); location.reload(); } }
    
    render();
</script>
</body>
</html>
