<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12주 마스터: 구름 저장 버전</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        /* 이전과 똑같은 예쁜 디자인 */
        :root { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --primary: #0071e3; --border: #d2d2d7; }
        [data-theme='dark'] { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --border: #3a3a3c; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #34c759; color: white; padding: 5px 15px; border-radius: 20px; opacity: 0; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">구름 창고 저장 완료!</div>

<div class="card" style="display: flex; justify-content: space-between; align-items: center;">
    <h2 id="display-title">🏆 12주 마스터</h2>
    <div>
        <button id="btn-login" class="btn" onclick="googleLogin()">🔑 구글 로그인</button>
        <span id="user-name" style="display:none; font-weight:bold;"></span>
    </div>
</div>

<div class="card">
    <p>로그인을 하면 내가 적은 투두리스트가 구름 창고에 안전하게 저장돼요!</p>
    <div id="board">
        </div>
</div>

<script>
    // 1. 아까 찾은 열쇠(Config)를 여기에 넣었어요!
    const firebaseConfig = {
        apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ",
        authDomain: "week-project-29b17.firebaseapp.com",
        projectId: "week-project-29b17",
        storageBucket: "week-project-29b17.firebasestorage.app",
        messagingSenderId: "277326942781",
        appId: "1:277326942781:web:aef86a0c4bd94c4300d054",
        measurementId: "G-X9NWJ5SSW1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 데이터 저장 변수
    let data = JSON.parse(localStorage.getItem('12W_DATA')) || {
        weeks: Array.from({length: 12}, (_, i) => ({ title: (i+1)+'주차', todos: [] }))
    };

    // 2. 구글 로그인 마법
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((result) => {
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('user-name').style.display = 'inline';
            document.getElementById('user-name').innerText = result.user.displayName + "님";
            confetti();
            loadFromCloud(result.user.uid);
        }).catch(err => alert("로그인 실패: " + err.message));
    }

    // 3. 구름에 저장하기
    function save() {
        localStorage.setItem('12W_DATA', JSON.stringify(data));
        const user = auth.currentUser;
        if (user) {
            db.collection("users").doc(user.uid).set(data);
            document.getElementById('save-status').style.opacity = '1';
            setTimeout(() => { document.getElementById('save-status').style.opacity = '0'; }, 1000);
        }
        render();
    }

    // 4. 구름에서 불러오기
    function loadFromCloud(uid) {
        db.collection("users").doc(uid).get().then((doc) => {
            if (doc.exists) {
                data = doc.data();
                render();
            }
        });
    }

    function render() {
        const board = document.getElementById('board');
        board.innerHTML = data.weeks.map((w, i) => `
            <div style="margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <strong>${w.title}</strong> 
                <button onclick="addTodo(${i})">+</button>
                ${w.todos.map(t => `<div>- ${t}</div>`).join('')}
            </div>
        `).join('');
    }

    function addTodo(wIdx) {
        const task = prompt("할 일을 적으세요:");
        if(task) {
            data.weeks[wIdx].todos.push(task);
            save();
        }
    }

    render();
</script>
</body>
</html>
