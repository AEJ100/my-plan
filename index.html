<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Final Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --gold: #ffcc00;
        }
        [data-theme='light'] {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: 0.3s; overflow-x: hidden; }
        .container { max-width: 800px; margin: auto; }
        
        /* 헤더 섹션 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 1.5em; font-weight: bold; margin: 0; }
        
        /* D-Day & 타이머 카드 (이미지 스타일) */
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .dday-box { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); position: relative; }
        .dday-val { font-size: 4em; font-weight: 900; color: var(--accent); line-height: 1; }
        .per-text { color: var(--primary); font-weight: bold; margin-top: 10px; }

        .timer-card { background: var(--primary); color: white; padding: 25px; border-radius: 20px; text-align: center; }
        .timer-display { font-size: 3em; font-weight: 900; margin-bottom: 10px; }
        .timer-btn { background: white; color: var(--primary); border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 1.1em; cursor: pointer; }

        /* 명언 영역 */
        .quote-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border-left: 4px solid var(--primary); margin-bottom: 25px; }
        
        /* 주차별 리스트 */
        .week-card { background: var(--card); padding: 20px; border-radius: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        .current-week { border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(10,132,255,0.2); }
        .todo-item { display: flex; align-items: center; background: rgba(120,120,120,0.1); padding: 12px; border-radius: 15px; margin-bottom: 10px; gap: 10px; }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 16px; outline: none; }
        
        /* 하단 플로팅 바 (불러오기 포함) */
        .floating-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(28,28,30,0.9); backdrop-filter: blur(15px); padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 1000; width: max-content; }
        .f-btn { border: none; border-radius: 12px; padding: 10px 18px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.9em; }
        .b-save { background: #30d158; }
        .b-backup { background: #0a84ff; }
        .b-load { background: #5e5ce6; }
        .b-reset { background: #8e8e93; }

        /* 모바일 대응 */
        @media (min-width: 600px) {
            .dashboard-grid { grid-template-columns: 1.2fr 1fr; }
        }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header">
        <h1 class="title">🏆 12-Week Masterpiece</h1>
        <button onclick="toggleTheme()" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:8px 12px; border-radius:10px;">🌓 테마 전환</button>
    </div>

    <div class="dashboard-grid">
        <div class="dday-box">
            <div id="dday-display" class="dday-val">D-84</div>
            <div class="per-text">전체 달성률: <span id="total-per">0%</span></div>
            <div style="margin-top:15px; font-size:0.9em;">시작일: <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="background:transparent; color:inherit; border:1px solid var(--border); padding:5px; border-radius:5px;"></div>
        </div>
        <div class="timer-card">
            <div style="font-size:0.9em; opacity:0.8; margin-bottom:5px;">집중 타이머</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" class="timer-btn">START</button>
        </div>
    </div>

    <div id="quote-box" class="quote-box">
        <div id="quote-text" style="font-weight:bold; font-size:1.1em; line-height:1.4;"></div>
        <div id="quote-author" style="font-size:0.9em; color:var(--quote-sub); margin-top:8px;"></div>
    </div>

    <details style="margin-bottom:25px;">
        <summary style="cursor:pointer; font-weight:bold; color:var(--primary);">🖼️ 비전 보드 & 핵심 목표 설정</summary>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:15px;">
            <div id="v-0" onclick="handleImage(0)" style="aspect-ratio:1; background:var(--card); border:2px dashed var(--border); border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
            <div id="v-1" onclick="handleImage(1)" style="aspect-ratio:1; background:var(--card); border:2px dashed var(--border); border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
            <div id="v-2" onclick="handleImage(2)" style="aspect-ratio:1; background:var(--card); border:2px dashed var(--border); border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
        </div>
        <textarea id="goal-text" onchange="data.goal=this.value; save();" placeholder="여기에 당신의 핵심 목표를 적으세요..." style="width:100%; height:80px; margin-top:15px; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:15px; padding:15px; font-family:inherit; box-sizing:border-box;"></textarea>
    </details>

    <div id="board"></div>
</div>

<div class="floating-bar">
    <button class="f-btn b-save" onclick="manualSave()">💾 저장</button>
    <button class="f-btn b-backup" onclick="exportData()">📤 백업</button>
    <button class="f-btn b-load" onclick="importData()">📥 불러오기</button>
    <button class="f-btn b-reset" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대)" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철 (삼성)" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "매일 아침 '오늘 정말 멋진 일을 할 거야'라고 생각하라.", a: "일론 머스크" },
        { q: "성공은 형편없는 스승이다.", a: "빌 게이츠" },
        { q: "승리는 가장 끈기 있는 자에게 돌아간다.", a: "나폴레옹" },
        { q: "어제와 똑같이 살면서 다른 미래를 기대하는 건 미친 짓이다.", a: "아인슈타인" }
    ];

    const DB_KEY = '12W_MASTER_MOBILE_RESTORE';
    let data = JSON.parse(localStorage.getItem(DB_KEY)) || {
        theme: 'dark', startDate: new Date().toISOString().split('T')[0],
        goal: "", images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [] }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false;

    function save() { localStorage.setItem(DB_KEY, JSON.stringify(data)); updateStatus(); }
    function manualSave() { save(); confetti(); alert("성공적으로 저장되었습니다!"); }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-text').value = data.goal || "";
        
        data.images.forEach((img, i) => {
            const box = document.getElementById(`v-${i}`);
            box.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+';
        });

        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-text').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;

        const board = document.getElementById('board');
        board.innerHTML = '';
        
        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        data.weeks.forEach((w, wIdx) => {
            const wS = new Date(start); wS.setDate(start.getDate() + (wIdx * 7));
            const wE = new Date(wS); wE.setDate(wS.getDate() + 6);
            const dateStr = `${wS.getMonth()+1}/${wS.getDate()} ~ ${wE.getMonth()+1}/${wE.getDate()}`;
            const isCurrent = wIdx === currentWeekIdx;

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'current-week' : ''}">
                    <h3 style="margin:0;">${w.title} <small style="font-size:0.6em; color:var(--quote-sub); margin-left:10px;">${dateStr}</small></h3>
                    <div style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <button onclick="toggleStar(${wIdx}, ${tIdx})" style="background:none; border:none; color:${t.star?'var(--gold)':'#ccc'}; font-size:1.2em; cursor:pointer;">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" onchange="editTodo(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through; opacity:0.5':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text);">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white; border:none; border-radius:10px; padding:0 15px;">+</button>
                    </div>
                </div>`;
        });
        updateStatus();
    }

    function updateStatus() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";

        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        document.getElementById('total-per').innerText = total === 0 ? '0%' : Math.round((done/total)*100) + '%';
    }

    function addTodo(w) { const v = document.getElementById(`in-${w}`); if(v.value){ data.weeks[w].todos.push({text:v.value, done:false, star:false}); v.value=''; save(); render(); } }
    function deleteTodo(w, t) { data.weeks[w].todos.splice(t, 1); save(); render(); }
    function toggleTodo(w, t) { data.weeks[w].todos[t].done = !data.weeks[w].todos[t].done; if(data.weeks[w].todos[t].done) confetti(); save(); render(); }
    function toggleStar(w, t) { data.weeks[w].todos[t].star = !data.weeks[w].todos[t].star; save(); render(); }
    function editTodo(w, t, val) { data.weeks[w].todos[t].text = val; save(); }
    function updateStartDate(v) { data.startDate = v; save(); render(); }
    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_masterpiece.json'; a.click(); }
    function importData() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = e => {
            const r = new FileReader();
            r.onload = () => { data = JSON.parse(r.result); save(); render(); };
            r.readAsText(e.target.files[0]);
        };
        i.click();
    }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem(DB_KEY); location.reload(); } }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("Time Up!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }

    render();
</script>
</body>
</html>
