<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: High Visibility</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
            --grad: linear-gradient(135deg, #0071e3, #34c759);
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
            --grad: linear-gradient(135deg, #0a84ff, #30d158);
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }

        /* 🏆 전체 성공률 섹션 (New 강조형) */
        .master-progress-section {
            background: var(--card); border-radius: 20px; padding: 25px; margin-bottom: 15px;
            border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center; position: relative; overflow: hidden;
        }
        .progress-label { font-size: 0.9em; font-weight: 800; color: var(--quote-sub); margin-bottom: 10px; display: block; letter-spacing: 1px; }
        .progress-value { font-size: 3.5em; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 15px; display: block; }
        
        .progress-bar-container { width: 100%; height: 12px; background: var(--input-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--grad); transition: width 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        .dashboard { display: grid; grid-template-columns: 1fr 2fr 1.2fr; gap: 12px; margin-bottom: 15px; }
        .stat-card, .quote-card, .timer-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        
        .dday-box { font-size: 2.2em; font-weight: 900; color: var(--accent); line-height: 1; text-align: center; }
        .timer-card { background: var(--primary); color: white; border: none; }
        .timer-display { font-size: 1.8em; font-weight: 800; margin: 2px 0; text-align: center; }
        
        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; list-style: none; display: flex; justify-content: space-between; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px; box-sizing: border-box; resize: vertical; min-height: 50px; margin-top: 5px; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); border-radius: 18px; padding: 18px; border: 2px solid var(--border); transition: 0.3s; }
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 8px; border-radius: 12px; margin-bottom: 8px; gap: 8px; border: 1px solid var(--border); }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; }

        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .dock-btn { padding: 8px 16px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; color: white; font-size: 0.85em; }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7em; background: var(--success); color: white; padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 3000; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">실시간 저장됨</div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <input type="text" id="master-title" class="main-title-input" style="background:none; border:none; font-size:1.4em; font-weight:800; color:var(--text); outline:none;" oninput="autoSaveField('title', this.value)">
        <button onclick="toggleTheme()" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:5px 10px; border-radius:8px; cursor:pointer;">🌓 테마 전환</button>
    </div>

    <div class="master-progress-section">
        <span class="progress-label">TOTAL PROJECT SUCCESS RATE</span>
        <span id="total-per-display" class="progress-value">0%</span>
        <div class="progress-bar-container">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div class="date-picker-group">
                <span>시작일:</span>
                <input type="date" id="start-date" class="date-picker" onchange="data.startDate=this.value; save(); render();">
            </div>
        </div>

        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" style="font-size: 0.95em; font-weight: 600; border-left: 3px solid var(--primary); padding-left: 12px; line-height: 1.5; cursor:pointer;">명언 로딩 중...</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.8em; margin-top:5px; margin-left:12px;"></div>
        </div>

        <div class="timer-card">
            <div style="font-size:0.75em; font-weight:800; opacity:0.9; text-align:center;">집중 타이머</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); border:none; width:100%; padding:6px; border-radius:8px; font-weight:800; cursor:pointer;">START</button>
        </div>
    </div>

    <details class="vision-section">
        <summary>🖼️ 비전 보드 & 핵심 목표 설정</summary>
        <div style="padding: 15px;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;"></div>
            <div style="margin-bottom:10px;"><span style="font-size:0.8em; font-weight:bold; color:var(--primary);">✨ 원대한 목표</span><textarea id="goal-long" class="goal-textarea" oninput="autoSaveGoal('long', this.value)"></textarea></div>
            <div style="margin-bottom:10px;"><span style="font-size:0.8em; font-weight:bold; color:var(--primary);">🎯 3년 목표</span><textarea id="goal-three" class="goal-textarea" oninput="autoSaveGoal('three', this.value)"></textarea></div>
            <div><span style="font-size:0.8em; font-weight:bold; color:var(--primary);">🚀 12주 계획</span><textarea id="goal-twelve" class="goal-textarea" oninput="autoSaveGoal('twelve', this.value)"></textarea></div>
        </div>
    </details>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759;" onclick="exportData()">📤 백업 파일 저장</button>
    <button class="dock-btn" style="background:#5856d6;" onclick="importData()">📥 복원</button>
    <button class="dock-btn" style="background:#8e8e93;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "오늘 걷지 않으면 내일은 뛰어야 한다.", a: "자기개발 명언" },
        { q: "행동은 모든 성공의 기초다.", a: "피카소" },
        { q: "할 수 있다고 믿는 사람이 결국 해낸다.", a: "정주영" }
    ];

    const STORAGE_KEY = '12W_VIP_V1';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'dark', title: "🏆 12주 인생 마스터피스",
        startDate: new Date().toISOString().split('T')[0],
        lastBackup: new Date().getTime(),
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `${i+1}주차`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false;

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        const s = document.getElementById('save-status'); s.style.opacity = '1'; setTimeout(() => { s.style.opacity = '0'; }, 1000);
        calculateTotalPercent();
    }

    function autoSaveField(field, val) { data[field] = val; save(); }
    function autoSaveGoal(field, val) { data.goals[field] = val; save(); }

    // 🏆 전체 성공률 및 바 애니메이션 업데이트
    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        
        document.getElementById('total-per-display').innerText = `${rate}%`;
        document.getElementById('progress-bar-fill').style.width = `${rate}%`;
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        refreshQuote();

        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.style = "aspect-ratio:1/1; background:var(--input-bg); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;";
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+';
            gallery.appendChild(div);
        });

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const board = document.getElementById('board
