<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Cloud Elite V12</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
            --cal-icon: #0071e3;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
            --cal-icon: #64d2ff;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 50%; outline: none; }
        
        /* 로그인 버튼 스타일 */
        .auth-btn { padding: 8px 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; font-size: 0.8em; transition: 0.2s; }
        .login-btn { background: var(--primary); color: white; }
        .logout-btn { background: var(--input-bg); color: var(--accent); border: 1px solid var(--border); }

        .dashboard { display: grid; grid-template-columns: 1fr 1.8fr 1.5fr; gap: 12px; margin-bottom: 15px; }
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        
        .dday-box { font-size: 3em; font-weight: 900; color: var(--accent); line-height: 1; text-align: center; letter-spacing: -1.5px; }
        .mini-display { font-size: 1.8em; font-weight: 900; margin: 4px 0; letter-spacing: -1px; }
        
        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .timer-part, .progress-part { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; padding: 10px; }
        .timer-part { background: var(--primary); color: white; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); }
        .mini-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 4px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.7em; }
        
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: width 0.6s ease; }

        .quote-card { align-items: flex-start; padding-left: 20px; min-height: 120px; cursor: pointer; }
        .quote-text { font-size: 1.05em; font-weight: 800; border-left: 4px solid var(--primary); padding-left: 15px; line-height: 1.5; }

        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; list-style: none; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 15px; box-sizing: border-box; resize: vertical; min-height: 80px; font-size: 1em; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); border-radius: 18px; padding: 18px; border: 2px solid var(--border); }
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 10px; border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border); }
        .todo-checkbox { width: 1.2em; height: 1.2em; accent-color: var(--success); }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 0.95em; outline: none; }
        .star-icon { cursor: pointer; color: #ccc; }
        .star-icon.active { color: var(--gold); }

        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7em; background: var(--success); color: white; padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 3000; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">구름 저장 완료 ☁️</div>

<div class="container">
    <div class="header-flex">
        <input type="text" id="master-title" class="main-title-input" oninput="autoSaveField('title', this.value)" placeholder="프로젝트 제목">
        <div id="auth-zone">
            <button id="btn-login" class="auth-btn login-btn" onclick="googleLogin()">🔑 구글 로그인</button>
            <div id="user-info" style="display:none; text-align:right;">
                <span id="user-name" style="font-size:0.8em; font-weight:bold; display:block;"></span>
                <button class="auth-btn logout-btn" onclick="googleLogout()" style="padding:2px 8px; font-size:0.6em;">로그아웃</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="text-align:center; margin-top:10px;">
                <input type="date" id="start-date" style="border:none; background:transparent; color:var(--text); cursor:pointer; font-weight:bold; width:110px;" onchange="data.startDate=this.value; save(); render();">
            </div>
        </div>

        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" class="quote-text">클릭하여 명언을 확인하세요.</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.85em; margin-top:8px; margin-left:19px; font-weight:bold;"></div>
        </div>

        <div class="dual-card">
            <div class="timer-part">
                <span style="font-size:0.7em; font-weight:800; opacity:0.9;">집중타이머</span>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" class="mini-btn">START</button>
            </div>
            <div class="progress-part">
                <span style="font-size:0.7em; font-weight:800; color:var(--quote-sub)">전체 달성률</span>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container">
                    <div id="main-progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표</summary>
        <div style="padding: 20px;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;"></div>
            <div style="margin-bottom:15px;"><span style="font-weight:900; color:var(--primary);">✨ 12주 목표</span><textarea id="goal-twelve" class="goal-textarea" oninput="autoSaveGoal('twelve', this.value)"></textarea></div>
        </div>
    </details>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="btn logout-btn" onclick="toggleTheme()" style="background:var(--card); border-radius:50px;">🌓 테마</button>
    <button class="btn logout-btn" onclick="resetAll()" style="background:var(--card); border-radius:50px;">🧹 초기화</button>
</div>

<script>
    // 아까 찾은 열쇠(Firebase Config)
    const firebaseConfig = {
        apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ",
        authDomain: "week-project-29b17.firebaseapp.com",
        projectId: "week-project-29b17",
        storageBucket: "week-project-29b17.firebasestorage.app",
        messagingSenderId: "277326942781",
        appId: "1:277326942781:web:aef86a0c4bd94c4300d054",
        measurementId: "G-X9NWJ5SSW1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const quotes = [
        { q: "실행은 모든 것을 이긴다.", a: "마크 저커버그" },
        { q: "완벽을 기다리면 늦는다.", a: "리드 호프먼" },
        { q: "작게 시작하되, 크게 생각하라.", a: "리처드 브랜슨" },
        { q: "오늘의 선택이 내일의 나를 만든다.", a: "자기개발 격언" }
    ];

    let data = JSON.parse(localStorage.getItem('12W_CLOUD_V12')) || {
        theme: 'dark', title: "🏆 12주 마스터피스",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `${i+1}주차`, todos: [] }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false;

    // 로그인 기능
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => alert("로그인 실패: " + e.message));
    }
    function googleLogout() { auth.signOut().then(() => location.reload()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName + "님";
            loadFromCloud(user.uid);
        }
    });

    function save() {
        localStorage.setItem('12W_CLOUD_V12', JSON.stringify(data));
        const user = auth.currentUser;
        if (user) {
            db.collection("users").doc(user.uid).set(data).then(() => {
                const s = document.getElementById('save-status');
                s.style.opacity = '1'; setTimeout(() => s.style.opacity = '0', 800);
            });
        }
        calculateTotalPercent();
    }

    function loadFromCloud(uid) {
        db.collection("users").doc(uid).get().then(doc => {
            if (doc.exists) { data = doc.data(); render(); }
        });
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.style = "aspect-ratio:1/1; background:var(--input-bg); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;";
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '<span style="opacity:0.3">+</span>';
            gallery.appendChild(div);
        });

        const start = new Date(data.startDate);
        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            w.todos.sort((a, b) => (a.done === b.done) ? (a.important === b.important ? 0 : (a.important ? -1 : 1)) : (a.done ? 1 : -1));
            const per = w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100);
            
            board.innerHTML += `
                <div class="week-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:900;">${wIdx + 1}주차</span>
                        <span style="font-weight:900; color:var(--primary);">${per}%</span>
                    </div>
                    <div id="list-${wIdx}" style="margin-top:10px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" style="${t.done ? 'opacity:0.5;' : ''}">
                                <span class="star-icon ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</span>
                                <input type="checkbox" class="todo-checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" oninput="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <input type="text" id="in-${wIdx}" placeholder="+ 추가 (엔터)" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" 
                        style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); box-sizing:border-box; margin-top:5px;">
                </div>`;
        });
        calculateTotalPercent(); updateDDay();
    }

    // 기본 기능들
    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value.trim()){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function toggleStar(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].important = !data.weeks[wIdx].todos[tIdx].important; save(); render(); }
    function editTodoText(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function autoSaveField(f, v) { data[f] = v; save(); }
    function autoSaveGoal(f, v) { data.goals[f] = v; save(); }
    function updateDDay() { const start = new Date(data.startDate); const end = new Date(start); end.setDate(start.getDate() + 84); const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24)); document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁"; }
    function refreshQuote() { const rq = quotes[Math.floor(Math.random() * quotes.length)]; document.getElementById('quote-display').innerText = `"${rq.q}"`; document.getElementById('quote-author').innerText = `- ${rq.a}`; }
    function toggleTimer() {
        if (isRunning) { clearInterval(timerInterval); isRunning = false; document.getElementById('timer-btn').innerText = "START"; }
        else { isRunning = true; document.getElementById('timer-btn').innerText = "STOP";
            timerInterval = setInterval(() => { timeLeft--; updateTimerDisp(); if (timeLeft <= 0) { clearInterval(timerInterval); alert("집중 끝!"); timeLeft = 1500; updateTimerDisp(); isRunning = false; } }, 1000);
        }
    }
    function updateTimerDisp() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) { const i = document.createElement('input'); i.type='file'; i.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader(); r.onload=ev=>{ data.images[idx]=ev.target.result; save(); render(); }; r.readAsDataURL(f); }; i.click(); }
    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${rate}%`;
        document.getElementById('main-progress-bar').style.width = `${rate}%`;
    }
    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
    function resetAll() { if(confirm("데이터를 초기화할까요?")) { localStorage.removeItem('12W_CLOUD_V12'); location.reload(); } }

    refreshQuote(); render();
</script>
</body>
</html>
