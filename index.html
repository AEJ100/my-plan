<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Final</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: 0.3s; }
        .container { max-width: 1200px; margin: auto; }
        
        /* 헤더 & 대시보드 */
        .header-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .header-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; align-items: center; }
        .dday-big { font-size: 3em; font-weight: 900; color: var(--accent); }
        
        /* 주차별 그리드 보정 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-items: start; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); transition: 0.2s; height: fit-content; }
        
        /* 상태별 색상 */
        .status-perfect { border-top: 6px solid var(--success); }
        .status-good { border-top: 6px solid var(--primary); }
        .status-warning { border-top: 6px solid var(--gold); }
        .current-week-card { border: 2px solid var(--primary) !important; box-shadow: 0 10px 25px rgba(0,113,227,0.15) !important; }

        /* 할 일 리스트 */
        .todo-item { display: flex; align-items: center; background: rgba(120,120,120,0.05); padding: 10px; border-radius: 12px; margin-bottom: 8px; gap: 8px; }
        .todo-edit-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 16px; font-family: inherit; }
        .star-btn { cursor: pointer; font-size: 1.2em; color: #ccc; border: none; background: none; }
        .star-btn.active { color: var(--gold); }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 12px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); font-size: 1.5em; }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 0.9em; background: var(--bg); color: var(--text); margin-bottom: 10px; resize: none; font-family: inherit; }

        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1000; background: var(--card); padding: 10px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; padding: 8px 12px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        
        .progress-bar-bg { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2 style="margin:0;">🏆 12-Week Masterpiece</h2>
        <div style="display:flex; gap:10px;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="border:1px solid var(--border); padding:5px; border-radius:5px;">
            <button onclick="toggleTheme()" style="background:var(--text); color:var(--card);">🌓</button>
        </div>
    </div>

    <div class="header-card">
        <div class="header-grid">
            <div style="text-align: center;">
                <div id="dday-display" class="dday-big">D-00</div>
                <div style="font-weight:bold; font-size:0.9em;">Total: <span id="total-per-text">0%</span></div>
                <div class="progress-bar-bg"><div id="total-per-bar" class="progress-bar-fill"></div></div>
            </div>
            <div style="border-left: 1px solid var(--border); padding-left: 20px;">
                <div id="quote-display" style="font-size: 1.1em; font-weight: bold; color: var(--primary);"></div>
                <div id="quote-author" style="font-size: 0.85em; color: var(--quote-sub); margin-top: 5px;"></div>
            </div>
            <div style="text-align: center; border-left: 1px solid var(--border);">
                <div id="timer" style="font-size: 1.5em; font-weight: bold;">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" style="background:var(--primary); color:white; margin-top:5px; width:80px;">START</button>
            </div>
        </div>
    </div>

    <details style="margin-bottom: 25px;" open>
        <summary style="cursor:pointer; font-weight:bold; margin-bottom:10px;">🖼️ Vision & Goals</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <textarea id="goal-long" class="goal-area" placeholder="원대한 목표" onchange="data.goals.long=this.value; save();"></textarea>
        <textarea id="goal-12wk" class="goal-area" placeholder="12주 핵심 계획" onchange="data.goals.twelve=this.value; save();"></textarea>
    </details>

    <div class="card" style="margin-bottom:25px;"><canvas id="weeklyChart" style="height:120px;"></canvas></div>
    
    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대)" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철 (삼성)" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "매일 아침 오늘 정말 멋진 일을 할 거야라고 생각하라.", a: "일론 머스크" },
        { q: "성공은 최종적인 것이 아니며 실패는 치명적이지 않다.", a: "윈스턴 처칠" },
        { q: "어제와 똑같이 살면서 다른 미래를 기대하는 건 미친 짓이다.", a: "아인슈타인" },
        { q: "위대한 일을 하는 유일한 방법은 당신의 일을 사랑하는 것이다.", a: "스티브 잡스" }
    ];

    // 데이터 키값 고정 (버전 충돌 방지)
    const STORAGE_KEY = '12WEEK_MASTER_FINAL_FIXED';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'light', startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
        calculateTotalPercent();
        updateChart();
    }

    function manualSave() { save(); confetti(); alert("저장 완료!"); }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-12wk').value = data.goals.twelve || "";

        // 비전 보드
        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = data.images.map((img, i) => `
            <div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : '+'}</div>
        `).join('');

        // 명언 (한 번만 설정)
        if(!document.getElementById('quote-display').innerText) {
            const rq = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-display').innerText = `"${rq.q}"`;
            document.getElementById('quote-author').innerText = `- ${rq.a}`;
        }

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        // D-Day
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";

        const board = document.getElementById('board');
        board.innerHTML = ''; // 초기화

        data.weeks.forEach((w, wIdx) => {
            const wS = new Date(start); wS.setDate(start.getDate() + (wIdx * 7));
            const wE = new Date(wS); wE.setDate(wS.getDate() + 6);
            const dateStr = `${wS.getMonth()+1}/${wS.getDate()} ~ ${wE.getMonth()+1}/${wE.getDate()}`;
            
            const done = w.todos.filter(t => t.done).length;
            const total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            
            let sClass = total > 0 ? (per >= 80 ? 'status-perfect' : per >= 50 ? 'status-good' : 'status-warning') : '';
            if(wIdx === currentWeekIdx) sClass += ' current-week-card';

            const card = document.createElement('div');
            card.className = `card ${sClass}`;
            card.innerHTML = `
                <h3 style="margin:0;">${w.title} <span style="float:right; color:var(--primary);">${per}%</span></h3>
                <div style="font-size:0.8em; color:var(--quote-sub); margin-bottom:15px;">${dateStr}</div>
                <div id="list-${wIdx}">
                    ${w.todos.map((t, tIdx) => `
                        <div class="todo-item">
                            <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                            <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                            <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodo(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                            <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="color:var(--accent); background:none; font-size:1.2em;">×</button>
                        </div>
                    `).join('')}
                </div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="in-${wIdx}" placeholder="할 일 추가" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border);">
                    <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">+</button>
                </div>
                <textarea class="goal-area" style="margin-top:10px; height:50px;" placeholder="주간 회고" onchange="data.weeks[${wIdx}].review=this.value; save();">${w.review || ''}</textarea>
            `;
            board.appendChild(card);
        });
        updateChart();
        calculateTotalPercent();
    }

    // 기능 함수들 (직접 데이터 수정 후 render 호출)
    function addTodo(wIdx) {
        const input = document.getElementById(`in-${wIdx}`);
        if(!input.value) return;
        data.weeks[wIdx].todos.push({ text: input.value, done: false, important: false });
        save();
        render();
    }

    function deleteTodo(wIdx, tIdx) {
        data.weeks[wIdx].todos.splice(tIdx, 1);
        save();
        render();
    }

    function toggleTodo(wIdx, tIdx) {
        data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done;
        if(data.weeks[wIdx].todos[tIdx].done) confetti();
        save();
        render();
    }

    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) {
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item);
        }
        save();
        render();
    }

    function editTodo(wIdx, tIdx, val) {
        data.weeks[wIdx].todos[tIdx].text = val;
        save();
    }

    function calculateTotalPercent() {
        let t = 0, d = 0;
        data.weeks.forEach(w => { t += w.todos.length; d += w.todos.filter(i => i.done).length; });
        const p = t === 0 ? 0 : Math.round((d / t) * 100);
        document.getElementById('total-per-text').innerText = p + '%';
        document.getElementById('total-per-bar').style.width = p + '%';
    }

    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } } });
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function updateStartDate(v) { data.startDate = v; save(); render(); }
    function exportData() { const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week.json'; a.click(); }
    function resetAll() { if(confirm("초기화할까요?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    render();
</script>
</body>
</html>
