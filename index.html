<script>
    // ... (중략: 기존 데이터 및 변수들)

    function render() {
        // (기존 렌더링 로직 유지하며 아래 내용 추가/수정)
        
        const now = new Date();
        const start = new Date(data.startDate);
        // 현재가 시작일로부터 몇 번째 주인지 계산 (0부터 시작)
        const currentWeekIdx = Math.floor((now - start) / (1000 * 60 * 60 * 24 * 7));

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const isCurrentWeek = wIdx === currentWeekIdx;
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            
            // 현재 주차라면 카드 테두리에 강조 효과를 줍니다.
            const highlightStyle = isCurrentWeek ? 'border: 2px solid var(--primary); transform: scale(1.02);' : '';

            board.innerHTML += `
                <div class="card" style="${highlightStyle}">
                    ${isCurrentWeek ? '<span style="background:var(--primary); color:white; padding:2px 8px; border-radius:10px; font-size:0.7em; position:absolute; top:-10px; left:20px;">CURRENT WEEK</span>' : ''}
                    <h3 style="margin-top:0; font-size:1.1em;">${w.title} <span style="float:right; color:var(--primary); font-size:0.8em;">${per}%</span></h3>
                    <div ondragover="onDragOver(event)">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" draggable="true" ondragstart="onDragStart(${wIdx}, ${tIdx})" ondrop="onDrop(${wIdx}, ${tIdx})">
                                <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; color:var(--accent); font-size:1.2em;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" placeholder="할 일 입력 (Enter)" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">+</button>
                    </div>
                    <textarea placeholder="주간 회고 기록..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="width:100%; height:60px; margin-top:15px; border-radius:10px; border:1px solid var(--border); padding:8px; font-size:0.85em; background:var(--bg); color:var(--text); font-family:inherit;">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart(); calculateTotalPercent();
    }
    // ... (나머지 함수 유지)
</script>
