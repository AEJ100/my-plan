<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c;
        }
        body { 
            font-family: -apple-system, sans-serif; margin: 0; padding: 20px; transition: 0.3s; 
            min-height: 100vh; background-color: var(--bg); color: var(--text); box-sizing: border-box; padding-bottom: 120px;
        }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); }
        
        /* D-Day & 총 달성률 */
        .header-flex { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; }
        .total-percent { font-size: 1.5em; font-weight: bold; color: var(--primary); margin-top: 10px; }
        
        /* 접기/펼치기(Details) 스타일 */
        details { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        summary { padding: 15px; font-weight: bold; background: var(--bg); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.8em; transition: 0.3s; }
        details[open] summary::after { transform: rotate(180deg); }
