<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12주 마스터피스: 시즌 관리자</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.3s; padding-bottom: 120px; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 25px; position: relative; }
        
        .main-title { font-size: 2.2em; font-weight: bold; cursor: pointer; border-bottom: 3px dashed var(--primary); }
        .streak-badge { background: linear-gradient(135deg, #ff9500, #ff5e3a); color: white; padding: 8px 15px; border-radius: 15px; font-weight: bold; font-size: 0.9em; }
        
        /* 중요도 별표 스타일 */
        .star-btn { cursor: pointer; font-size: 1.2em; color: #ccc; transition: 0.2s; border: none; background: none; }
        .star-btn.active { color: var(--gold); }

        .prog-container { background: rgba(0,0,0,0.1); border-radius: 10px; height: 14px; margin: 15px 0; overflow: hidden; }
        .prog-bar { background: linear-gradient(90deg, var(--primary), var(--success)); height: 100%; width: 0%; transition: 0.8s ease-in-out; }
        
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }
        .todo-item { display: flex; align-items: center; background: rgba(0,0,0,0.03); padding: 12px; border-radius: 12px; margin-bottom: 10px; gap: 10px; }
        
        /* 하단 고정 바 */
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: rgba(255,255,255,0.85); padding: 12px 25px; border-radius: 40px; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.3); }
        button { cursor: pointer; border: none; border-radius: 20px; font-weight: bold; transition: 0.2s; }
        .btn-save { background: var(--success); color: white; padding: 10px 25px; }
        .btn-reset { background: var(--accent); color: white; padding: 10px 20px; }
        
        .capsule-msg { font-size: 0.85em; color: var(--primary); background: rgba(0,113,227,0.1); padding: 8px; border-radius: 10px; margin-top: 10px; display: none; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header">
        <div>
            <span class="main-title" id="main-title-display" onclick="editMainTitle()">🏆 My 12-Week Masterpiece</span>
            <div style="margin-top:10px; display:flex; align-items:center; gap:10px;">
                시작: <input type="date" id="start-date-input" onchange="updateStartDate(this.value)" style="border-radius:10px; border:1px solid #ddd; padding:5px;">
                <span id="streak-display" class="streak-badge">연속 🔥 0일</span>
            </div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="editCapsule()" style="background:var(--gold); color:black; padding:10px 15px;">🎁 미래의 나에게</button>
            <button onclick="toggleTheme()" style="background:var(--primary); color:white; padding:10px 15px;">🌙/☀️</button>
        </div>
    </div>

    <div id="capsule-display" class="card" style="display:none; background: linear-gradient(135deg, #fff9e6, #fff); border: 2px solid var(--gold);">
        <h3 style="margin:0; color:var(--gold);">📩 도착한 타임캡슐 메시지</h3>
        <p id="capsule-text" style="font-style:italic; margin:10px 0 0 0;"></p>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>🖼️ Vision Board</h2>
            <span id="dday-display" style="font-weight:bold; color:var(--accent);">D-Day 계산 중...</span>
        </div>
        <div class="vision-grid" id="vision-gallery"></div>
    </div>

    <div class="card">
        <h2>📊 전체 달성률: <span id="total-percent">0%</span></h2>
        <div class="prog-container"><div id="total-bar" class="prog-bar"></div></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="btn-save" onclick="manualSave()">💾 저장하기</button>
    <button class="btn-reset" onclick="resetSeason()">🔄 시즌 종료(리셋)</button>
    <button style="background:#0071e3; color:white; padding:10px 15px;" onclick="exportData()">📤 백업</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('v2Data')) || {
        theme: 'light',
        mainTitle: "🏆 My 12-Week Masterpiece",
        startDate: new Date().toISOString().split('T')[0],
        images: [null, null, null],
        streak: 0,
        lastCheckDate: null,
        capsuleMsg: "",
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    function editMainTitle() {
        let val = prompt("대시보드 제목을 수정하세요:", data.mainTitle);
        if(val) { data.mainTitle = val; render(); }
    }

    function editCapsule() {
        let val = prompt("미래의 나(8주차 이후)에게 보낼 응원 메시지를 적으세요:", data.capsuleMsg);
        if(val) { data.capsuleMsg = val; alert("타임캡슐이 봉인되었습니다! 8주차에 공개됩니다."); render(); }
    }

    function resetSeason() {
        if(confirm("정말로 시즌을 종료하고 초기화할까요? (중요한 데이터는 미리 백업받으세요!)")) {
            localStorage.removeItem('v2Data');
            location.reload();
        }
    }

    function updateStartDate(val) { data.startDate = val; render(); }
    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; render(); }

    function manualSave() {
        localStorage.setItem('v2Data', JSON.stringify(data));
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.8 } });
        alert("모든 데이터가 저장되었습니다!");
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'my-12-week-v2.json'; a.click();
    }

    function toggleStar(wIdx, tIdx) {
        data.weeks[wIdx].todos[tIdx].important = !data.weeks[wIdx].todos[tIdx].important;
        render();
    }

    function updateStreak() {
        const today = new Date().toISOString().split('T')[0];
        if (data.lastCheckDate !== today) {
            data.streak++;
            data.lastCheckDate = today;
        }
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title-display').innerText = data.mainTitle;
        document.getElementById('start-date-input').value = data.startDate;
        document.getElementById('streak-display').innerText = `연속 🔥 ${data.streak}일`;

        const start = new Date(data.startDate);
        const diffDays = Math.ceil((new Date() - start) / 86400000);
        const currentWeek = Math.ceil(diffDays / 7);

        // 타임캡슐 로직: 8주차 이후에만 노출
        if (currentWeek >= 8 && data.capsuleMsg) {
            document.getElementById('capsule-display').style.display = 'block';
            document.getElementById('capsule-text').innerText = data.capsuleMsg;
        }

        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "종료";

        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            gallery.innerHTML += `<div class="vision-img-card">
                ${img ? `<img src="${img}"><button onclick="data.images[${i}]=null; render();" style="position:absolute;top:5px;right:5px;background:var(--accent);color:white;border:none;border-radius:50%;cursor:pointer;">×</button>` : 
                `<label style="cursor:pointer;color:var(--primary);">📸 사진<input type="file" hidden onchange="const r=new FileReader();r.onload=e=>{data.images[${i}]=e.target.result;render();};r.readAsDataURL(this.files[0])"></label>`}
            </div>`;
        });

        let board = document.getElementById('board'); board.innerHTML = '';
        let tDone = 0, tAll = 0;

        data.weeks.forEach((week, wIdx) => {
            let wDone = week.todos.filter(t => t.done).length;
            let wTotal = week.todos.length;
            let wPercent = wTotal === 0 ? 0 : Math.round((wDone / wTotal) * 100);
            tDone += wDone; tAll += wTotal;

            board.innerHTML += `
                <div class="card" style="${currentWeek === wIdx + 1 ? 'border: 2px solid var(--primary);' : ''}">
                    <h3>${week.title} ${currentWeek === wIdx + 1 ? '📍' : ''} <small>${wPercent}%</small></h3>
                    <div class="prog-container"><div class="prog-bar" style="width:${wPercent}%"></div></div>
                    <div>
                        ${week.todos.map((t, tIdx) => `
                            <div class="todo-item" style="${t.important ? 'border-left: 5px solid var(--gold);' : ''}">
                                <button class="star-btn ${t.important ? 'active' : ''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--success);" onclick="data.weeks[${wIdx}].todos[${tIdx}].done=!data.weeks[${wIdx}].todos[${tIdx}].done; if(data.weeks[${wIdx}].todos[${tIdx}].done){confetti(); updateStreak();} render();">
                                <span style="flex-grow:1; ${t.done ? 'text-decoration:line-through;opacity:0.5;' : ''}">${t.text}</span>
                                <button onclick="data.weeks[${wIdx}].todos.splice(${tIdx},1); render();" style="background:none;border:none;color:var(--accent);cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일..." style="flex-grow:1; padding:8px; border-radius:10px; border:1px solid #ddd;">
                        <button onclick="let v=document.getElementById('in-${wIdx}'); if(v.value){data.weeks[${wIdx}].todos.push({text:v.value,done:false,important:false}); render();}" style="background:var(--primary); color:white; padding:5px 15px; border-radius:10px;">+</button>
                    </div>
                    <textarea placeholder="주간 회고..." style="width:100%; margin-top:10px; border:none; background:rgba(0,0,0,0.02); padding:8px; border-radius:8px; height:40px;" onchange="data.weeks[${wIdx}].review=this.value; localStorage.setItem('v2Data', JSON.stringify(data));">${week.review || ""}</textarea>
                </div>`;
        });

        let totalPercent = tAll === 0 ? 0 : Math.round((tDone / tAll) * 100);
        document.getElementById('total-percent').innerText = totalPercent + "%";
        document.getElementById('total-bar').style.width = totalPercent + "%";
        localStorage.setItem('v2Data', JSON.stringify(data));
    }
    render();
</script>
</body>
</html>
