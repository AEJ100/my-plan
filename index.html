<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Midnight</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000; --card: #141414; --text: #ffffff;
            --primary: #007aff; --success: #34c759; --accent: #ff3b30; 
            --border: #2c2c2e; --quote-sub: #8e8e93; --gold: #ffcc00;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: 0.3s; }
        .container { max-width: 1100px; margin: auto; }
        
        /* 헤더 & 대시보드 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .main-title { font-size: 1.5em; font-weight: 800; color: #fff; margin: 0; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 2.5fr 1fr; gap: 15px; align-items: stretch; margin-bottom: 25px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        
        .dday-val { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; }
        .quote-box { background: #0a0a0a; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--border); }
        .timer-card { background: var(--primary); border-radius: 20px; padding: 15px; text-align: center; color: white; min-width: 150px; }
        
        /* 투두 & 주차 카드 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .week-card { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); transition: 0.3s; }
        .current-week-card { border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(0,122,255,0.15); }
        
        .todo-item { display: flex; align-items: center; background: #1c1c1e; padding: 10px; border-radius: 15px; margin-bottom: 8px; gap: 10px; border: 1px solid transparent; }
        .star-btn { background: #fff; color: #000; border-radius: 10px; border: none; width: 45px; height: 45px; font-size: 1.2em; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .star-btn.active { background: var(--gold); }
        
        .todo-edit-input { flex: 1; border: none; background: transparent; color: #fff; outline: none; font-size: 16px; }
        .add-btn { background: var(--primary); color: white; border: none; border-radius: 12px; width: 40px; height: 40px; font-size: 1.5em; cursor: pointer; }

        /* 하단 도크 */
        .save-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(28,28,30,0.8); backdrop-filter: blur(20px); padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 1000; }
        .dock-btn { display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 12px; font-weight: bold; font-size: 0.9em; border: none; cursor: pointer; color: white; }

        /* 입력창 & 차트 */
        .chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 25px; height: 180px; }
        .goal-area { width: 100%; background: #0a0a0a; border: 1px solid var(--border); border-radius: 15px; color: #fff; padding: 12px; margin-bottom: 10px; font-family: inherit; resize: none; }

        @media (max-width: 850px) {
            .dashboard { grid-template-columns: 1fr; }
            .timer-card { order: -1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="main-title">🏆 12-Week Masterpiece</h1>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="background:var(--card); color:white; border:1px solid var(--border); padding:8px; border-radius:10px;">
            <button onclick="toggleTheme()" style="background:var(--card); color:white; border:1px solid var(--border); padding:8px 12px; border-radius:10px;">🌓 테마 전환</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-val">D-84</div>
            <div style="margin-top:10px; font-weight:bold; color:var(--primary);">전체 달성률: <span id="total-per-text">0%</span></div>
        </div>
        <div class="quote-box">
            <div id="quote-display" style="font-size: 1.1em; font-weight: 700; line-height: 1.5; color:#eee;">"..."</div>
            <div id="quote-author" style="font-size: 0.85em; color: var(--quote-sub); margin-top: 10px;"></div>
        </div>
        <div class="timer-card">
            <div style="font-size:0.8em; font-weight:bold; opacity:0.9; margin-bottom:5px;">집중 타이머</div>
            <div id="timer" style="font-size: 2.2em; font-weight: 900; margin-bottom:10px;">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="width:100%; background:white; color:var(--primary); border:none; padding:8px; border-radius:10px; font-weight:bold; cursor:pointer;">START</button>
        </div>
    </div>

    <details style="margin-bottom:25px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:15px;">
        <summary style="cursor:pointer; font-weight:bold; color:var(--quote-sub);">🖼️ 비전 보드 & 3단계 목표 시스템</summary>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin: 15px 0;">
            <div id="v-0" onclick="handleImage(0)" style="aspect-ratio:1; background:#000; border:1px dashed var(--border); border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
            <div id="v-1" onclick="handleImage(1)" style="aspect-ratio:1; background:#000; border:1px dashed var(--border); border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
            <div id="v-2" onclick="handleImage(2)" style="aspect-ratio:1; background:#000; border:1px dashed var(--border); border-radius:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
        </div>
        <textarea id="goal-long" class="goal-area" placeholder="원대한 목표..." onchange="data.goals.long=this.value; save();"></textarea>
        <textarea id="goal-12wk" class="goal-area" placeholder="12주 핵심 KPI..." onchange="data.goals.twelve=this.value; save();"></textarea>
    </details>

    <div class="chart-container"><canvas id="weeklyChart"></canvas></div>
    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759;" onclick="manualSave()">💾 저장</button>
    <button class="dock-btn" style="background:#007aff;" onclick="exportData()">📤 백업</button>
    <button class="dock-btn" style="background:#5856d6;" onclick="importData()">📥 불러오기</button>
    <button class="dock-btn" style="background:#8e8e93;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대)" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철 (삼성)" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "성공은 형편없는 스승이다. 똑똑한 사람들을 유혹해 결코 패배할 수 없다고 믿게 만든다.", a: "빌 게이츠" },
        { q: "매일 아침 '오늘 정말 멋진 일을 할 거야'라고 생각하라.", a: "일론 머스크" },
        { q: "비즈니스 세계에서 백미러는 앞유리보다 항상 더 선명하다.", a: "워런 버핏" },
        { q: "실패는 다시 시작할 수 있는 기회일 뿐이다. 이번에는 더 현명하게 말이다.", a: "헨리 포드" },
        { q: "당신이 할 수 있다고 믿든 할 수 없다고 믿든, 당신의 믿음대로 될 것이다.", a: "헨리 포드" },
        { q: "품질은 아무도 보고 있지 않을 때 제대로 하는 것을 의미한다.", a: "헨리 포드" },
        { q: "위대한 일을 하는 유일한 방법은 당신이 하는 일을 사랑하는 것이다.", a: "스티브 잡스" },
        { q: "창조성이란 단지 사물을 연결하는 것이다.", a: "스티브 잡스" },
        { q: "남의 인생을 사느라 시간을 낭비하지 마십시오.", a: "스티브 잡스" },
        { q: "늘 갈망하고, 늘 우직하게 나아가십시오.", a: "스티브 잡스" },
        { q: "고객은 제품을 보여주기 전까지는 자신이 무엇을 원하는지 모른다.", a: "스티브 잡스" },
        { q: "아이디어는 중요하지 않다. 실행이 전부다.", a: "데릭 시버스" },
        { q: "성공의 비결은 평범한 일을 비범하게 하는 것이다.", a: "존 D. 록펠러" },
        { q: "좋은 것을 포기하고 위대한 것으로 가기를 두려워하지 마라.", a: "존 D. 록펠러" },
        { q: "돈을 쫓지 말고 열정을 쫓아라. 그러면 돈은 따라오게 되어 있다.", a: "토니 셰이" },
        { q: "당신의 가장 불만족스러운 고객이 당신의 가장 큰 학습 원천이다.", a: "빌 게이츠" },
        { q: "성장하지 않는 것은 죽어가는 것이다.", a: "레이 크록" },
        { q: "불가능하다고 생각하는 순간 불가능해진다.", a: "이건희 (삼성)" },

        { q: "모든 것이 당신에게 불리하게 돌아가는 것처럼 보일 때, 비행기는 바람을 가르고 이륙한다는 사실을 기억하라.", a: "헨리 포드" },

        { q: "평판을 쌓는 데는 20년이 걸리지만, 그것을 무너뜨리는 데는 5분이면 충분하다.", a: "워런 버핏" },
        { q: "가격은 당신이 지불하는 것이고, 가치는 당신이 얻는 것이다.", a: "워런 버핏" },
        { q: "오늘 그늘에 앉아 쉴 수 있는 이유는 오래전에 누군가가 나무를 심었기 때문이다.", a: "워런 버핏" },

        { q: "행동은 모든 성공의 기초이다.", a: "파블로 피카소" },
        { q: "지옥을 걷고 있다면 계속 걸어가라.", a: "윈스턴 처칠" },
        { q: "성공이란 열정을 잃지 않고 실패에서 실패로 나아가는 능력이다.", a: "윈스턴 처칠" },
        { q: "비관주의자는 모든 기회에서 어려움을 보고, 낙관주의자는 모든 어려움에서 기회를 본다.", a: "윈스턴 처칠" },
        { q: "기회는 작업복을 입고 있어서 대부분의 사람들이 놓친다. 그것은 노동처럼 보이기 때문이다.", a: "토마스 에디슨" },
        { q: "천재는 1%의 영감과 99%의 노력으로 만들어진다.", a: "토마스 에디슨" },
        { q: "나는 실패하지 않았다. 단지 작동하지 않는 10,000가지 방법을 발견했을 뿐이다.", a: "토마스 에디슨" },
        { q: "많은 인생의 실패자들은 포기할 때 자신이 성공에 얼마나 가까이 있었는지 모른다.", a: "토마스 에디슨" },
        { q: "시작하는 방법은 말을 그만두고 행동을 시작하는 것이다.", a: "월트 디즈니" },
        { q: "꿈꿀 수 있다면 할 수 있다.", a: "월트 디즈니" },
        { q: "웃음은 유행을 타지 않고, 상상력은 나이가 없으며, 꿈은 영원하다.", a: "월트 디즈니" },
        { q: "과거는 아플 수 있다. 하지만 과거로부터 도망치거나, 배울 수 있다.", a: "월트 디즈니" },
        { q: "미래는 자신의 꿈의 아름다움을 믿는 사람들의 것이다.", a: "엘리너 루스벨트" },
        { q: "당신의 허락 없이는 아무도 당신에게 열등감을 느끼게 할 수 없다.", a: "엘리너 루스벨트" },
        { q: "위대한 마음은 아이디어를 논하고, 보통의 마음은 사건을 논하며, 좁은 마음은 사람을 논한다.", a: "엘리너 루스벨트" },
        { q: "성공은 최종적인 것이 아니며, 실패는 치명적인 것이 아니다. 중요한 것은 계속하려는 용기다.", a: "윈스턴 처칠" },
        { q: "어제와 똑같이 살면서 다른 미래를 기대하는 것은 정신병 초기 증세이다.", a: "알베르트 아인슈타인" },
        { q: "지식보다 중요한 것은 상상력이다.", a: "알베르트 아인슈타인" },
        { q: "한 번도 실수하지 않은 사람은 한 번도 새로운 것을 시도하지 않은 사람이다.", a: "알베르트 아인슈타인" },
        { q: "어려움의 한가운데에 기회가 있다.", a: "알베르트 아인슈타인" },

        { q: "논리는 당신을 A에서 B로 데려다줄 것이지만, 상상력은 당신을 어디든 데려다줄 것이다.", a: "알베르트 아인슈타인" },

        { q: "자신을 믿는 순간, 당신은 어떻게 살아야 할지 알게 될 것이다.", a: "괴테" },
        { q: "아는 것만으로는 충분하지 않다. 적용해야 한다. 의지만으로는 충분하지 않다. 행해야 한다.", a: "괴테" },
        { q: "서두르지 마라, 그러나 쉬지도 마라.", a: "괴테" },
        { q: "가장 큰 영광은 한 번도 떨어지지 않는 것이 아니라, 떨어질 때마다 일어나는 데 있다.", a: "공자" },
        { q: "어디를 가든 마음을 다해 가라.", a: "공자" },
        { q: "멈추지 않는다면 얼마나 천천히 가느냐는 중요하지 않다.", a: "공자" },

        { q: "자신을 이기는 것이 가장 위대한 승리다.", a: "플라톤" },
        { q: "남에게 대접받고자 하는 대로 남을 대접하라.", a: "황금률" },
        { q: "승리는 가장 끈기 있는 자에게 돌아간다.", a: "나폴레옹" },
        { q: "불가능이라는 단어는 바보들의 사전에만 있다.", a: "나폴레옹" },
        { q: "약속을 지키는 최선의 방법은 약속을 하지 않는 것이다.", a: "나폴레옹" },
        { q: "가장 강한 사람은 자신을 통제할 수 있는 사람이다.", a: "세네카" },
        { q: "운은 준비가 기회를 만났을 때 일어나는 것이다.", a: "세네카" },
        { q: "우리는 현실에서보다 상상 속에서 더 자주 고통받는다.", a: "세네카" },

        { q: "준비에 실패하는 것은 실패를 준비하는 것이다.", a: "벤자민 프랭클린" },
        { q: "지식에 투자하는 것이 가장 높은 이자를 지불한다.", a: "벤자민 프랭클린" },
        { q: "잃어버린 시간은 다시 찾을 수 없다.", a: "벤자민 프랭클린" },
        { q: "모든 성취의 시작점은 갈망이다.", a: "나폴레온 힐" },
        { q: "당신이 생각하고 믿을 수 있는 것은 무엇이든 성취할 수 있다.", a: "나폴레온 힐" },
        { q: "기다리지 마라. 시간은 결코 '딱 좋은' 때가 없다.", a: "나폴레온 힐" },
        { q: "가장 큰 한계는 당신이 스스로 설정한 한계다.", a: "나폴레온 힐" },
        { q: "동기부여는 오래가지 않는다. 그래서 매일 필요한 것이다. 목욕처럼.", a: "지그 지글러" },
        { q: "시작하기 위해 위대해질 필요는 없지만, 위대해지기 위해 시작해야 한다.", a: "지그 지글러" },
        { q: "당신이 세상에서 원하는 변화가 되어라.", a: "마하트마 간디" },
        { q: "내일 죽을 것처럼 살고, 영원히 살 것처럼 배워라.", a: "마하트마 간디" },
        { q: "행복은 당신의 생각, 말, 행동이 조화를 이룰 때 찾아온다.", a: "마하트마 간디" },
        { q: "힘은 신체적인 능력에서 나오는 것이 아니라 불굴의 의지에서 나온다.", a: "마하트마 간디" },
        { q: "나약한 자는 결코 용서할 수 없다. 용서는 강한 자의 특권이다.", a: "마하트마 간디" },
        { q: "미래를 예측하는 가장 좋은 방법은 미래를 창조하는 것이다.", a: "피터 드러커" },
        { q: "측정할 수 없으면 관리할 수 없다.", a: "피터 드러커" },
        { q: "경영은 일을 제대로 하는 것이고, 리더십은 제대로 된 일을 하는 것이다.", a: "피터 드러커" },
        { q: "효율성은 일을 올바르게 하는 것이고, 효과성은 올바른 일을 하는 것이다.", a: "피터 드러커" },
        { q: "가장 중요한 것은 가장 중요한 것을 가장 중요하게 유지하는 것이다.", a: "스티븐 코비" },
        { q: "문제는 우리가 문제를 어떻게 보느냐 하는 것이다.", a: "스티븐 코비" },
        { q: "우리는 우리가 선택한 결과에 대해 책임을 져야 한다.", a: "스티븐 코비" },
        { q: "끝을 생각하며 시작하라.", a: "스티븐 코비" },
        { q: "가장 큰 위험은 위험을 전혀 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "사람들은 당신이 무엇을 말했는지 잊을 것이고, 당신이 무엇을 했는지 잊을 것이다. 하지만 당신이 그들에게 어떤 기분을 느끼게 했는지는 결코 잊지 않을 것이다.", a: "마야 안젤루" },
        { q: "성공은 당신이 얻은 것이 아니라, 당신이 어떤 사람이 되었느냐이다.", a: "짐 론" },
        { q: "경제적 자유를 원한다면, 당신의 수입보다 적게 쓰고 남은 것을 투자하라.", a: "존 템플턴" },
        { q: "최고의 투자 수익은 당신 자신에게 투자할 때 발생한다.", a: "워런 버핏" },
        { q: "할 수 있다고 믿는 사람은 결국 해낸다.", a: "정주영 (현대)" }
    ];

    const STORAGE_KEY = '12W_MASTER_MIDNIGHT_V1';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'dark', title: "🏆 12-Week Masterpiece", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("성공적으로 저장되었습니다!"); }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-12wk').value = data.goals.twelve || "";
        
        // 랜덤 명언 (새로고침 시 100개 중 1개)
        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;

        data.images.forEach((img, i) => { const box = document.getElementById(`v-${i}`); box.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+'; });

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const isCurrent = wIdx === currentWeekIdx;
            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done / w.todos.length) * 100);

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'current-week-card' : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <span style="font-weight:bold; font-size:1.1em;">${w.title}</span>
                        <span style="color:var(--primary); font-weight:800;">${per}%</span>
                    </div>
                    <div id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})" style="width:20px; height:20px;">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); font-size:1.2em; cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:8px; margin-top:15px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:10px; border-radius:12px; border:1px solid var(--border); background:#000; color:#fff;">
                        <button class="add-btn" onclick="addTodo(${wIdx})">+</button>
                    </div>
                    <textarea placeholder="주간 회고..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="width:100%; height:50px; margin-top:12px; border-radius:12px; border:1px solid var(--border); padding:10px; font-size:0.85em; background:#0a0a0a; color:#888; border-style:dashed;">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart(); calculateTotalPercent(); updateDDay();
    }

    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) {
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item);
        }
        save(); render();
    }

    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function editTodoText(wIdx, tIdx, newText) { data.weeks[wIdx].todos[tIdx].text = newText; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function updateStartDate(val) { data.startDate = val; save(); render(); }
    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${per}%`;
    }
    function updateDDay() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#007aff', tension: 0.4, fill: true, backgroundColor: 'rgba(0,122,255,0.1)', pointRadius: 4, pointBackgroundColor: '#007aff' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: { color: '#888' }, grid: { color: '#222' } }, x: { ticks: { color: '#888' }, grid: { display: false } } }, plugins: { legend: { display: false } } } });
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_masterpiece.json'; a.click(); }
    function importData() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = e => { const r = new FileReader(); r.onload = () => { data = JSON.parse(r.result); save(); render(); alert("복구 완료!"); }; r.readAsText(e.target.files[0]); };
        i.click();
    }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }
    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }

    render();
</script>
</body>
</html>
