<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Drag & Drop</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); position: relative; }
        
        /* 헤더 & 성공률 */
        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 30px; align-items: center; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; }
        .progress-bar-bg { background: var(--border); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background: var(--primary); transition: 0.5s; width: 0%; }

        /* 타이머 & 명언 */
        .timer-box { background: var(--primary); color: white; padding: 15px; border-radius: 20px; text-align: center; min-width: 140px; }
        .quote-side { background: rgba(0,113,227,0.05); border-left: 4px solid var(--primary); padding: 15px; border-radius: 0 15px 15px 0; }

        /* 드래그 앤 드롭 스타일 */
        .todo-item { 
            display: flex; align-items: center; background: var(--bg); padding: 12px; 
            border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border);
            cursor: grab; transition: background 0.2s;
        }
        .todo-item:active { cursor: grabbing; }
        .todo-item.dragging { opacity: 0.4; background: var(--border); }
        
        /* 기타 UI */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--bg); color: var(--text); resize: vertical; margin-bottom: 15px; box-sizing: border-box; }
        .save-dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: var(--card); padding: 12px 25px; border-radius: 50px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; padding: 10px 15px; }
        details { border: 1px solid var(--border); border-radius: 15px; margin-bottom: 20px; background: var(--card); }
        summary { padding: 15px; font-weight: bold; cursor: pointer; background: var(--bg); }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
        <h1 id="main-title" onclick="editTitle()">🏆 12-Week Masterpiece</h1>
        <button onclick="toggleTheme()" style="background:var(--text); color:var(--card);">🌓 테마</button>
    </div>

    <div class="header-grid">
        <div>
            <div id="dday-display" class="dday-big">D-Day</div>
            <div style="margin-top:10px; font-weight:bold; color:var(--primary);">통합 달성률: <span id="total-per-text">0%</span></div>
            <div class="progress-bar-bg"><div id="total-per-bar" class="progress-bar-fill"></div></div>
        </div>
        <div class="quote-side">
            <div id="quote-display">"계획 없는 목표는 단지 희망사항에 불과하다."</div>
            <div id="quote-author" style="font-size: 0.8em; color: var(--quote-sub);">- 생텍쥐페리</div>
        </div>
        <div class="timer-box">
            <div id="timer" style="font-size: 1.8em; font-weight: bold;">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="width:100%; margin-top:5px;">START</button>
        </div>
    </div>

    <details>
        <summary>🖼️ 비전 보드 & 목표 (접기/펼치기)</summary>
        <div id="vision-gallery" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:15px;"></div>
        <div style="padding:15px;">
            <textarea id="goal-long" class="goal-area" placeholder="원대한 목표..." onchange="data.goals.long=this.value; save();"></textarea>
            <textarea id="goal-3yr" class="goal-area" placeholder="3년 목표..." onchange="data.goals.three=this.value; save();"></textarea>
            <textarea id="goal-12wk" class="goal-area" placeholder="12주 계획..." onchange="data.goals.twelve=this.value; save();"></textarea>
        </div>
    </details>

    <div class="card"><canvas id="weeklyChart" style="height:150px;"></canvas></div>
    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "가장 위대한 영광은 넘어질 때마다 다시 일어남에 있다.", a: "넬슨 만델라" },
        { q: "할 수 있다고 믿는 순간 이미 절반은 이룬 것이다.", a: "테오도르 루스벨트" },
        { q: "미래를 예측하는 가장 좋은 방법은 직접 만드는 것이다.", a: "피터 드러커" },
        { q: "작은 일에 충실한 사람이 큰 일에도 충실하다.", a: "성경" }
    ];

    let data = JSON.parse(localStorage.getItem('12WeekDragV1')) || {
        theme: 'light', title: "🏆 12-Week Masterpiece", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem('12WeekDragV1', JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("저장되었습니다!"); }
    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function editTitle() { const v = prompt('제목:', data.title); if(v) { data.title = v; save(); render(); } }
    function resetAll() { if(confirm("초기화할까요?")) { localStorage.removeItem('12WeekDragV1'); location.reload(); } }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${per}%`;
        document.getElementById('total-per-bar').style.width = `${per}%`;
    }

    // --- 드래그 앤 드롭 핵심 로직 ---
    let dragStartIndex, dragStartWeek;

    function onDragStart(weekIdx, todoIdx) {
        dragStartWeek = weekIdx;
        dragStartIndex = todoIdx;
        event.target.classList.add('dragging');
    }

    function onDragOver(e) { e.preventDefault(); }

    function onDrop(weekIdx, todoIdx) {
        if (dragStartWeek !== weekIdx) return; // 같은 주차 내에서만 이동 가능하도록 제한
        const items = data.weeks[weekIdx].todos;
        const draggedItem = items.splice(dragStartIndex, 1)[0];
        items.splice(todoIdx, 0, draggedItem);
        save();
        render();
    }
    // ----------------------------

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        const q = quotes[Math.floor(Math.random()*quotes.length)];
        document.getElementById('quote-display').innerText = `"${q.q}"`;
        document.getElementById('quote-author').innerText = `- ${q.a}`;

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            
            board.innerHTML += `
                <div class="card">
                    <h3>${w.title} <span style="float:right; color:var(--primary);">${per}%</span></h3>
                    <div id="list-${wIdx}" ondragover="onDragOver(event)">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" draggable="true" 
                                 ondragstart="onDragStart(${wIdx}, ${tIdx})" 
                                 ondrop="onDrop(${wIdx}, ${tIdx})">
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <span style="flex:1; ${t.done?'text-decoration:line-through;opacity:0.4':''}">${t.text}</span>
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none;color:var(--accent);">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border);">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">+</button>
                    </div>
                </div>`;
        });
        updateChart(); calculateTotalPercent();
    }

    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
        });
    }

    render();
</script>
</body>
</html>
