<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 멋진 12주 계획표</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.6; max-width: 900px; margin: auto; padding: 20px; background: #f0f4f8; color: #333; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        .vision-item { margin-bottom: 15px; background: #eef2f7; padding: 15px; border-radius: 10px; }
        .vision-item strong { color: #3498db; display: block; margin-bottom: 5px; }
        .progress-container { background: #eee; border-radius: 20px; height: 25px; width: 100%; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #3498db, #2ecc71); height: 100%; width: 0%; text-align: center; color: white; font-weight: bold; transition: width 0.5s ease; line-height: 25px; }
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .week-card { background: white; border: 1px solid #d1d8e0; padding: 15px; border-radius: 12px; transition: transform 0.2s; }
        .week-card:hover { transform: translateY(-5px); }
        .todo-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.95em; }
        .todo-item input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        .editable { border: 1px dashed #3498db; padding: 2px 5px; border-radius: 4px; display: inline-block; min-width: 50px; }
        .btn { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8em; margin-left: 10px; }
        .btn-save { background: #2ecc71; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 5px; margin-top: 10px; padding: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔭 비전 보드 <button class="btn" onclick="toggleEdit('vision')">수정/저장</button></h2>
        <div id="vision-area">
            <div class="vision-item"><strong>장기 비전</strong> <span class="vision-text">나만의 멋진 미래를 적어보세요!</span></div>
            <div class="vision-item"><strong>3년 중기 비전</strong> <span class="vision-text">3년 뒤 나는 어떤 모습일까요?</span></div>
            <div class="vision-item"><strong>12주 핵심 목표</strong> <span class="vision-text">이번 12주 동안 꼭 이룰 한 가지!</span></div>
        </div>
    </div>

    <div class="card">
        <h2>📊 전체 달성률 : <span id="total-text">0%</span></h2>
        <div class="progress-container"><div id="total-bar" class="progress-bar">0%</div></div>
    </div>

    <div class="week-grid" id="week-container">
        </div>

    <script>
        // 12주차 생성기
        const container = document.getElementById('week-container');
        for (let i = 1; i <= 12; i++) {
            container.innerHTML += `
                <div class="week-card">
                    <h3>📅 Week ${i} <button class="btn" onclick="toggleEdit('week-${i}')">수정</button></h3>
                    <div id="week-${i}-todos">
                        <div class="todo-item"><input type="checkbox" onclick="calc()"><span class="todo-text">첫 번째 할 일</span></div>
                        <div class="todo-item"><input type="checkbox" onclick="calc()"><span class="todo-text">두 번째 할 일</span></div>
                        <div class="todo-item"><input type="checkbox" onclick="calc()"><span class="todo-text">세 번째 할 일</span></div>
                    </div>
                    <textarea placeholder="이번 주의 다짐..."></textarea>
                </div>
            `;
        }

        // 수정 및 저장 기능
        function toggleEdit(id) {
            let area;
            let texts;
            
            if (id === 'vision') {
                texts = document.querySelectorAll('.vision-text');
            } else {
                texts = document.querySelectorAll(`#${id}-todos .todo-text`);
            }

            texts.forEach(el => {
                if (el.contentEditable !== "true") {
                    el.contentEditable = "true";
                    el.classList.add('editable');
                    el.focus();
                } else {
                    el.contentEditable = "false";
                    el.classList.remove('editable');
                }
            });
        }

        // 달성률 계산기
        function calc() {
            const all = document.querySelectorAll('input[type="checkbox"]');
            const checked = document.querySelectorAll('input[type="checkbox"]:checked');
            const percent = Math.round((checked.length / all.length) * 100);
            
            document.getElementById('total-bar').style.width = percent + "%";
            document.getElementById('total-bar').innerText = percent + "%";
            document.getElementById('total-text').innerText = percent + "%";
        }
    </script>
</body>
</html>
