<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Dynamic</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
            /* 달성률별 동적 색상 정의 */
            --rate-0: #8e8e93;   /* 0% 미완료 */
            --rate-30: #ff9500;  /* 30% 진행중 */
            --rate-70: #007aff;  /* 70% 가속도 */
            --rate-100: #34c759; /* 100% 완료 */
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; 
            margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); 
            padding-bottom: 120px; transition: 0.3s;
        }
        .container { max-width: 1000px; margin: auto; }

        .main-title-input {
            background: transparent; border: none; color: var(--text);
            font-size: 1.4em; font-weight: 800; width: 60%;
            outline: none; margin-bottom: 10px;
        }

        .dashboard { display: grid; grid-template-columns: 1fr 2fr 1.2fr; gap: 12px; margin-bottom: 15px; }
        .stat-card, .quote-card, .timer-card { 
            background: var(--card); border-radius: 16px; padding: 15px; 
            border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center;
        }
        
        .dday-box { font-size: 2.8em; font-weight: 900; color: var(--accent); line-height: 1; text-align: center; }
        .date-picker-group { margin-top: 10px; font-size: 0.8em; display: flex; align-items: center; gap: 5px; justify-content: center; }
        .date-picker { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 3px; border-radius: 6px; }

        .quote-text { font-size: 0.95em; font-weight: 600; border-left: 3px solid var(--primary); padding-left: 12px; line-height: 1.5; cursor: pointer; }
        
        .timer-card { background: var(--primary); color: white; text-align: center; border: none; }
        .timer-display { font-size: 1.8em; font-weight: 800; margin: 2px 0; }
        .timer-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 6px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; list-style: none; display: flex; justify-content: space-between; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px; font-family: inherit; box-sizing: border-box; resize: vertical; min-height: 50px; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        
        /* 주차별 카드: 달성률에 따라 변하는 테두리 효과 */
        .week-card { 
            background: var(--card); border-radius: 18px; padding: 18px; 
            border: 2px solid var(--border); transition: all 0.4s ease;
            position: relative;
        }
        .week-card.active { box-shadow: 0 0 15px rgba(0,113,227,0.2); }
        
        .week-date-info { font-size: 0.75em; color: var(--quote-sub); margin-bottom: 8px; display: block; }
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 8px; border-radius: 12px; margin-bottom: 8px; gap: 8px; border: 1px solid var(--border); }
        .star-box { background: #fff; color: #000; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .star-box.active { background: var(--gold); }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 0.95em; outline: none; }

        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .dock-btn { padding: 8px 16px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; color: white; font-size: 0.85em; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <input type="text" id="master-title" class="main-title-input" onchange="data.title=this.value; save();">
        <button onclick="toggleTheme()" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:5px 10px; border-radius:8px; cursor:pointer; font-size:0.75em;">🌓 테마 전환</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="font-weight:bold; font-size:0.8em; text-align:center; margin-top:5px;">전체 성공률 <span id="total-per-text">0%</span></div>
            <div class="date-picker-group">
                <span>시작일:</span>
                <input type="date" id="start-date" class="date-picker" onchange="updateStartDate(this.value)">
            </div>
        </div>

        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" class="quote-text">명언을 불러오는 중...</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.8em; margin-top:5px; margin-left:12px;"></div>
        </div>

        <div class="timer-card">
            <div style="font-size:0.75em; font-weight:800; opacity:0.9;">집중 타이머</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" class="timer-btn">START</button>
        </div>
    </div>

    <details class="vision-section">
        <summary>🖼️ 비전 보드 & 핵심 목표 설정</summary>
        <div style="padding: 15px;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;"></div>
            <div style="margin-bottom:10px;"><span style="font-size:0.8em; font-weight:bold; color:var(--primary);">✨ 원대한 목표 (장기비전)</span><textarea id="goal-long" class="goal-textarea" onchange="data.goals.long=this.value; save();"></textarea></div>
            <div style="margin-bottom:10px;"><span style="font-size:0.8em; font-weight:bold; color:var(--primary);">🎯 3년 목표</span><textarea id="goal-three" class="goal-textarea" onchange="data.goals.three=this.value; save();"></textarea></div>
            <div><span style="font-size:0.8em; font-weight:bold; color:var(--primary);">🚀 12주 핵심 계획</span><textarea id="goal-twelve" class="goal-textarea" onchange="data.goals.twelve=this.value; save();"></textarea></div>
        </div>
    </details>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759;" onclick="manualSave()">💾 저장</button>
    <button class="dock-btn" style="background:#007aff;" onclick="exportData()">📤 백업</button>
    <button class="dock-btn" style="background:#5856d6;" onclick="importData()">📥 복원</button>
    <button class="dock-btn" style="background:#8e8e93;" onclick="resetAll()">🧹 초기화</button>
</div>

    function manualSave() { save(); confetti(); alert("성공적으로 저장되었습니다!"); }

    function refreshQuote() {
        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;
    }

    // ⭐ 핵심: 달성률에 따른 동적 컬러 계산 로직
    function getDynamicColor(per) {
        if (per === 0) return 'var(--border)';
        if (per <= 30) return '#ff9500'; // 주황
        if (per <= 70) return '#007aff'; // 파랑
        return '#34c759'; // 초록
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        refreshQuote();

        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.style = "aspect-ratio:1/1; background:var(--input-bg); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.5em; overflow:hidden;";
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+';
            gallery.appendChild(div);
        });

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const board = document.getElementById('board');
        board.innerHTML = '';

        data.weeks.forEach((w, wIdx) => {
            const weekStart = new Date(start);
            weekStart.setDate(start.getDate() + (wIdx * 7));
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            
            const isCurrent = (today >= weekStart && today <= weekEnd);
            const dateStr = `${weekStart.getMonth()+1}/${weekStart.getDate()} ~ ${weekEnd.getMonth()+1}/${weekEnd.getDate()}`;

            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done / w.todos.length) * 100);
            
            // 동적 테두리 색상 적용
            const dynamicColor = getDynamicColor(per);

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'active' : ''}" style="border-color: ${dynamicColor}">
                    <span class="week-date-info">📅 ${dateStr}</span>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="font-weight:bold; font-size:1em;">${wIdx + 1}주차</span>
                        <span style="color:${dynamicColor}; font-weight:900; font-size:0.95em;">${per}%</span>
                    </div>
                    <div id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <div class="star-box ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</div>
                                <input type="checkbox" style="width:18px; height:18px;" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:8px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:0.9em;">
                        <button onclick="addTodo(${wIdx})" style="background:${dynamicColor}; color:white; border:none; border-radius:8px; width:35px; cursor:pointer; transition:0.3s;">+</button>
                    </div>
                </div>`;
        });
        calculateTotalPercent(); updateDDay();
    }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${rate}%`;
    }

    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) { data.weeks[wIdx].todos.splice(tIdx, 1); data.weeks[wIdx].todos.unshift(item); }
        save(); render();
    }
    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { 
        data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; 
        if(data.weeks[wIdx].todos[tIdx].done) confetti(); 
        save(); render(); 
    }
    function editTodoText(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function updateStartDate(val) { data.startDate = val; save(); render(); }
    function updateDDay() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 시간 종료! 고생하셨습니다."); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_masterpiece_backup.json'; a.click(); }
    function importData() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = e => { const r = new FileReader(); r.onload = () => { data = JSON.parse(r.result); save(); render(); alert("데이터가 성공적으로 복구되었습니다!"); }; r.readAsText(e.target.files[0]); };
        i.click();
    }
    function resetAll() { if(confirm("모든 데이터가 삭제됩니다. 초기화하시겠습니까?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    render();
</script>
</body>
</html>
