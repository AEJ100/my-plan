<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        /* 이전의 그 멋진 다크모드 디자인들 */
        :root { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --primary: #0071e3; --border: #d2d2d7; }
        [data-theme='dark'] { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --border: #3a3a3c; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--border); }
        .btn { padding: 8px 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .todo-item { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 10px; border-radius: 12px; margin-bottom: 5px; }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7em; background: #34c759; color: white; padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 9999; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">구름 저장 완료! ☁️</div>

<div class="header">
    <h2 style="margin:0;">🏆 12주 마스터</h2>
    <div id="auth-box">
        <button id="btn-login" class="btn" onclick="googleLogin()">🔑 로그인</button>
        <div id="user-info" style="display:none; text-align:right;">
            <span id="user-name" style="font-size:0.8em; display:block;"></span>
            <button onclick="googleLogout()" style="background:none; border:none; color:#ff3b30; font-size:0.7em; cursor:pointer;">로그아웃</button>
        </div>
    </div>
</div>

<div class="card" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; text-align:center;">
    <div>
        <div style="font-size:0.7em; opacity:0.7;">집중타이머</div>
        <div id="timer" style="font-size:1.5em; font-weight:900;">25:00</div>
        <button onclick="toggleTimer()" id="timer-btn" class="btn" style="font-size:0.6em; padding:4px 8px;">START</button>
    </div>
    <div>
        <div style="font-size:0.7em; opacity:0.7;">전체 달성률</div>
        <div id="total-per" style="font-size:1.5em; font-weight:900; color:var(--primary);">0%</div>
    </div>
</div>

<div id="board"></div>

<script>
    // 아까 설정한 구름 창고 열쇠
    const firebaseConfig = {
        apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ",
        authDomain: "week-project-29b17.firebaseapp.com",
        projectId: "week-project-29b17",
        storageBucket: "week-project-29b17.firebasestorage.app",
        messagingSenderId: "277326942781",
        appId: "1:277326942781:web:aef86a0c4bd94c4300d054",
        measurementId: "G-X9NWJ5SSW1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let data = { weeks: Array.from({length: 12}, (_, i) => ({ title: (i+1)+'주차', todos: [] })) };
    let timerInterval, timeLeft = 1500, isRunning = false;

    // 1. 구글 로그인
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => alert("실패: " + e.message));
    }

    function googleLogout() { auth.signOut().then(() => location.reload()); }

    // 로그인 상태 체크
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName + "님";
            loadFromCloud(user.uid);
        }
    });

    // 2. 구름 저장 및 불러오기
    function save() {
        render();
        const user = auth.currentUser;
        if (user) {
            db.collection("users").doc(user.uid).set(data).then(() => {
                const status = document.getElementById('save-status');
                status.style.opacity = '1';
                setTimeout(() => status.style.opacity = '0', 1000);
            });
        }
    }

    function loadFromCloud(uid) {
        db.collection("users").doc(uid).get().then(doc => {
            if (doc.exists) { data = doc.data(); render(); }
        });
    }

    // 3. 화면 그리기 및 기능들
    function render() {
        const board = document.getElementById('board');
        let total = 0, done = 0;
        board.innerHTML = data.weeks.map((w, wIdx) => {
            const per = w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100);
            total += w.todos.length; done += w.todos.filter(t => t.done).length;
            
            return `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-weight:bold;">${w.title}</span>
                        <span style="color:var(--primary); font-weight:bold;">${per}%</span>
                    </div>
                    ${w.todos.map((t, tIdx) => `
                        <div class="todo-item" style="${t.done?'opacity:0.5;':''}">
                            <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                            <span style="${t.done?'text-decoration:line-through;':''}">${t.text}</span>
                        </div>
                    `).join('')}
                    <input type="text" placeholder="+ 할 일 추가" onkeypress="if(event.key==='Enter') addTodo(${wIdx}, this)" 
                        style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); box-sizing:border-box; margin-top:10px;">
                </div>`;
        }).join('');
        document.getElementById('total-per').innerText = (total===0?0:Math.round((done/total)*100)) + '%';
    }

    function addTodo(wIdx, el) {
        if(el.value.trim()) {
            data.weeks[wIdx].todos.push({text: el.value, done: false});
            el.value = ''; save();
        }
    }

    function toggleTodo(wIdx, tIdx) {
        data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done;
        if(data.weeks[wIdx].todos[tIdx].done) confetti();
        save();
    }

    function toggleTimer() {
        if (isRunning) { clearInterval(timerInterval); isRunning = false; document.getElementById('timer-btn').innerText = "START"; }
        else {
            isRunning = true; document.getElementById('timer-btn').innerText = "STOP";
            timerInterval = setInterval(() => {
                timeLeft--; updateTimer();
                if (timeLeft <= 0) { clearInterval(timerInterval); alert("집중 끝!"); timeLeft = 1500; updateTimer(); }
            }, 1000);
        }
    }
    function updateTimer() { const m = Math.floor(timeLeft/60), s = timeLeft%60; document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`; }

    render();
</script>
</body>
</html>
