<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Focus</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c;
        }
        body { 
            font-family: -apple-system, sans-serif; margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; 
            min-height: 100vh; background-color: var(--bg); color: var(--text); box-sizing: border-box; padding-bottom: 120px;
        }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); }
        
        /* 헤더 & D-Day */
        .header-flex { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; margin-top: 10px; }
        
        /* 비전 보드 (3칸) */
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }

        /* 고정 목표 섹션 */
        .goal-section { margin-top: 20px; }
        .goal-label { font-weight: bold; color: var(--primary); font-size: 0.9em; margin-bottom: 5px; display: block; }
        .goal-input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 1.1em; background: transparent; color: var(--text); margin-bottom: 20px; font-weight: 500; }
        .goal-input:focus { outline: none; border-bottom-color: var(--primary); }

        .timer-box { background: var(--primary); color: white; padding: 15px 25px; border-radius: 20px; text-align: center; }
        .timer-display { font-size: 2em; font-weight: bold; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .todo-item { display: flex; align-items: center; background: var(--bg); padding: 12px; border-radius: 12px; margin-bottom: 10px; gap: 10px; border: 1px solid var(--border); }
        .star-btn { cursor: pointer; font-size: 1.2em; color: #ccc; border: none; background: none; line-height: 1; }
        .star-btn.active { color: var(--gold); }

        textarea { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 10px; resize: none; color: var(--text); font-family: inherit; box-sizing: border-box; }
        
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: var(--card); padding: 12px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: bold; padding: 10px 18px; transition: 0.2s; }
        .theme-btn { background: var(--text); color: var(--card); }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header-flex">
        <div>
            <div style="display:flex; align-items:center; gap:15px;">
                <h1 id="main-title" onclick="let v=prompt('제목:', this.innerText); if(v) {this.innerText=v; save();}" style="cursor:pointer; margin:0;">🏆 12-Week Masterpiece</h1>
                <button class="theme-btn" onclick="toggleTheme()">🌓 테마 전환</button>
            </div>
            <div id="dday-display" class="dday-big">D-Day</div>
            <div style="margin-top:10px; font-size:0.9em; font-weight:bold;">
                시작일 설정: <input type="date" id="start-date" onchange="data.startDate=this.value; save(); render();" style="border:1px solid var(--border); padding:5px; border-radius:8px; background:var(--card); color:var(--text);">
            </div>
        </div>
        <div class="timer-box">
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); margin-top:8px; width:100%;">START</button>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0;">🖼️ Vision Board</h2>
        <div class="vision-grid" id="vision-gallery"></div>
        
        <div class="goal-section">
            <label class="goal-label">원대한 목표 (장기 비전)</label>
            <input type="text" id="goal-long" class="goal-input" placeholder="삶의 궁극적인 지향점을 적으세요" onchange="data.goals.long=this.value; save();">
            
            <label class="goal-label">3년 목표</label>
            <input type="text" id="goal-3yr" class="goal-input" placeholder="3년 내에 반드시 달성할 성과" onchange="data.goals.three=this.value; save();">
            
            <label class="goal-label">12주 핵심 계획</label>
            <input type="text" id="goal-12wk" class="goal-input" placeholder="이번 시즌 가장 집중할 단 하나" onchange="data.goals.twelve=this.value; save();">
        </div>
    </div>

    <div class="card">
        <h2 style="margin:0 0 15px 0;">📊 주간 달성률 차트</h2>
        <div style="height:200px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#5856d6; color:white;" onclick="importData()">📥 불러오기</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('finalFocusV1')) || {
        theme: 'light',
        title: "🏆 12-Week Masterpiece",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function toggleTheme() {
        data.theme = data.theme === 'light' ? 'dark' : 'light';
        save(); render();
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else {
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerDisplay();
                if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 종료!"); timeLeft=1500; updateTimerDisplay(); }
            }, 1000);
            document.getElementById('timer-btn').innerText = "STOP";
        }
        isRunning = !isRunning;
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function save() { localStorage.setItem('finalFocusV1', JSON.stringify(data)); updateChart(); }
    function manualSave() { save(); confetti(); alert("저장되었습니다!"); }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week-focus-backup.json'; a.click();
    }

    function importData() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data = JSON.parse(reader.result); save(); render(); alert("데이터 복원 완료!"); };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }

    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks.map(w => w.title),
                datasets: [{ label: '성공률(%)', data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-3yr').value = data.goals.three;
        document.getElementById('goal-12wk').value = data.goals.twelve;

        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁 DONE";

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : `<span style="color:var(--border); font-size:2em;">+</span>`}</div>`;
        });

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            board.innerHTML += `
                <div class="card">
                    <h3 style="margin:0 0 10px 0;">${w.title} <span style="color:var(--primary); float:right;">${per}%</span></h3>
                    <div style="background:var(--bg); height:6px; border-radius:3px; overflow:hidden; border:1px solid var(--border);">
                        <div style="width:${per}%; background:var(--primary); height:100%; transition:0.4s;"></div>
                    </div>
                    <div style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" style="${t.important ? 'border-left: 4px solid var(--gold);' : ''}">
                                <button class="star-btn ${t.important ? 'active' : ''}" onclick="data.weeks[${wIdx}].todos[${tIdx}].important=!data.weeks[${wIdx}].todos[${tIdx}].important; save(); render();">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="data.weeks[${wIdx}].todos[${tIdx}].done=!data.weeks[${wIdx}].todos[${tIdx}].done; if(!t.done)confetti(); save(); render();" style="width:18px; height:18px;">
                                <span style="flex:1; ${t.done?'text-decoration:line-through;opacity:0.5':''}">${t.text}</span>
                                <button onclick="data.weeks[${wIdx}].todos.splice(${tIdx},1); save(); render();" style="color:var(--accent); background:none; font-size:1.1em;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가" style="flex:1; border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--bg); color:var(--text);">
                        <button onclick="const v=document.getElementById('in-${wIdx}'); if(v.value){data.weeks[${wIdx}].todos.push({text:v.value,done:false,important:false}); save(); render();}" style="background:var(--primary); color:white;">+</button>
                    </div>
                    <textarea placeholder="주간 회고 기록..." onchange="data.weeks[${wIdx}].review=this.value; save();">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart();
    }
    render();
</script>
</body>
</html>
