<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>12주 자기개발 대시보드</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .progress-container { background: #ddd; border-radius: 20px; height: 20px; width: 100%; }
        .progress-bar { background: #4CAF50; height: 20px; border-radius: 20px; width: 0%; text-align: center; color: white; font-size: 12px; }
        h2 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 5px; }
        .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔭 비전 보드</h2>
        <p><strong>장기 비전:</strong> [여기에 당신의 원대한 꿈을 입력하세요]</p>
        <p><strong>3년 중기 비전:</strong> [3년 뒤 내 모습]</p>
        <p><strong>12주 핵심 목표:</strong> [이번 12주 동안 반드시 이룰 것]</p>
    </div>

    <div class="card">
        <h2>📊 전체 성과 리포트</h2>
        <p>12주 총 달성률: <span id="total-percent">0%</span></p>
        <div class="progress-container"><div id="total-bar" class="progress-bar">0%</div></div>
    </div>

    <div id="weeks-container">
        <div class="card">
            <h3>📅 Week 1 (진행률: <span id="w1-percent">0</span>%)</h3>
            <div class="todo-item">
                <span>매일 독서 30분</span>
                <input type="checkbox" class="w1-check" onclick="calc(1)">
            </div>
            <div class="todo-item">
                <span>운동 1시간</span>
                <input type="checkbox" class="w1-check" onclick="calc(1)">
            </div>
            <textarea placeholder="이번 주 회고를 적어주세요..." style="width:100%; margin-top:10px;"></textarea>
            <div style="color: red; font-size: 0.9em; margin-top:5px;">
                <strong>미완료:</strong> <span id="w1-incomplete">없음</span>
            </div>
        </div>
    </div>

    <script>
        function calc(week) {
            const checks = document.querySelectorAll(`.w1-check`); // 주차별로 확장 가능
            const total = checks.length;
            const checked = document.querySelectorAll(`.w1-check:checked`).length;
            const percent = Math.round((checked / total) * 100);
            
            document.getElementById(`w1-percent`).innerText = percent;
            document.getElementById(`total-percent`).innerText = percent + "%"; // 1주차 기준 예시
            document.getElementById(`total-bar`).style.width = percent + "%";
            document.getElementById(`total-bar`).innerText = percent + "%";

            // 미완료 리스트 업데이트 로직 (간략)
            const incomplete = [];
            checks.forEach(c => { if(!c.checked) incomplete.push(c.previousElementSibling.innerText); });
            document.getElementById(`w1-incomplete`).innerText = incomplete.length > 0 ? incomplete.join(", ") : "모두 완료!";
        }
    </script>
</body>

</html>
