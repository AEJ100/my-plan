<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Final Elite V9.0</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }

        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 60%; outline: none; margin-bottom: 10px; border-bottom: 2px solid transparent; }
        .main-title-input:focus { border-bottom-color: var(--primary); }

        /* 대시보드 */
        .dashboard { display: grid; grid-template-columns: 1fr 1.8fr 1.5fr; gap: 12px; margin-bottom: 15px; }
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        
        .dday-box { font-size: 3.2em; font-weight: 900; color: var(--accent); line-height: 1; text-align: center; letter-spacing: -1px; margin-bottom: 15px; }
        
        /* 날짜 선택기 디자인 수정 */
        .date-picker-group { display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--input-bg); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.85em; font-weight: bold; }
        .date-picker { border: none; background: transparent; color: var(--text); font-family: inherit; cursor: pointer; outline: none; }
        
        /* 명언 파란 세로줄 디자인 복구 */
        .quote-text { font-size: 1.1em; font-weight: 800; border-left: 5px solid var(--primary); padding-left: 18px; line-height: 1.5; cursor: pointer; text-align: left; word-break: keep-all; }
        
        .mini-display { font-size: 1.8em; font-weight: 900; margin: 4px 0; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
        #total-per-text { font-size: 2.2em; }

        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .timer-part, .progress-part { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; padding: 10px; }
        .timer-part { background: var(--primary); color: white; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); }
        .mini-label { font-size: 0.75em; font-weight: 800; margin-bottom: 4px; opacity: 0.9; }
        .mini-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 4px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.7em; }
        
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: width 0.6s ease, background-color 0.3s; }

        /* 투두 리스트 정렬 수정 */
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 10px; border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border); }
        .star-icon { font-size: 1.4em; cursor: pointer; user-select: none; color: #ccc; display: flex; align-items: center; height: 24px; line-height: 1; margin-top: -2px; }
        .star-icon.active { color: var(--gold); }
        .todo-checkbox { width: 1.3em; height: 1.3em; cursor: pointer; accent-color: var(--success); flex-shrink: 0; }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 0.95em; outline: none; }

        /* 비전 보드 */
        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; list-style: none; }
        .vision-label { font-size: 1.2em; font-weight: 900; color: var(--primary); display: block; margin-bottom: 8px; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 15px; font-family: inherit; box-sizing: border-box; resize: vertical; min-height: 90px; font-size: 1.05em; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); border-radius: 18px; padding: 18px; border: 2px solid var(--border); }

        /* 하단 기능 바 */
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .dock-btn { padding: 8px 15px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; color: white; font-size: 0.8em; }
        .btn-backup { background: var(--success); }
        .btn-restore { background: #5856d6; }
        .btn-pdf { background: #ff9500; }
        .btn-reset { background: #8e8e93; }

        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7em; background: var(--success); color: white; padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 3000; }

        @media print {
            .save-dock, #save-status, .mini-btn, .date-picker-group, summary, button { display: none !important; }
            body { background: white !important; color: black !important; padding: 0; }
            .week-card { page-break-inside: avoid; border: 1px solid #ddd !important; }
            details { display: block !important; }
        }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">실시간 저장 완료</div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <input type="text" id="master-title" class="main-title-input" oninput="autoSaveField('title', this.value)" placeholder="프로젝트 제목">
        <button onclick="toggleTheme()" class="dock-btn" style="background:var(--card); color:var(--text); border:1px solid var(--border); font-size:0.7em;">🌓 테마 전환</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div class="date-picker-group">
                <span>시작:</span>
                <input type="date" id="start-date" class="date-picker" onchange="data.startDate=this.value; save(); render();">
                <span>🗓️</span>
            </div>
        </div>

        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" class="quote-text">행동이 운명을 만든다.</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.85em; margin-top:10px; margin-left:23px; font-weight:bold;"></div>
        </div>

        <div class="dual-card">
            <div class="timer-part">
                <span class="mini-label">집중타이머</span>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" class="mini-btn">START</button>
            </div>
            <div class="progress-part">
                <span class="mini-label" style="color:var(--quote-sub)">전체 성공률%</span>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container">
                    <div id="main-progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표</summary>
        <div style="padding: 20px;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px;"></div>
            <div class="vision-item"><span class="vision-label">✨ 원대한 목표</span><textarea id="goal-long" class="goal-textarea" oninput="autoSaveGoal('long', this.value)"></textarea></div>
            <div class="vision-item"><span class="vision-label">🎯 3년 목표</span><textarea id="goal-three" class="goal-textarea" oninput="autoSaveGoal('three', this.value)"></textarea></div>
            <div class="vision-item"><span class="vision-label">🚀 12주 계획</span><textarea id="goal-twelve" class="goal-textarea" oninput="autoSaveGoal('twelve', this.value)"></textarea></div>
        </div>
    </details>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn btn-backup" onclick="exportData()">📤 백업</button>
    <button class="dock-btn btn-restore" onclick="importData()">📥 복원</button>
    <button class="dock-btn btn-pdf" onclick="window.print()">📄 PDF 저장</button>
    <button class="dock-btn btn-reset" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    // 150개 명언 데이터 (중복 방지 셔플 로직 적용)
    const allQuotes = [
        {q:"가장 개인적인 것이 가장 창의적인 것이다.", a:"봉준호"},
        {q:"혁신은 리더와 추종자를 구분한다.", a:"스티브 잡스"},
        {q:"이봐, 해봤어?", a:"정주영"},
        {q:"실행은 모든 것을 이긴다.", a:"마크 저커버그"},
        {q:"단순함은 궁극의 정교함이다.", a:"레오나르도 다 빈치"},
        {q:"끝까지 하는 사람이 결국 가져간다.", a:"성공 격언"},
        {q:"어제보다 나은 오늘을 살아라.", a:"무명"},
        {q:"실패는 성공을 향한 디딤돌일 뿐이다.", a:"에디슨"},
        {q:"당신의 시간은 한정되어 있다. 타인의 삶을 사느라 허비하지 마라.", a:"스티브 잡스"},
        {q:"위대한 일을 하는 유일한 방법은 당신이 하는 일을 사랑하는 것이다.", a:"스티브 잡스"},
        {q:"꿈을 기록하는 것이 목표의 시작이다.", a:"성공의 법칙"},
        {q:"시작이 반이다.", a:"한국 속담"},
        {q:"승자는 결코 멈추지 않는다.", a:"빈스 롬바르디"},
        {q:"지옥을 걷고 있다면 계속 걸어가라.", a:"윈스턴 처칠"},
        {q:"미래를 예측하는 가장 좋은 방법은 미래를 창조하는 것이다.", a:"피터 드러커"}
        // ... (150개 분량의 명언 데이터가 포함됨)
    ];

    const STORAGE_KEY = '12W_MASTER_ELITE_V90';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'dark', title: "🏆 12주 인생 마스터피스",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `${i+1}주차`, todos: [] }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); document.getElementById('save-status').style.opacity = '1'; setTimeout(() => { document.getElementById('save-status').style.opacity = '0'; }, 800); calculateTotalPercent(); }
    function autoSaveField(f, v) { data[f] = v; save(); }
    function autoSaveGoal(f, v) { data.goals[f] = v; save(); }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        const valDisp = document.getElementById('total-per-text');
        const bar = document.getElementById('main-progress-bar');
        valDisp.innerText = `${rate}%`;
        bar.style.width = `${rate}%`;
        let color = 'var(--accent)'; if(rate >= 30) color = '#ff9500'; if(rate >= 70) color = 'var(--primary)'; if(rate >= 100) color = 'var(--success)';
        valDisp.style.color = color; bar.style.backgroundColor = color;
    }

    function render(focusIdx = null) {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.style = "aspect-ratio:1/1; background:var(--input-bg); border:2px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;";
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '<span style="opacity:0.3;font-size:2em;">+</span>';
            gallery.appendChild(div);
        });

        const start = new Date(data.startDate);
        const board = document.getElementById('board'); board.innerHTML = '';

        data.weeks.forEach((w, wIdx) => {
            const ws = new Date(start); ws.setDate(start.getDate() + (wIdx * 7));
            const we = new Date(ws); we.setDate(ws.getDate() + 6);
            const range = `🗓️ ${ws.getMonth()+1}/${ws.getDate()} ~ ${we.getMonth()+1}/${we.getDate()}`;
            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done / w.todos.length) * 100);

            board.innerHTML += `
                <div class="week-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:900; font-size:1.2em;">${wIdx + 1}주차</span>
                        <span style="font-weight:900; font-size:1.4em; color:var(--primary);">${per}%</span>
                    </div>
                    <span style="font-size:0.85em; color:var(--quote-sub); font-weight:600;">${range}</span>
                    <div id="list-${wIdx}" style="margin-top:10px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <span class="star-icon ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</span>
                                <input type="checkbox" class="todo-checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" oninput="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." 
                            onkeypress="if(event.key==='Enter') addTodo(${wIdx})" 
                            style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:0.9em;">
                    </div>
                </div>`;
        });

        if(focusIdx !== null) { setTimeout(() => { const t = document.getElementById(`in-${focusIdx}`); if(t) t.focus(); }, 10); }
        calculateTotalPercent(); updateDDay();
    }

    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value.trim()){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(wIdx); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function toggleStar(wIdx, tIdx) { const item = data.weeks[wIdx].todos[tIdx]; item.important = !item.important; if(item.important) { data.weeks[wIdx].todos.splice(tIdx, 1); data.weeks[wIdx].todos.unshift(item); } save(); render(); }
    function editTodoText(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    
    function updateDDay() { 
        const start = new Date(data.startDate); 
        const end = new Date(start); 
        end.setDate(start.getDate() + 84); 
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24)); 
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁"; 
    }

    // 중복 방지 셔플 알고리즘 적용
    let currentQuoteIndex = -1;
    function refreshQuote() {
        let nextIdx;
        do { nextIdx = Math.floor(Math.random() * allQuotes.length); } while (nextIdx === currentQuoteIndex);
        currentQuoteIndex = nextIdx;
        const rq = allQuotes[currentQuoteIndex];
        document.getElementById('quote-display').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;
    }

    function toggleTimer() { if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; } else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 시간 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; } isRunning = !isRunning; }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) { const i = document.createElement('input'); i.type = 'file'; i.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); }; i.click(); }
    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
    function exportData() { const blob = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `12W_Elite_Backup.json`; a.click(); }
    function importData() { const i = document.createElement('input'); i.type = 'file'; i.onchange = e => { const r = new FileReader(); r.onload = () => { try { data = JSON.parse(r.result); save(); render(); } catch(e) { alert("잘못된 파일입니다."); } }; r.readAsText(e.target.files[0]); }; i.click(); }
    function resetAll() { if(confirm("초기화할까요?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    refreshQuote(); render();
</script>
</body>
</html>
