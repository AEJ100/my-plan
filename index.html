<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Notion Cloud V13.0</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 50%; outline: none; }
        .auth-btn { padding: 8px 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; font-size: 0.8em; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1.8fr 1.5fr; gap: 12px; margin-bottom: 15px; }
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); transition: 0.3s; }
        .dday-box { font-size: 3em; font-weight: 900; color: var(--accent); text-align: center; }
        .mini-display { font-size: 1.8em; font-weight: 900; margin: 4px 0; }
        
        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .timer-part { background: var(--primary); color: white; border-radius: 12px; padding: 10px; text-align: center; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: 0.6s ease; }
        
        /* 팝업 모달 스타일 */
        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
        .modal-content { background: var(--card); margin: 5vh auto; padding: 25px; border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
        .day-row { margin-bottom: 15px; }
        .day-name { font-weight: 900; color: var(--primary); margin-bottom: 5px; display: block; font-size: 0.9em; }
        .day-input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px; box-sizing: border-box; font-size: 0.95em; outline: none; }

        .vision-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; overflow: hidden; }
        .vision-section summary { padding: 12px 15px; cursor: pointer; font-weight: bold; background: var(--border); opacity: 0.8; }
        .goal-label { font-size: 1.1em; font-weight: 900; color: var(--primary); display: block; margin-top: 15px; margin-bottom: 5px; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 12px; box-sizing: border-box; resize: vertical; min-height: 60px; font-size: 0.95em; }
        
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); border-radius: 18px; padding: 18px; border: 2px solid var(--border); transition: 0.3s; }
        .week-title { cursor: pointer; text-decoration: underline; text-underline-offset: 4px; transition: 0.2s; }
        .week-title:hover { color: var(--primary); }
        
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 10px; border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border); }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; }
        .star-icon { cursor: pointer; color: #ccc; } .star-icon.active { color: var(--gold); }
        
        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 4000; }
        .dock-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; padding: 5px 10px; border-radius: 10px; transition: 0.2s; }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7em; background: var(--success); color: white; padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 6000; }
        .modal-close-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">구름 저장 완료 ☁️</div>

<div id="notion-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-week-title" style="margin-top:0; color:var(--primary);">주차 계획</h2>
        <div id="day-plans-container">
            </div>
        <button class="modal-close-btn" onclick="closeModal()">완료 및 닫기</button>
    </div>
</div>

<div class="container">
    <div class="header-flex">
        <input type="text" id="master-title" class="main-title-input" oninput="autoSaveField('title', this.value)">
        <div id="auth-zone">
            <button id="btn-login" class="auth-btn" style="background:var(--primary); color:white;" onclick="googleLogin()">🔑 로그인</button>
            <div id="user-info" style="display:none; text-align:right;">
                <span id="user-name" style="font-size:0.8em; font-weight:bold; display:block;"></span>
                <button onclick="googleLogout()" style="color:var(--accent); background:none; border:none; font-size:0.6em; cursor:pointer;">로그아웃</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="text-align:center; margin-top:10px;"><input type="date" id="start-date" style="border:none; background:transparent; color:var(--text); font-weight:bold; width: 120px;" onchange="data.startDate=this.value; save(); render();"></div>
        </div>
        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" style="font-weight:800; border-left:4px solid var(--primary); padding-left:15px;"></div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.8em; margin-top:8px; margin-left:19px;"></div>
        </div>
        <div class="dual-card">
            <div class="timer-part">
                <div style="font-size:0.7em; opacity:0.8; font-weight:800;">집중 타이머</div>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); border:none; border-radius:5px; font-size:0.6em; cursor:pointer; font-weight:bold; padding:3px 8px;">START</button>
            </div>
            <div class="progress-part">
                <div style="font-size:0.7em; opacity:0.8; font-weight:800; color:var(--quote-sub)">전체 성공률</div>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container"><div id="main-progress-bar" class="progress-bar-fill"></div></div>
            </div>
        </div>
    </div>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표</summary>
        <div style="padding: 20px;">
            <div id="vision-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
            <span class="goal-label">✨ 원대한 장기목표</span><textarea id="goal-long" class="goal-textarea" oninput="autoSaveGoal('long', this.value)"></textarea>
            <span class="goal-label">🎯 3년 중기목표</span><textarea id="goal-three" class="goal-textarea" oninput="autoSaveGoal('three', this.value)"></textarea>
            <span class="goal-label">🚀 12주 목표</span><textarea id="goal-twelve" class="goal-textarea" oninput="autoSaveGoal('twelve', this.value)"></textarea>
        </div>
    </details>

    <div class="week-grid" id="board"></div>
</div>

<div class="dock">
    <button class="dock-btn" onclick="toggleTheme()" title="밝기 조절">🌓</button>
    <button class="dock-btn" onclick="resetAll()" title="데이터 초기화" style="color:var(--accent);">🧹</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ", authDomain: "week-project-29b17.firebaseapp.com", projectId: "week-project-29b17", storageBucket: "week-project-29b17.firebasestorage.app", messagingSenderId: "277326942781", appId: "1:277326942781:web:aef86a0c4bd94c4300d054", measurementId: "G-X9NWJ5SSW1" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
    const quotes = [{q:"실행은 모든 것을 이긴다.", a:"마크 저커버그"}, {q:"완벽을 기다리면 늦는다.", a:"리드 호프먼"}, {q:"속도가 완벽을 이긴다.", a:"스타트업 격언"}];
    const days = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];

    let data = JSON.parse(localStorage.getItem('12W_CLOUD_V13')) || { 
        theme:'dark', title:"🏆 12주 마스터피스", startDate:new Date().toISOString().split('T')[0], 
        goals:{long:"", three:"", twelve:""}, images:[null,null,null], 
        weeks:Array.from({length:12}, (_,i)=>({title:(i+1)+'주차', todos:[], dayPlans:["","","","","","",""]})) 
    };
    
    let timerInterval, timeLeft = 1500, isRunning = false, currentModalWeek = null;

    function googleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function googleLogout() { auth.signOut().then(()=>location.reload()); }
    auth.onAuthStateChanged(user => { if(user){ document.getElementById('btn-login').style.display='none'; document.getElementById('user-info').style.display='block'; document.getElementById('user-name').innerText=user.displayName+'님'; loadFromCloud(user.uid); } });

    function save() { 
        localStorage.setItem('12W_CLOUD_V13', JSON.stringify(data)); 
        const user = auth.currentUser; 
        if(user) db.collection("users").doc(user.uid).set(data).then(()=>{ 
            const s=document.getElementById('save-status'); s.style.opacity='1'; setTimeout(()=>s.style.opacity='0',800); 
        }); 
        calculateTotalPercent(); 
    }

    function loadFromCloud(uid) { db.collection("users").doc(uid).get().then(doc => { if(doc.exists){ data=doc.data(); render(); } }); }
    function getStatusColor(per) { if(per >= 100) return 'var(--success)'; if(per >= 70) return 'var(--primary)'; if(per >= 30) return '#ff9500'; return 'var(--border)'; }

    function openModal(wIdx) {
        currentModalWeek = wIdx;
        const modal = document.getElementById('notion-modal');
        const container = document.getElementById('day-plans-container');
        document.getElementById('modal-week-title').innerText = `${wIdx + 1}주차 세부 계획`;
        container.innerHTML = days.map((day, dIdx) => `
            <div class="day-row">
                <label class="day-name">${day}</label>
                <input type="text" class="day-input" value="${data.weeks[wIdx].dayPlans[dIdx] || ''}" oninput="updateDayPlan(${dIdx}, this.value)" placeholder="${day}의 할 일...">
            </div>
        `).join('');
        modal.style.display = "block";
    }

    function updateDayPlan(dIdx, val) { data.weeks[currentModalWeek].dayPlans[dIdx] = val; }
    function closeModal() { document.getElementById('notion-modal').style.display = "none"; save(); }

    function render(focusIdx = null) {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => { const div = document.createElement('div'); div.style = "aspect-ratio:1/1; background:var(--input-bg); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;"; div.onclick = () => handleImage(i); div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+'; gallery.appendChild(div); });
        
        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            w.todos.sort((a,b)=> (a.done===b.done)?(a.important===b.important?0:(a.important?-1:1)):(a.done?1:-1));
            const per = w.todos.length===0?0:Math.round((w.todos.filter(t=>t.done).length/w.todos.length)*100);
            board.innerHTML += `<div class="week-card" style="border-color:${getStatusColor(per)}">
                <div style="display:flex; justify-content:space-between; align-items:center; font-weight:900;">
                    <span class="week-title" onclick="openModal(${wIdx})">${w.title} (상세)</span>
                    <span style="color:${getStatusColor(per)}">${per}%</span>
                </div>
                <div style="margin-top:10px;">${w.todos.map((t, tIdx)=> `
                    <div class="todo-item" style="${t.done?'opacity:0.5':''}">
                        <span class="star-icon ${t.important?'active':''}" onclick="toggleStar(${wIdx},${tIdx})">★</span>
                        <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx},${tIdx})">
                        <input type="text" class="todo-input" value="${t.text}" oninput="editTodoText(${wIdx},${tIdx},this.value)" style="${t.done?'text-decoration:line-through':''}">
                        <button onclick="deleteTodo(${wIdx},${tIdx})" style="border:none; background:none; color:var(--accent); cursor:pointer;">×</button>
                    </div>`).join('')}</div>
                <input type="text" id="in-${wIdx}" placeholder="+ 추가 (엔터)" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); box-sizing:border-box; margin-top:5px;">
            </div>`;
        });
        if(focusIdx !== null) setTimeout(() => document.getElementById(`in-${focusIdx}`).focus(), 10);
        calculateTotalPercent(); updateDDay();
    }

    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value.trim()){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(wIdx); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function toggleStar(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].important = !data.weeks[wIdx].todos[tIdx].important; save(); render(); }
    function editTodoText(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function autoSaveField(f, v) { data[f] = v; save(); }
    function autoSaveGoal(f, v) { data.goals[f] = v; save(); }
    function calculateTotalPercent() {
        let total=0, done=0; data.weeks.forEach(w=>{ total+=w.todos.length; done+=w.todos.filter(t=>t.done).length; });
        const rate = total===0?0:Math.round((done/total)*100); const color = getStatusColor(rate);
        document.getElementById('total-per-text').innerText = rate+'%'; document.getElementById('total-per-text').style.color = color;
        const bar = document.getElementById('main-progress-bar'); bar.style.width = rate+'%'; bar.style.backgroundColor = color;
    }
    function updateDDay() { const start=new Date(data.startDate); const end=new Date(start); end.setDate(start.getDate()+84); const diff=Math.ceil((end-new Date())/(1000*60*60*24)); document.getElementById('dday-display').innerText = diff>0?`D-${diff}`:'🏁'; }
    function refreshQuote() { const rq=quotes[Math.floor(Math.random()*quotes.length)]; document.getElementById('quote-display').innerText=`"${rq.q}"`; document.getElementById('quote-author').innerText=`- ${rq.a}`; }
    function toggleTimer() { if(isRunning){ clearInterval(timerInterval); isRunning=false; document.getElementById('timer-btn').innerText="START"; } else { isRunning=true; document.getElementById('timer-btn').innerText="STOP"; timerInterval=setInterval(()=>{ timeLeft--; updateTimerDisp(); if(timeLeft<=0){ clearInterval(timerInterval); alert("집중 끝!"); timeLeft=1500; updateTimerDisp(); isRunning=false; } }, 1000); } }
    function updateTimerDisp() { const m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer').innerText=`${m}:${s<10?'0':''}${s}`; }
    function handleImage(idx) { const i=document.createElement('input'); i.type='file'; i.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader(); r.onload=ev=>{ data.images[idx]=ev.target.result; save(); render(); }; r.readAsDataURL(f); }; i.click(); }
    function toggleTheme() { data.theme = data.theme==='dark'?'light':'dark'; save(); render(); }
    function resetAll() { if(confirm("정말로 모든 데이터를 초기화할까요?")){ localStorage.clear(); location.reload(); } }
    refreshQuote(); render();
</script>
</body>
</html>
