<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Final</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: var(--border); color: var(--text); padding: 8px 16px; border-radius: 20px; font-size: 0.9em; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }

        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); position: relative; transition: 0.3s; }
        .status-perfect { border-left: 8px solid var(--success) !important; }
        .status-good { border-left: 8px solid var(--primary) !important; }
        .status-warning { border-left: 8px solid #ff9500 !important; }
        .current-week-card { border-width: 3px !important; box-shadow: 0 10px 30px rgba(0,113,227,0.2) !important; }

        .todo-item { display: flex; align-items: center; background: rgba(255,255,255,0.5); padding: 12px; border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border); transition: transform 0.2s; cursor: grab; }
        .todo-item:active { cursor: grabbing; }
        .todo-item.dragging { opacity: 0.4; transform: scale(0.98); }
        .todo-edit-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 16px; font-family: inherit; }
        
        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; }
        
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1000; background: var(--card); padding: 12px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; padding: 10px 14px; }

        @media (max-width: 600px) { .header-grid { grid-template-columns: 1fr; text-align: center; } .dday-big { font-size: 2.5em; } }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px; align-items:center;">
        <h1 style="margin:0; font-size: 1.4em;">🏆 12-Week Workspace</h1>
        <div style="display:flex; gap:8px;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="border:1px solid var(--border); padding:8px; border-radius:8px;">
            <button onclick="toggleTheme()" style="background:var(--text); color:var(--card);">🌓</button>
        </div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" id="tab-all" onclick="setTab('all')">전체 주차</button>
        <button class="tab-btn" id="tab-current" onclick="setTab('current')">🔥 이번 주 집중</button>
    </div>

    <div id="top-section">
        <div class="header-grid card">
            <div><div id="dday-display" class="dday-big">D-00</div></div>
            <div>
                <div id="quote-display" style="font-size: 1em; font-weight: 600;"></div>
                <div id="quote-author" style="font-size: 0.8em; color: var(--quote-sub); margin-top: 5px;"></div>
            </div>
            <div style="text-align:center;">
                <div id="timer" style="font-size: 1.5em; font-weight: bold;">25:00</div>
                <button id="timer-btn" onclick="toggleTimer()" style="background:var(--primary); color:white; width:100%; margin-top:5px;">START</button>
            </div>
        </div>

        <details style="margin-bottom:20px;">
            <summary style="cursor:pointer; font-weight:bold;">🖼️ 비전 & 핵심 목표</summary>
            <div class="vision-grid" id="vision-gallery"></div>
            <div style="padding:15px; display:flex; flex-direction:column; gap:10px;">
                <textarea id="goal-long" placeholder="원대한 목표" onchange="data.goals.long=this.value; save();" style="width:100%; height:60px; border-radius:10px; padding:10px; border:1px solid var(--border);"></textarea>
                <textarea id="goal-12wk" placeholder="12주 핵심 계획" onchange="data.goals.twelve=this.value; save();" style="width:100%; height:60px; border-radius:10px; padding:10px; border:1px solid var(--border);"></textarea>
            </div>
        </details>
        
        <div class="card" style="padding: 10px; height: 160px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대 창업주)" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철 (삼성 창업주)" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대입니다.", a: "스티브 잡스" },
        { q: "매일 아침 '오늘 정말 멋진 일을 할 거야'라고 생각하세요.", a: "일론 머스크" },
        { q: "성공은 최종적인 것이 아니며, 실패는 치명적인 것이 아니다.", a: "윈스턴 처칠" }
    ];

    let data = JSON.parse(localStorage.getItem('12W_FINAL_V1')) || {
        theme: 'light', startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" })),
        viewTab: 'all'
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart, dragIdx, dragWeek;

    function save() { localStorage.setItem('12W_FINAL_V1', JSON.stringify(data)); updateChart(); }
    function manualSave() { save(); confetti(); alert("저장되었습니다!"); }
    function setTab(tab) { data.viewTab = tab; render(); }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('tab-all').className = data.viewTab === 'all' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-current').className = data.viewTab === 'current' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('top-section').style.display = data.viewTab === 'all' ? 'block' : 'none';

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            if (data.viewTab === 'current' && wIdx !== currentWeekIdx) return;
            
            const wS = new Date(start); wS.setDate(start.getDate() + (wIdx * 7));
            const wE = new Date(wS); wE.setDate(wS.getDate() + 6);
            const dateStr = `${wS.getMonth()+1}/${wS.getDate()} ~ ${wE.getMonth()+1}/${wE.getDate()}`;
            
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            let sClass = total > 0 ? (per >= 80 ? 'status-perfect' : per >= 50 ? 'status-good' : 'status-warning') : '';

            board.innerHTML += `
                <div class="card ${sClass} ${wIdx === currentWeekIdx ? 'current-week-card' : ''}">
                    <h3 style="margin:0;">${w.title} <span style="float:right;">${per}%</span></h3>
                    <div style="font-size:0.8em; color:var(--quote-sub); margin-bottom:15px;">${dateStr}</div>
                    <div id="list-${wIdx}" ondragover="event.preventDefault()">
                        ${w.todos.map((t, tIdx) => {
                            const hasLink = t.text.match(/(https?:\/\/[^\s]+)/);
                            return `
                            <div class="todo-item" draggable="true" ondragstart="dragIdx=${tIdx};dragWeek=${wIdx};event.target.classList.add('dragging')" 
                                 ondragend="event.target.classList.remove('dragging')" ondrop="handleDrop(${wIdx}, ${tIdx})">
                                <button onclick="toggleStar(${wIdx}, ${tIdx})" style="background:none; color:${t.important? 'var(--gold)':'#ccc'};">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodo(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                ${hasLink ? `<a href="${hasLink[0]}" target="_blank" style="text-decoration:none;">🔗</a>` : ''}
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; color:var(--accent);">×</button>
                            </div>`;
                        }).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" placeholder="할 일 입력" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); font-size:16px;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">+</button>
                    </div>
                </div>`;
        });
        updateChart();
    }

    function handleDrop(wIdx, tIdx) {
        if (dragWeek !== wIdx) return;
        const list = data.weeks[wIdx].todos;
        const moved = list.splice(dragIdx, 1)[0];
        list.splice(tIdx, 0, moved);
        save(); render();
    }

    function toggleStar(w, t) {
        data.weeks[w].todos[t].important = !data.weeks[w].todos[t].important;
        if(data.weeks[w].todos[t].important) {
            const item = data.weeks[w].todos.splice(t, 1)[0];
            data.weeks[w].todos.unshift(item);
        }
        save(); render();
    }

    function addTodo(w) { const v = document.getElementById(`in-${w}`); if(v.value){ data.weeks[w].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(w, t) { data.weeks[w].todos[t].done = !data.weeks[w].todos[t].done; if(data.weeks[w].todos[t].done) confetti(); save(); render(); }
    function editTodo(w, t, val) { data.weeks[w].todos[t].text = val; save(); render(); }
    function deleteTodo(w, t) { data.weeks[w].todos.splice(t, 1); save(); render(); }
    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function updateStartDate(v) { data.startDate = v; save(); render(); }
    function resetAll() { if(confirm("초기화할까요?")) { localStorage.removeItem('12W_FINAL_V1'); location.reload(); } }
    function exportData() { const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week-master.json'; a.click(); }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart'); if(!ctx) return;
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } } });
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 시간 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }

    // 명언 랜덤 설정
    const rq = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('quote-display').innerText = `"${rq.q}"`;
    document.getElementById('quote-author').innerText = `- ${rq.a}`;

    render();
</script>
</body>
</html>
