<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }
        
        /* 탭 버튼 스타일 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: var(--border); color: var(--text); padding: 8px 16px; border-radius: 20px; font-size: 0.9em; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; }

        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); position: relative; }
        .status-perfect { background: rgba(52, 199, 89, 0.08) !important; border-color: var(--success) !important; }
        .status-good { background: rgba(0, 113, 227, 0.05) !important; border-color: var(--primary) !important; }
        .status-warning { background: rgba(255, 149, 0, 0.08) !important; border-color: #ff9500 !important; }
        .current-week-card { border-width: 3px !important; box-shadow: 0 10px 30px rgba(0,113,227,0.2) !important; }

        .todo-item { display: flex; align-items: center; background: rgba(255,255,255,0.4); padding: 12px; border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border); cursor: grab; }
        .todo-item:active { cursor: grabbing; }
        .todo-item.dragging { opacity: 0.2; transform: scale(0.95); }
        .todo-edit-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 16px; font-family: inherit; }
        .link-icon { color: var(--primary); text-decoration: none; font-size: 0.9em; }

        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1000; background: var(--card); padding: 12px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; padding: 10px 14px; }
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 1em; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit;}
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px; align-items:center; flex-wrap: wrap; gap: 10px;">
        <h1 id="main-title" onclick="editTitle()" style="cursor:pointer; margin:0; font-size: 1.4em;">🏆 12-Week Workspace</h1>
        <div style="display:flex; align-items:center; gap:8px;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="border:1px solid var(--border); padding:8px; border-radius:8px;">
            <button onclick="toggleTheme()" style="background:var(--text); color:var(--card);">🌓</button>
        </div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" id="tab-all" onclick="setTab('all')">전체 주차</button>
        <button class="tab-btn" id="tab-current" onclick="setTab('current')">🔥 이번 주 집중</button>
    </div>

    <div id="dashboard-area">
        <div class="card" id="header-card" style="display:grid; grid-template-columns: auto 1fr auto; gap:20px; align-items:center;">
            <div><div id="dday-display" style="font-size: 2.5em; font-weight: 900; color: var(--accent);">D-00</div></div>
            <div class="quote-side" style="font-size: 0.85em;"><div id="quote-display"></div></div>
            <div class="timer-box" style="background:var(--primary); color:white; padding:10px; border-radius:12px; text-align:center;">
                <div id="timer" style="font-size: 1.2em; font-weight: bold;">25:00</div>
                <button onclick="toggleTimer()" style="background:white; color:var(--primary); font-size:0.7em; padding:3px 8px; margin-top:5px;">START</button>
            </div>
        </div>

        <details>
            <summary>🖼️ 비전 & 장기 목표</summary>
            <div class="vision-grid" id="vision-gallery"></div>
            <div style="padding:15px;">
                <textarea id="goal-long" class="goal-area" placeholder="원대한 목표" onchange="data.goals.long=this.value; save();"></textarea>
                <textarea id="goal-3yr" class="goal-area" placeholder="3년 목표" onchange="data.goals.three=this.value; save();"></textarea>
                <textarea id="goal-12wk" class="goal-area" placeholder="12주 핵심 계획" onchange="data.goals.twelve=this.value; save();"></textarea>
            </div>
        </details>
        
        <div class="card" style="padding: 10px; height: 160px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('12WeekWorkspaceV5')) || {
        theme: 'light', title: "🏆 12-Week Workspace", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" })),
        viewTab: 'all'
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function setTab(tab) { data.viewTab = tab; render(); }
    function save() { localStorage.setItem('12WeekWorkspaceV5', JSON.stringify(data)); updateChart(); }
    function updateStartDate(val) { data.startDate = val; render(); save(); }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-3yr').value = data.goals.three;
        document.getElementById('goal-12wk').value = data.goals.twelve;

        // 탭 스타일 업데이트
        document.getElementById('tab-all').className = data.viewTab === 'all' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-current').className = data.viewTab === 'current' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('dashboard-area').style.display = data.viewTab === 'all' ? 'block' : 'none';

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        // D-Day 계산
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => { gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : '+'}</div>`; });

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            if (data.viewTab === 'current' && wIdx !== currentWeekIdx) return;

            const wS = new Date(start); wS.setDate(start.getDate() + (wIdx * 7));
            const wE = new Date(wS); wE.setDate(wS.getDate() + 6);
            const dateStr = `${wS.getMonth()+1}/${wS.getDate()} ~ ${wE.getMonth()+1}/${wE.getDate()}`;

            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            
            let statusClass = '';
            if(total > 0) {
                if(per >= 80) statusClass = 'status-perfect';
                else if(per >= 50) statusClass = 'status-good';
                else statusClass = 'status-warning';
            }
            const isCurrent = wIdx === currentWeekIdx;

            board.innerHTML += `
                <div class="card ${statusClass} ${isCurrent ? 'current-week-card' : ''}" style="width: 100%; box-sizing: border-box;">
                    <h3 style="margin:0;">${w.title} <span style="float:right; font-size:0.8em;">${per}%</span></h3>
                    <div style="font-size:0.8em; color:var(--quote-sub); margin-bottom:15px;">${dateStr} ${isCurrent ? '🔥 진행 중' : ''}</div>
                    
                    <div id="list-${wIdx}" ondragover="event.preventDefault()">
                        ${w.todos.map((t, tIdx) => {
                            const isLink = t.text.includes('http');
                            return `
                            <div class="todo-item" draggable="true" 
                                 ondragstart="handleDragStart(${wIdx}, ${tIdx}, event)" 
                                 ondrop="handleDrop(${wIdx}, ${tIdx}, event)">
                                <button onclick="toggleStar(${wIdx}, ${tIdx})" style="background:none; border:none; color:${t.important? 'var(--gold)':'#ccc'}; font-size:1.2em; cursor:pointer;">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodo(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through; opacity:0.5':''}">
                                ${isLink ? `<a href="${t.text.match(/https?:\/\/[^\s]+/)}" target="_blank" class="link-icon">🔗</a>` : ''}
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer;">×</button>
                            </div>`;
                        }).join('')}
                    </div>
                    
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" placeholder="할 일 또는 링크 입력" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); font-size:16px;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">+</button>
                    </div>
                    
                    <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
                        <div style="font-size:0.75em; font-weight:bold; color:var(--quote-sub); margin-bottom:5px;">📊 이번 주 요약: ${done}/${total} 완료</div>
                        <textarea placeholder="주간 회고 및 배운 점..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="width:100%; height:60px; border-radius:10px; border:1px solid var(--border); padding:10px; font-size:0.9em; background:rgba(255,255,255,0.2); font-family:inherit;">${w.review || ''}</textarea>
                    </div>
                </div>`;
        });
        updateChart();
    }

    let dragIdx, dragWeek;
    function handleDragStart(w, t, e) { dragIdx = t; dragWeek = w; e.target.classList.add('dragging'); }
    function handleDrop(w, t, e) {
        if (dragWeek !== w) return;
        const list = data.weeks[w].todos;
        const moved = list.splice(dragIdx, 1)[0];
        list.splice(t, 0, moved);
        save(); render();
    }
    
    function toggleStar(w, t) {
