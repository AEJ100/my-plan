<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Professional</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff;
            --primary: #007aff; --accent: #ff453a; --border: #2c2c2e;
            --input-bg: #0a0a0a; --quote-sub: #8e8e93; --gold: #ffcc00;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); 
            padding-bottom: 140px; line-height: 1.5;
        }
        .container { max-width: 1200px; margin: auto; }

        /* 1. 제목 수정 가능 스타일 */
        .main-title-input {
            background: transparent; border: none; color: white;
            font-size: 1.8em; font-weight: 800; width: 100%;
            outline: none; margin-bottom: 20px; padding: 5px 0;
            border-bottom: 1px solid transparent; transition: 0.3s;
        }
        .main-title-input:hover, .main-title-input:focus { border-bottom: 1px solid var(--primary); }

        /* 레이아웃 재배치 */
        .dashboard { display: grid; grid-template-columns: 1fr 2.5fr 1fr; gap: 15px; margin-bottom: 25px; }
        
        /* 2. D-Day 및 날짜 설정 하단 배치 */
        .stat-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .dday-box { font-size: 4em; font-weight: 900; color: var(--accent); line-height: 1; }
        .date-picker { background: #000; color: #fff; border: 1px solid var(--border); padding: 5px; border-radius: 8px; margin-top: 15px; width: 100%; font-size: 0.85em; cursor: pointer; }

        /* 3. 명언 디데이 옆 배치 */
        .quote-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        .quote-text { font-size: 1.15em; font-weight: 600; color: #eee; margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 15px; }

        .timer-card { background: var(--primary); border-radius: 20px; padding: 20px; text-align: center; color: white; }
        .timer-display { font-size: 2.8em; font-weight: 800; margin: 5px 0; }
        .timer-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 10px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        /* 5. 비전 보드 & 고정 소제목 스타일 */
        .vision-section { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 25px; }
        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .vision-item { aspect-ratio: 1/1; background: var(--input-bg); border: 1px dashed var(--border); border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; font-size: 2em; }
        
        .goal-group { margin-bottom: 15px; }
        .goal-label { font-weight: bold; margin-bottom: 8px; display: block; color: var(--primary); }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: white; padding: 15px; font-family: inherit; box-sizing: border-box; resize: vertical; min-height: 60px; line-height: 1.6; }

        /* 4. 차트 및 성공률 */
        .chart-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); margin-bottom: 30px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .final-success-rate { font-size: 1.4em; font-weight: 900; color: var(--primary); }

        /* 주간 카드 및 투두 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .week-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); position: relative; }
        .week-card.active { border: 2px solid var(--primary); }
        .todo-item { display: flex; align-items: center; background: var(--input-bg); padding: 12px; border-radius: 15px; margin-bottom: 10px; gap: 12px; }
        .star-box { background: #fff; color: #000; border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .star-box.active { background: var(--gold); }
        .todo-input { flex: 1; border: none; background: transparent; color: white; font-size: 16px; outline: none; }

        .save-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(28,28,30,0.8); backdrop-filter: blur(20px); padding: 15px 25px; border-radius: 100px; border: 1px solid var(--border); z-index: 2000; }
        .dock-btn { padding: 12px 22px; border-radius: 15px; font-weight: 800; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="master-title" class="main-title-input" onchange="data.title=this.value; save();" value="🏆 12-Week Masterpiece">

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="font-weight:bold; margin-top:5px;">전체 달성률 <span id="total-per-text">0%</span></div>
            <input type="date" id="start-date" class="date-picker" onchange="updateStartDate(this.value)">
        </div>

        <div class="quote-card">
            <div id="quote-display" class="quote-text">"..."</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.9em; margin-left:15px;"></div>
        </div>

        <div class="timer-card">
            <div style="font-size:0.8em; font-weight:800; opacity:0.8;">FOCUS TIMER</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" class="timer-btn">START</button>
        </div>
    </div>

    <div class="vision-section">
        <h3 style="margin-top:0; margin-bottom:20px;">🖼️ 비전 보드 & 핵심 목표 설정</h3>
        <div class="vision-grid" id="vision-gallery"></div>
        
        <div class="goal-group">
            <span class="goal-label">✨ 원대한 목표 (장기비전)</span>
            <textarea id="goal-long" class="goal-textarea" onchange="data.goals.long=this.value; save();" placeholder="엔터를 눌러 여러 줄로 작성하세요"></textarea>
        </div>
        <div class="goal-group">
            <span class="goal-label">🎯 3년 목표</span>
            <textarea id="goal-three" class="goal-textarea" onchange="data.goals.three=this.value; save();" placeholder="엔터를 눌러 여러 줄로 작성하세요"></textarea>
        </div>
        <div class="goal-group">
            <span class="goal-label">🚀 12주 핵심 계획</span>
            <textarea id="goal-twelve" class="goal-textarea" onchange="data.goals.twelve=this.value; save();" placeholder="엔터를 눌러 여러 줄로 작성하세요"></textarea>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-header">
            <h3 style="margin:0;">📊 주간 성공 흐름</h3>
            <div class="final-success-rate">최종 성공률: <span id="final-rate">0%</span></div>
        </div>
        <div style="height:200px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759;" onclick="manualSave()">💾 저장</button>
    <button class="dock-btn" style="background:#007aff;" onclick="exportData()">📤 백업</button>
    <button class="dock-btn" style="background:#5856d6;" onclick="importData()">📥 불러오기</button>
    <button class="dock-btn" style="background:#8e8e93;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    // 명언 100개 데이터베이스
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대)" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "작은 일에 충실한 사람이 큰 일에도 충실할 수 있다.", a: "성경" },
        { q: "시작하기 위해 위대해질 필요는 없지만, 위대해지기 위해 시작해야 한다.", a: "지그 지글러" },
        { q: "어제와 똑같이 살면서 다른 미래를 기대하는 것은 정신병이다.", a: "알베르트 아인슈타인" },
        { q: "측정할 수 없으면 관리할 수 없다.", a: "피터 드러커" },
        { q: "오늘 그늘에 앉아 쉴 수 있는 이유는 오래전 누군가 나무를 심었기 때문이다.", a: "워런 버핏" },
        { q: "성공은 최종적인 것이 아니며 실패는 치명적인 것이 아니다.", a: "윈스턴 처칠" },
        { q: "할 수 있다고 믿는 사람은 결국 해낸다.", a: "정주영 (현대)" }
        // ... 실제 100개 데이터가 여기에 들어갑니다 (지면상 축약)
    ];

    const STORAGE_KEY = '12W_MASTER_PRO_V1';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        title: "🏆 12-Week Masterpiece",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("저장되었습니다!"); }

    function render() {
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;

        const gallery = document.getElementById('vision-gallery');
        gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div');
            div.className = 'vision-item';
            div.onclick = () => handleImage(i);
            div.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+';
            gallery.appendChild(div);
        });

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        const board = document.getElementById('board');
        board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const isCurrent = wIdx === currentWeekIdx;
            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done / w.todos.length) * 100);

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'active' : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <span style="font-weight:bold; font-size:1.2em;">${w.title}</span>
                        <span style="color:var(--primary); font-weight:900;">${per}%</span>
                    </div>
                    <div id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <div class="star-box ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</div>
                                <input type="checkbox" style="width:20px; height:20px; accent-color:var(--primary);" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가..." onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--input-bg); color:white;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white; border:none; border-radius:10px; width:40px; cursor:pointer;">+</button>
                    </div>
                </div>`;
        });
        updateChart(); calculateTotalPercent(); updateDDay();
    }

    // 4. 성공률 계산 로직 고도화
    function calculateTotalPercent() {
        let totalTodos = 0, doneTodos = 0;
        data.weeks.forEach(w => {
            totalTodos += w.todos.length;
            doneTodos += w.todos.filter(t => t.done).length;
        });
        const rate = totalTodos === 0 ? 0 : Math.round((doneTodos / totalTodos) * 100);
        document.getElementById('total-per-text').innerText = `${rate}%`;
        document.getElementById('final-rate').innerText = `${rate}%`;
    }

    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        if(item.important) {
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item);
        }
        save(); render();
    }
    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function editTodoText(wIdx, tIdx, val) { data.weeks[wIdx].todos[tIdx].text = val; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function updateStartDate(val) { data.startDate = val; save(); render(); }
    function updateDDay() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks.map(w => w.title),
                datasets: [{ data: scores, borderColor: '#007aff', tension: 0.4, fill: true, backgroundColor: 'rgba(0,122,255,0.1)', pointRadius: 5 }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: { color: '#888' }, grid: { color: '#2c2c2e' } }, x: { ticks: { color: '#888' }, grid: { display: false } } }, plugins: { legend: { display: false } } }
        });
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("시간 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_master_backup.json'; a.click(); }
    function importData() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = e => { const r = new FileReader(); r.onload = () => { data = JSON.parse(r.result); save(); render(); alert("복구 완료!"); }; r.readAsText(e.target.files[0]); };
        i.click();
    }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    render();
</script>
</body>
</html>
