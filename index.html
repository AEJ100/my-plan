<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Full Option</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); position: relative; }
        
        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 30px; align-items: center; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -2px; }
        .progress-bar-bg { background: var(--border); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background: var(--primary); transition: 0.5s; width: 0%; }

        .timer-box { background: var(--primary); color: white; padding: 15px; border-radius: 20px; text-align: center; min-width: 140px; }
        .quote-side { background: rgba(0,113,227,0.05); border-left: 4px solid var(--primary); padding: 15px; border-radius: 0 15px 15px 0; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }

        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 1em; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; margin-bottom: 15px; font-family: inherit; box-sizing: border-box; }

        .todo-item { display: flex; align-items: center; background: var(--bg); padding: 10px; border-radius: 12px; margin-bottom: 8px; gap: 8px; border: 1px solid var(--border); cursor: grab; }
        .todo-edit-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-family: inherit; }
        .star-btn { cursor: pointer; font-size: 1.2em; color: #ccc; border: none; background: none; }
        .star-btn.active { color: var(--gold); }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
        .save-dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: var(--card); padding: 12px 25px; border-radius: 50px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; padding: 10px 15px; }
        details { border: 1px solid var(--border); border-radius: 15px; margin-bottom: 20px; background: var(--card); overflow: hidden; }
        summary { padding: 15px; font-weight: bold; cursor: pointer; background: var(--bg); }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px; align-items:center;">
        <h1 id="main-title" onclick="editTitle()" style="cursor:pointer; margin:0;">🏆 12-Week Masterpiece</h1>
        <div>
            <span style="font-size:0.9em; font-weight:bold; margin-right:10px;">시작일:</span>
            <input type="date" id="start-date" onchange="data.startDate=this.value; save(); render();" style="border:1px solid var(--border); padding:5px; border-radius:8px;">
            <button onclick="toggleTheme()" style="background:var(--text); color:var(--card); margin-left:10px;">🌓</button>
        </div>
    </div>

    <div class="header-grid">
        <div>
            <div id="dday-display" class="dday-big">D-Day</div>
            <div style="margin-top:10px; font-weight:bold; color:var(--primary); font-size:0.9em;">통합 성공률: <span id="total-per-text">0%</span></div>
            <div class="progress-bar-bg"><div id="total-per-bar" class="progress-bar-fill"></div></div>
        </div>
        <div class="quote-side">
            <div id="quote-display" style="font-size: 0.95em; font-weight: 500;">"로딩 중..."</div>
            <div id="quote-author" style="font-size: 0.8em; color: var(--quote-sub); margin-top: 5px;"></div>
        </div>
        <div class="timer-box">
            <div id="timer" style="font-size: 1.8em; font-weight: bold;">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="width:100%; margin-top:5px; background:white; color:var(--primary);">START</button>
        </div>
    </div>

    <details open>
        <summary>🖼️ 비전 보드 & 3단계 목표 시스템</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <div style="padding: 0 20px 20px 20px;">
            <label style="font-weight:bold; color:var(--primary); font-size:0.85em;">🌟 원대한 목표 (장기 비전)</label>
            <textarea id="goal-long" class="goal-area" onchange="data.goals.long=this.value; save();"></textarea>
            
            <label style="font-weight:bold; color:var(--primary); font-size:0.85em;">🎯 3년 목표</label>
            <textarea id="goal-3yr" class="goal-area" onchange="data.goals.three=this.value; save();"></textarea>
            
            <label style="font-weight:bold; color:var(--primary); font-size:0.85em;">🚀 12주 핵심 계획</label>
            <textarea id="goal-12wk" class="goal-area" onchange="data.goals.twelve=this.value; save();"></textarea>
        </div>
    </details>

    <div class="card"><canvas id="weeklyChart" style="height:150px;"></canvas></div>
    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#5856d6; color:white;" onclick="importData()">📥 복원</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대그룹)" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철 (삼성그룹)" },
        { q: "잠자는 동안에도 돈이 들어오는 방법을 찾아라.", a: "워런 버핏" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대입니다.", a: "스티브 잡스" },
        { q: "성공은 매일 반복되는 작은 노력들의 합계이다.", a: "로버트 콜리어" }
    ];

    let data = JSON.parse(localStorage.getItem('12WeekMasterFullV1')) || {
        theme: 'light', title: "🏆 12-Week Masterpiece", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem('12WeekMasterFullV1', JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("저장되었습니다!"); }
    function resetAll() { if(confirm("주의! 모든 기록과 사진이 삭제됩니다. 정말 초기화할까요?")) { localStorage.removeItem('12WeekMasterFullV1'); location.reload(); } }
    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function editTitle() { const v = prompt('제목:', data.title); if(v) { data.title = v; save(); render(); } }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${per}%`;
        document.getElementById('total-per-bar').style.width = `${per}%`;
    }

    let dragStartIndex, dragStartWeek;
    function onDragStart(weekIdx, todoIdx) { dragStartWeek = weekIdx; dragStartIndex = todoIdx; event.target.classList.add('dragging'); }
    function onDragOver(e) { e.preventDefault(); }
    function onDrop(weekIdx, todoIdx) {
        if (dragStartWeek !== weekIdx) return;
        const items = data.weeks[weekIdx].todos;
        const draggedItem = items.splice(dragStartIndex, 1)[0];
        items.splice(todoIdx, 0, draggedItem);
        save(); render();
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-3yr').value = data.goals.three || "";
        document.getElementById('goal-12wk').value = data.goals.twelve || "";

        const q = quotes[Math.floor(Math.random()*quotes.length)];
        document.getElementById('quote-display').innerText = `"${q.q}"`;
        document.getElementById('quote-author').innerText = `- ${q.a}`;

        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁 완료";

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : '+'}</div>`;
        });

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            board.innerHTML += `
                <div class="card">
                    <h3 style="margin-top:0;">${w.title} <span style="float:right; color:var(--primary); font-size:0.8em;">${per}%</span></h3>
                    <div ondragover="onDragOver(event)">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" draggable="true" ondragstart="onDragStart(${wIdx}, ${tIdx})" ondrop="onDrop(${wIdx}, ${tIdx})">
                                <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; color:var(--accent);">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 입력" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white;">+</button>
                    </div>
                    <textarea placeholder="주간 회고 기록..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="width:100%; height:60px; margin-top:15px; border-radius:10px; border:1px solid var(--border); padding:8px; font-size:0.85em; background:var(--bg); color:var(--text);">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart(); calculateTotalPercent();
    }

    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function toggleStar(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].important = !data.weeks[wIdx].todos[tIdx].important; save(); render(); }
    function editTodoText(wIdx, tIdx, newText) { data.weeks[wIdx].todos[tIdx].text = newText; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }
    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } });
    }
    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else {
            timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("시간 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; document.getElementById('timer-btn').innerText = "START"; } }, 1000);
            document.getElementById('timer-btn').innerText = "STOP";
        }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function exportData() { const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week-master.json'; a.click(); }
    function importData() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data = JSON.parse(reader.result); save(); render(); alert("복원 완료!"); };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }
    render();
</script>
</body>
</html>
