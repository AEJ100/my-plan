<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Infinity Vision V20.0</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 50%; outline: none; }
        .auth-btn { padding: 8px 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; font-size: 0.85em; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        .dday-box { font-size: 3.5em; font-weight: 900; color: var(--accent); text-align: center; line-height: 1; }
        
        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .timer-part { background: var(--primary); color: white; border-radius: 15px; padding: 15px; text-align: center; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); border-radius: 15px; padding: 15px; text-align: center; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: 0.6s ease; }
        
        /* 비전보드 갤러리 */
        .vision-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .vision-item { aspect-ratio: 1/1; border-radius: 15px; overflow: hidden; background: var(--input-bg); border: 2px dashed var(--border); position: relative; cursor: pointer; transition: 0.2s; }
        .vision-item img { width: 100%; height: 100%; object-fit: cover; }
        .vision-item:hover { transform: scale(1.03); border-color: var(--primary); }
        .vision-add-btn { display: flex; align-items: center; justify-content: center; font-size: 2em; color: var(--primary); background: var(--card); }

        /* 이미지 확대 모달 */
        .img-modal { display: none; position: fixed; z-index: 7000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); cursor: zoom-out; align-items: center; justify-content: center; }
        .img-modal img { max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 30px rgba(255,255,255,0.2); }

        /* 목표 입력창 업그레이드 */
        .goal-label { font-size: 1.3em; font-weight: 900; color: var(--primary); display: block; margin-top: 20px; margin-bottom: 10px; }
        .goal-textarea { width: 100%; background: var(--input-bg); border: 2px solid var(--border); border-radius: 15px; color: var(--text); padding: 15px; box-sizing: border-box; resize: vertical; min-height: 80px; font-size: 1.1em; font-weight: 500; line-height: 1.5; transition: 0.3s; }
        .goal-textarea:focus { border-color: var(--primary); background: var(--card); outline: none; }

        .block-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .block-card { background: var(--card); border-radius: 22px; padding: 20px; border: 3px solid var(--border); transition: 0.3s; cursor: pointer; text-align: center; }
        
        .dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 12px 30px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.1); z-index: 4000; }
        [data-theme='dark'] .dock { background: rgba(28,28,30,0.8); }
        .dock-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; }
        
        #planner-modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        .modal-content { background: var(--card); margin: 5vh auto; padding: 20px; border-radius: 30px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        #save-status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-size: 0.8em; background: var(--success); color: white; padding: 6px 16px; border-radius: 20px; opacity: 0; z-index: 6000; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">구름 저장 완료 ☁️</div>

<div id="img-viewer" class="img-modal" onclick="this.style.display='none'">
    <img id="viewer-img" src="">
</div>

<div id="planner-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0; color:var(--primary); text-align: center;">주차 계획</h2>
        <div id="planner-container"></div>
        <button style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:18px; font-weight:900; cursor:pointer; margin-top:15px;" onclick="closeModal()">완료</button>
    </div>
</div>

<div class="container">
    <div class="header-flex">
        <div style="flex: 1;">
            <span id="season-display" style="font-weight:900; color:var(--primary); font-size:0.8em;">제 1기 진행 중</span>
            <input type="text" id="master-title" class="main-title-input" oninput="autoSaveField('title', this.value)">
        </div>
        <div id="auth-zone">
            <button id="btn-login" class="auth-btn" style="background:var(--primary); color:white;" onclick="googleLogin()">🔑 로그인</button>
            <div id="user-info" style="display:none; text-align:right;">
                <span id="user-name" style="font-size:0.8em; font-weight:bold; display:block;"></span>
                <button onclick="googleLogout()" style="color:var(--accent); background:none; border:none; font-size:0.7em; cursor:pointer; font-weight: 900;">로그아웃</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div style="text-align:center; margin-top:10px;"><input type="date" id="start-date" style="border:none; background:transparent; color:var(--text); font-weight:900; font-size: 1.1em;" onchange="data.startDate=this.value; save(); render();"></div>
        </div>
        <div class="dual-card">
            <div class="timer-part">
                <div style="font-size:0.8em; font-weight:900;">집중 타이머</div>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); border:none; border-radius:8px; font-size:0.7em; cursor:pointer; font-weight:900; padding:5px 12px;">START</button>
            </div>
            <div class="progress-part">
                <div style="font-size:0.8em; font-weight:900; color:var(--quote-sub)">전체 성공률</div>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container"><div id="main-progress-bar" class="progress-bar-fill"></div></div>
            </div>
        </div>
        <div class="quote-card" onclick="refreshQuote()" style="cursor: pointer;">
            <div id="quote-display" style="font-weight:900; border-left:4px solid var(--primary); padding-left:15px; font-size: 1.1em;"></div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.85em; margin-top:10px; margin-left:19px;"></div>
        </div>
    </div>

    <button class="finish-season-btn" style="background: var(--gold); color: black; border: none; padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; margin-bottom: 20px; width: 100%;" onclick="archiveSeason()">🏆 이번 기수 마감 및 제 다음 기수 시작</button>

    <details class="vision-section" open>
        <summary>🖼️ 비전 보드 & 핵심 목표 (클릭 시 확대)</summary>
        <div style="padding: 20px;">
            <div id="vision-gallery" class="vision-gallery"></div>
            
            <span class="goal-label">✨ 원대한 장기목표</span>
            <textarea id="goal-long" class="goal-textarea" placeholder="당신의 가장 큰 꿈을 적어보세요..." oninput="autoSaveGoal('long', this.value)"></textarea>
            
            <span class="goal-label">🎯 3년 중기목표</span>
            <textarea id="goal-three" class="goal-textarea" placeholder="3년 뒤의 당신은 어떤 모습인가요?" oninput="autoSaveGoal('three', this.value)"></textarea>
            
            <span class="goal-label">🚀 12주 목표</span>
            <textarea id="goal-twelve" class="goal-textarea" placeholder="이번 12주 동안 반드시 이룰 것은?" oninput="autoSaveGoal('twelve', this.value)"></textarea>
        </div>
    </details>

    <div class="block-grid" id="board"></div>

    <details class="vision-section" id="pending-section" open>
        <summary>📌 미완료 리스트 모아보기</summary>
        <div id="pending-container" style="padding: 15px;"></div>
    </details>

    <details class="vision-section" open>
        <summary>📜 지나간 기수 기록 (보관함)</summary>
        <div id="history-grid" class="block-grid" style="padding: 15px;"></div>
    </details>
</div>

<div class="dock">
    <button class="dock-btn" onclick="toggleTheme()">🌓</button>
    <button class="dock-btn" onclick="resetAll()" style="color:var(--accent);">🧹</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDUkSZV-F8u_WWlsm4DPiQlg4zEsN0hxvQ", authDomain: "week-project-29b17.firebaseapp.com", projectId: "week-project-29b17", storageBucket: "week-project-29b17.firebasestorage.app", messagingSenderId: "277326942781", appId: "1:277326942781:web:aef86a0c4bd94c4300d054", measurementId: "G-X9NWJ5SSW1" };
    firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
    const quotes = [{q:"실행은 모든 것을 이긴다.", a:"마크 저커버그"}, {q:"완벽을 기다리면 늦는다.", a:"리드 호프먼"}, {q:"속도가 완벽을 이긴다.", a:"스타트업 격언"}];
    const dayNames = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];

    let data = JSON.parse(localStorage.getItem('12W_V20')) || { 
        theme:'dark', title:"🏆 12주 마스터피스", startDate:new Date().toISOString().split('T')[0], 
        goals:{long:"", three:"", twelve:""}, images:[], 
        currentSeason: 1, history: [],
        weeks: Array.from({length:12}, (_, i) => ({ title: (i+1) + "주차", days: Array.from({length:7}, () => ({ todos: [] })) }))
    };
    if(data.images.length === 0) data.images = [null, null, null]; // 기본 3칸 보장
    
    let currentW = null, openDayIdx = null, timerInterval, timeLeft = 1500, isRunning = false;

    function googleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function googleLogout() { auth.signOut().then(()=>location.reload()); }
    auth.onAuthStateChanged(user => { if(user){ document.getElementById('btn-login').style.display='none'; document.getElementById('user-info').style.display='block'; document.getElementById('user-name').innerText=user.displayName+'님'; loadFromCloud(user.uid); } });

    function save() { 
        localStorage.setItem('12W_V20', JSON.stringify(data)); 
        const user = auth.currentUser; 
        if(user) db.collection("users").doc(user.uid).set(data).then(() => { 
            const s=document.getElementById('save-status'); s.style.opacity='1'; setTimeout(()=>s.style.opacity='0',800); 
        }); 
        render();
    }

    function loadFromCloud(uid) { db.collection("users").doc(uid).get().then(doc => { if(doc.exists){ data=doc.data(); render(); } }); }
    function getStatusColor(per) { if(per >= 100) return 'var(--success)'; if(per >= 70) return 'var(--primary)'; if(per >= 30) return '#ff9500'; return 'var(--border)'; }
    function getWeekRangeText(baseDate, wIdx) {
        const start = new Date(baseDate);
        const wStart = new Date(start); wStart.setDate(start.getDate() + (wIdx * 7));
        const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 6);
        return `${wStart.getMonth()+1}/${wStart.getDate()} ~ ${wEnd.getMonth()+1}/${wEnd.getDate()}`;
    }

    function archiveSeason() {
        if(!confirm(`제 ${data.currentSeason}기를 마감할까요?`)) return;
        const record = { season: data.currentSeason, title: data.title, startDate: data.startDate, goals: JSON.parse(JSON.stringify(data.goals)), images: JSON.parse(JSON.stringify(data.images)), weeks: JSON.parse(JSON.stringify(data.weeks)) };
        data.history.unshift(record);
        data.currentSeason += 1;
        data.startDate = new Date().toISOString().split('T')[0];
        data.weeks = Array.from({length:12}, (_, i) => ({ title: (i+1) + "주차", days: Array.from({length:7}, () => ({ todos: [] })) }));
        save();
    }

    function openModal(wIdx) { currentW = wIdx; renderPlanner(wIdx); document.getElementById('planner-modal').style.display = "block"; }

    function renderPlanner(wIdx) {
        const container = document.getElementById('planner-container');
        document.getElementById('modal-title').innerText = `${wIdx + 1}주 계획 (${getWeekRangeText(data.startDate, wIdx)})`;
        container.innerHTML = dayNames.map((day, dIdx) => {
            const dayData = data.weeks[wIdx].days[dIdx];
            dayData.todos.sort((a,b) => (a.important === b.important ? 0 : a.important ? -1 : 1));
            const isActive = openDayIdx === dIdx ? 'active' : '';
            return `<div class="day-section"><div class="day-header" onclick="toggleDay(${dIdx})"><span>📅 ${day}</span><span>${isActive ? '▲' : '▼'}</span></div><div class="day-content ${isActive}">
                <div>${dayData.todos.map((t, tIdx) => `<div class="todo-item" style="${t.done?'opacity:0.5':''}"><span class="star-icon ${t.important?'active':''}" onclick="toggleStar(${wIdx},${dIdx},${tIdx})">★</span><input type="checkbox" class="todo-check" ${t.done?'checked':''} onclick="toggleTodo(${wIdx},${dIdx},${tIdx})"><input type="text" class="todo-input" value="${t.text}" oninput="editTodo(${wIdx},${dIdx},${tIdx},this.value)" style="${t.done?'text-decoration:line-through':''}"><button onclick="deleteTodo(${wIdx},${dIdx},${tIdx})" style="border:none; background:none; color:var(--accent); cursor:pointer;">×</button></div>`).join('')}</div>
                <input type="text" id="in-${wIdx}-${dIdx}" placeholder="+ 추가" onkeypress="if(event.key==='Enter') addTodo(${wIdx},${dIdx})" style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); box-sizing:border-box;"></div></div>`;
        }).join('');
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('season-display').innerText = `제 ${data.currentSeason}기 진행 중`;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-three').value = data.goals.three || "";
        document.getElementById('goal-twelve').value = data.goals.twelve || "";
        
        // 갤러리 렌더링
        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            const div = document.createElement('div'); div.className = "vision-item";
            div.onclick = (e) => { if(img) showImageViewer(img); else handleImage(i); e.stopPropagation(); };
            div.innerHTML = img ? `<img src="${img}">` : '<span style="opacity:0.3; font-size:1.5em;">+</span>';
            // 우클릭으로 이미지 삭제/변경 유도 (선택)
            div.oncontextmenu = (e) => { e.preventDefault(); if(confirm("이미지를 변경하시겠습니까?")) handleImage(i); };
            gallery.appendChild(div);
        });
        const addBtn = document.createElement('div'); addBtn.className = "vision-item vision-add-btn";
        addBtn.innerHTML = '+'; addBtn.onclick = () => { data.images.push(null); save(); };
        gallery.appendChild(addBtn);

        const board = document.getElementById('board'); board.innerHTML = '';
        let totalAll = 0, doneAll = 0;
        data.weeks.forEach((w, wIdx) => {
            let weekTotal = 0, weekDone = 0;
            w.days.forEach(d => { weekTotal += d.todos.length; weekDone += d.todos.filter(t => t.done).length; });
            const per = weekTotal === 0 ? 0 : Math.round((weekDone / weekTotal) * 100);
            totalAll += weekTotal; doneAll += weekDone;
            board.innerHTML += `<div class="block-card" style="border-color:${getStatusColor(per)}" onclick="openModal(${wIdx})"><span class="block-date">${getWeekRangeText(data.startDate, wIdx)}</span><h3>${w.title}</h3><div style="font-size:1.8em; font-weight:900; color:${getStatusColor(per)}; margin-top:5px;">${per}%</div></div>`;
        });
        const totalRate = totalAll === 0 ? 0 : Math.round((doneAll / totalAll) * 100);
        document.getElementById('total-per-text').innerText = totalRate + '%';
        document.getElementById('main-progress-bar').style.width = totalRate + '%';
        document.getElementById('main-progress-bar').style.backgroundColor = getStatusColor(totalRate);
        renderPendingList(); renderHistory(); updateDDay();
    }

    function showImageViewer(src) { const v = document.getElementById('img-viewer'); document.getElementById('viewer-img').src = src; v.style.display = 'flex'; }
    function handleImage(idx) { const i=document.createElement('input'); i.type='file'; i.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader(); r.onload=ev=>{ data.images[idx]=ev.target.result; save(); }; r.readAsDataURL(f); }; i.click(); }
    function toggleDay(dIdx) { openDayIdx = (openDayIdx === dIdx) ? null : dIdx; renderPlanner(currentW); }
    function closeModal() { document.getElementById('planner-modal').style.display = "none"; openDayIdx = null; render(); }
    function addTodo(wIdx, dIdx) { const v = document.getElementById(`in-${wIdx}-${dIdx}`); if(v.value.trim()){ data.weeks[wIdx].days[dIdx].todos.push({text: v.value, done: false, important: false}); v.value = ''; renderPlanner(wIdx); } }
    function toggleTodo(wIdx, dIdx, tIdx) { data.weeks[wIdx].days[dIdx].todos[tIdx].done = !data.weeks[wIdx].days[dIdx].todos[tIdx].done; if(data.weeks[wIdx].days[dIdx].todos[tIdx].done) confetti(); save(); }
    function toggleStar(wIdx, dIdx, tIdx) { data.weeks[wIdx].days[dIdx].todos[tIdx].important = !data.weeks[wIdx].days[dIdx].todos[tIdx].important; renderPlanner(wIdx); save(); }
    function editTodo(wIdx, dIdx, tIdx, val) { data.weeks[wIdx].days[dIdx].todos[tIdx].text = val; }
    function deleteTodo(wIdx, dIdx, tIdx) { data.weeks[wIdx].days[dIdx].todos.splice(tIdx, 1); renderPlanner(wIdx); save(); }
    function renderPendingList() { /* 기존 동일 */ }
    function renderHistory() { /* 기존 동일 */ }
    function autoSaveField(f, v) { data[f] = v; save(); }
    function autoSaveGoal(f, v) { data.goals[f] = v; save(); }
    function toggleTheme() { data.theme = data.theme==='dark'?'light':'dark'; save(); }
    function updateDDay() { const start=new Date(data.startDate); const end=new Date(start); end.setDate(start.getDate()+84); const diff=Math.ceil((end-new Date())/(1000*60*60*24)); document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁"; }
    function refreshQuote() { const rq=quotes[Math.floor(Math.random()*quotes.length)]; document.getElementById('quote-display').innerText=`"${rq.q}"`; document.getElementById('quote-author').innerText=`- ${rq.a}`; }
    function toggleTimer() { /* 기존 동일 */ }
    function resetAll() { if(confirm("초기화할까요?")){ localStorage.clear(); location.reload(); } }
    refreshQuote(); render();
</script>
</body>
</html>
