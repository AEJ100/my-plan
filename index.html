<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Final Elite V10.0</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b; --input-bg: #f5f5f7;
            --cal-icon: #0071e3;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --input-bg: #0a0a0a;
            --cal-icon: #64d2ff;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }

        /* 대시보드 및 레이아웃 */
        .main-title-input { background: transparent; border: none; color: var(--text); font-size: 1.6em; font-weight: 900; width: 60%; outline: none; margin-bottom: 10px; border-bottom: 2px solid transparent; }
        .dashboard { display: grid; grid-template-columns: 1fr 1.8fr 1.5fr; gap: 12px; margin-bottom: 15px; }
        .stat-card, .quote-card, .dual-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        
        .dday-box { font-size: 3em; font-weight: 900; color: var(--accent); line-height: 1; text-align: center; letter-spacing: -1.5px; }
        .mini-display { font-size: 1.8em; font-weight: 900; margin: 4px 0; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
        
        .date-picker-group { text-align: center; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .cal-trigger { font-size: 1.2em; color: var(--cal-icon); cursor: pointer; transition: transform 0.2s; }
        .cal-trigger:hover { transform: scale(1.2); }

        /* 타이머 & 프로그레스 */
        .dual-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .timer-part, .progress-part { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; padding: 10px; }
        .timer-part { background: var(--primary); color: white; }
        .progress-part { background: var(--input-bg); border: 1px solid var(--border); }
        .mini-label { font-size: 0.75em; font-weight: 800; margin-bottom: 4px; opacity: 0.9; }
        .mini-btn { background: white; color: var(--primary); border: none; width: 100%; padding: 4px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.7em; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: width 0.6s ease; }

        /* 주간 그리드 & 카드 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); border-radius: 18px; padding: 18px; border: 2px solid var(--border); cursor: pointer; transition: 0.2s; position: relative; }
        .week-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .week-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        
        /* 모달 스타일 (노션 스타일) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 5000; backdrop-filter: blur(8px); }
        .modal-content { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 95%; max-width: 700px; height: 85vh; background: var(--card); border-radius: 24px; padding: 25px; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; background: var(--card); z-index: 10; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .day-section { background: var(--input-bg); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .day-title { font-weight: 900; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .daily-todo { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .daily-memo { width: 100%; background: transparent; border: none; border-left: 2px solid var(--border); color: var(--text); padding: 8px 12px; margin-top: 10px; font-size: 0.9em; outline: none; resize: none; font-family: inherit; }

        /* 공통 입력창 스타일 */
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 0.95em; }
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .dock-btn { padding: 8px 15px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; color: white; font-size: 0.8em; }
        #save-status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7em; background: var(--success); color: white; padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.5s; z-index: 6000; }
        
        /* 유틸리티 */
        .close-btn { font-size: 1.5em; cursor: pointer; opacity: 0.5; }
        .close-btn:hover { opacity: 1; }
    </style>
</head>
<body data-theme="dark">

<div id="save-status">저장 완료</div>

<div id="week-modal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-week-title" style="margin:0; font-weight:900;">주차 기록</h2>
            <span class="close-btn" onclick="closeModal()">✕</span>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <input type="text" id="master-title" class="main-title-input" oninput="autoSaveField('title', this.value)" placeholder="프로젝트 제목">
        <button onclick="toggleTheme()" class="dock-btn" style="background:var(--card); color:var(--text); border:1px solid var(--border); font-size:0.7em;">🌓 테마 전환</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div id="dday-display" class="dday-box">D-84</div>
            <div class="date-picker-group">
                <span style="font-size: 0.8em; font-weight: bold; opacity: 0.7;">시작일:</span>
                <input type="date" id="start-date" style="border:none; background:transparent; color:var(--text); font-family:inherit; cursor:pointer; font-weight:bold; width:100px; font-size:0.85em; text-align:right;" onchange="data.startDate=this.value; save(); render();">
                <span class="cal-trigger" onclick="document.getElementById('start-date').showPicker()">🗓️</span>
            </div>
        </div>

        <div class="quote-card" onclick="refreshQuote()">
            <div id="quote-display" class="quote-text">혁신은 리더와 추종자를 구분한다.</div>
            <div id="quote-author" style="color:var(--quote-sub); font-size:0.85em; margin-top:8px; margin-left:19px; font-weight:bold;">- 스티브 잡스</div>
        </div>

        <div class="dual-card">
            <div class="timer-part">
                <span class="mini-label">집중타이머</span>
                <div id="timer" class="mini-display">25:00</div>
                <button onclick="toggleTimer()" id="timer-btn" class="mini-btn">START</button>
            </div>
            <div class="progress-part">
                <span class="mini-label" style="color:var(--quote-sub)">총 달성률</span>
                <div id="total-per-text" class="mini-display">0%</div>
                <div class="progress-bar-container">
                    <div id="main-progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button class="dock-btn" style="background:#34c759" onclick="exportData()">📤 백업</button>
    <button class="dock-btn" style="background:#5856d6" onclick="importData()">📥 복원</button>
    <button class="dock-btn" style="background:#ff9500" onclick="window.print()">📄 PDF</button>
    <button class="dock-btn" style="background:#8e8e93" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const STORAGE_KEY = '12W_MASTER_ELITE_V10';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        theme: 'dark', title: "🏆 12주 인생 마스터피스",
        startDate: new Date().toISOString().split('T')[0],
        weeks: Array.from({length: 12}, (_, i) => ({
            daily: Array.from({length: 7}, (_, dayIdx) => ({
                day: ['월','화','수','목','금','토','일'][dayIdx],
                todos: [], memo: ""
            }))
        }))
    };

    // 마이그레이션 (기존 데이터 구조와 호환)
    if(!data.weeks[0].daily) {
        data.weeks = data.weeks.map((w, i) => ({
            daily: Array.from({length: 7}, (_, dI) => ({
                day: ['월','화','수','목','금','토','일'][dI],
                todos: [], memo: ""
            }))
        }));
    }

    let timerInterval, timeLeft = 1500, isRunning = false;

    function save() { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
        const status = document.getElementById('save-status');
        status.style.opacity = '1'; 
        setTimeout(() => status.style.opacity = '0', 800);
        calculateTotalPercent();
    }

    function autoSaveField(f, v) { data[f] = v; save(); }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => w.daily.forEach(d => {
            total += d.todos.length;
            done += d.todos.filter(t => t.done).length;
        }));
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${rate}%`;
        document.getElementById('main-progress-bar').style.width = `${rate}%`;
        document.getElementById('main-progress-bar').style.backgroundColor = rate >= 100 ? 'var(--success)' : (rate >= 70 ? 'var(--primary)' : '#ff9500');
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('master-title').value = data.title;
        document.getElementById('start-date').value = data.startDate;
        
        const start = new Date(data.startDate);
        const board = document.getElementById('board'); 
        board.innerHTML = '';

        data.weeks.forEach((w, wIdx) => {
            const ws = new Date(start); ws.setDate(start.getDate() + (wIdx * 7));
            const we = new Date(ws); we.setDate(ws.getDate() + 6);
            
            let wTotal = 0, wDone = 0;
            w.daily.forEach(d => { wTotal += d.todos.length; wDone += d.todos.filter(t => t.done).length; });
            const wRate = wTotal === 0 ? 0 : Math.round((wDone / wTotal) * 100);

            board.innerHTML += `
                <div class="week-card" onclick="openModal(${wIdx})" style="border-color: ${wRate>=100?'var(--success)':(wRate>=1?'var(--primary)':'var(--border)')}">
                    <div class="week-card-header">
                        <span style="font-weight:900; font-size:1.1em;">${wIdx + 1}주차</span>
                        <span style="font-weight:900; color:var(--primary);">${wRate}%</span>
                    </div>
                    <div style="font-size:0.8em; color:var(--quote-sub); font-weight:bold;">
                        ${ws.getMonth()+1}/${ws.getDate()} ~ ${we.getMonth()+1}/${we.getDate()}
                    </div>
                    <div style="margin-top:12px; font-size:0.85em; opacity:0.8;">
                        ${wTotal === 0 ? '탭하여 계획 추가' : `작업 ${wTotal}개 진행 중`}
                    </div>
                </div>`;
        });
        updateDDay();
    }

    // 모달 제어
    function openModal(wIdx) {
        const modal = document.getElementById('week-modal');
        const body = document.getElementById('modal-body');
        document.getElementById('modal-week-title').innerText = `${wIdx + 1}주차 상세 기록`;
        
        body.innerHTML = data.weeks[wIdx].daily.map((d, dIdx) => `
            <div class="day-section">
                <div class="day-title">📅 ${d.day}요일</div>
                <div>
                    ${d.todos.map((t, tIdx) => `
                        <div class="daily-todo">
                            <input type="checkbox" ${t.done?'checked':''} onchange="toggleDailyTodo(${wIdx},${dIdx},${tIdx})">
                            <input type="text" class="todo-input" value="${t.text}" oninput="editDailyTodo(${wIdx},${dIdx},${tIdx},this.value)" style="${t.done?'text-decoration:line-through;opacity:0.5':''}">
                            <span style="cursor:pointer;opacity:0.3" onclick="deleteDailyTodo(${wIdx},${dIdx},${tIdx})">✕</span>
                        </div>
                    `).join('')}
                </div>
                <input type="text" placeholder="+ 할 일 추가 (Enter)" onkeypress="if(event.key==='Enter') addDailyTodo(${wIdx},${dIdx},this)" style="width:100%; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text); padding:5px; margin-top:8px; font-size:0.9em; outline:none;">
                <textarea class="daily-memo" placeholder="오늘의 메모/회고..." oninput="editDailyMemo(${wIdx},${dIdx},this.value)">${d.memo||''}</textarea>
            </div>
        `).join('');
        modal.style.display = 'block';
    }

    function closeModal() { document.getElementById('week-modal').style.display = 'none'; render(); }

    // 데이터 조작 함수
    function addDailyTodo(wIdx, dIdx, el) {
        if(!el.value.trim()) return;
        data.weeks[wIdx].daily[dIdx].todos.push({text: el.value, done: false});
        el.value = ''; save(); openModal(wIdx);
    }
    function toggleDailyTodo(wIdx, dIdx, tIdx) {
        data.weeks[wIdx].daily[dIdx].todos[tIdx].done = !data.weeks[wIdx].daily[dIdx].todos[tIdx].done;
        if(data.weeks[wIdx].daily[dIdx].todos[tIdx].done) confetti({particleCount:40, spread:70, origin:{y:0.6}});
        save(); openModal(wIdx);
    }
    function editDailyTodo(wIdx, dIdx, tIdx, val) { data.weeks[wIdx].daily[dIdx].todos[tIdx].text = val; save(); }
    function deleteDailyTodo(wIdx, dIdx, tIdx) { data.weeks[wIdx].daily[dIdx].todos.splice(tIdx, 1); save(); openModal(wIdx); }
    function editDailyMemo(wIdx, dIdx, val) { data.weeks[wIdx].daily[dIdx].memo = val; save(); }

    // 기타 기능
    function updateDDay() { const start = new Date(data.startDate); const end = new Date(start); end.setDate(start.getDate() + 84); const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24)); document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁"; }
    function toggleTheme() { data.theme = data.theme === 'dark' ? 'light' : 'dark'; save(); render(); }
    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft<=0){ clearInterval(timerInterval); alert("시간 종료!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`; }
    function exportData() { const blob = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `12W_MASTER_V10.json`; a.click(); }
    function importData() { const i = document.createElement('input'); i.type = 'file'; i.onchange = e => { const r = new FileReader(); r.onload = () => { try { data = JSON.parse(r.result); save(); render(); } catch(e) { alert("오류!"); } }; r.readAsText(e.target.files[0]); }; i.click(); }
    function resetAll() { if(confirm("초기화할까요?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    render();
</script>
</body>
</html>
