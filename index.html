<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Compact</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { 
            font-family: -apple-system, sans-serif; margin: 0; padding: 20px; transition: 0.3s; 
            min-height: 100vh; background-color: var(--bg); color: var(--text); box-sizing: border-box; padding-bottom: 120px;
        }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); }
        
        /* 헤더 레이아웃: D-Day와 명언을 한 줄에 */
        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; margin-bottom: 30px; }
        .dday-box { display: flex; flex-direction: column; }
        .dday-big { font-size: 3.2em; font-weight: 900; color: var(--accent); line-height: 1; }
        
        .quote-side { 
            background: rgba(0,113,227,0.05); border-left: 3px solid var(--primary); 
            padding: 10px 15px; border-radius: 0 12px 12px 0; font-size: 0.95rem; line-height: 1.4;
        }
        #quote-display { font-weight: 500; word-break: keep-all; }
        #quote-author { font-size: 0.8em; color: var(--quote-sub); margin-top: 5px; }

        .total-percent { font-size: 1.2em; font-weight: bold; color: var(--primary); margin-top: 10px; }
        
        details { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
        summary { padding: 15px; font-weight: bold; background: var(--bg); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: '▼'; font-size: 0.8em; }

        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }

        .goal-item { padding: 15px; background: var(--card); }
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 1em; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; margin-bottom: 15px; font-family: inherit; box-sizing: border-box; }

        .timer-box { background: var(--primary); color: white; padding: 12px 20px; border-radius: 18px; text-align: center; min-width: 140px; }
        .timer-display { font-size: 1.8em; font-weight: bold; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .todo-item { display: flex; align-items: center; background: var(--bg); padding: 12px; border-radius: 12px; margin-bottom: 10px; gap: 10px; border: 1px solid var(--border); }
        
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: var(--card); padding: 12px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: bold; padding: 10px 18px; transition: 0.2s; }
        .theme-btn { background: var(--text); color: var(--card); font-size: 0.8em; }

        @media (max-width: 768px) {
            .header-grid { grid-template-columns: 1fr; }
            .quote-side { margin-top: 10px; }
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h1 id="main-title" onclick="let v=prompt('제목:', this.innerText); if(v) {this.innerText=v; save();}" style="cursor:pointer; margin:0; font-size: 1.5em;">🏆 12-Week Masterpiece</h1>
        <button class="theme-btn" onclick="toggleTheme()">🌓 테마 전환</button>
    </div>

    <div class="header-grid">
        <div class="dday-box">
            <div id="dday-display" class="dday-big">D-Day</div>
            <div id="total-percent-display" class="total-percent">달성률: 0%</div>
        </div>
        
        <div class="quote-side">
            <div id="quote-display">명언을 불러오는 중...</div>
            <div id="quote-author"></div>
        </div>

        <div class="timer-box">
            <div style="font-size: 0.7em; opacity: 0.9; margin-bottom: 3px;">집중 타이머</div>
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); margin-top:5px; width:100%; padding:5px; font-size: 0.8em;">START</button>
        </div>
    </div>

    <div style="margin-bottom: 25px; font-size: 0.9em;">
        시작일: <input type="date" id="start-date" onchange="data.startDate=this.value; save(); render();" style="border:1px solid var(--border); padding:5px; border-radius:8px; background:var(--card); color:var(--text);">
    </div>

    <details>
        <summary>🖼️ 비전 보드 & 핵심 목표 설정</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <div class="goal-item">
            <label style="font-weight:bold; color:var(--primary); font-size:0.85em; display:block; margin-bottom:5px;">🌟 원대한 목표 (장기 비전)</label>
            <textarea id="goal-long" class="goal-area" placeholder="엔터를 눌러 여러 줄로 작성하세요" onchange="data.goals.long=this.value; save();"></textarea>
            
            <label style="font-weight:bold; color:var(--primary); font-size:0.85em; display:block; margin-bottom:5px;">🎯 3년 목표</label>
            <textarea id="goal-3yr" class="goal-area" onchange="data.goals.three=this.value; save();"></textarea>
            
            <label style="font-weight:bold; color:var(--primary); font-size:0.85em; display:block; margin-bottom:5px;">🚀 12주 핵심 계획</label>
            <textarea id="goal-12wk" class="goal-area" onchange="data.goals.twelve=this.value; save();"></textarea>
        </div>
    </details>

    <div class="card">
        <h2 style="margin:0 0 15px 0; font-size: 1.2em;">📊 주간 성공 흐름</h2>
        <div style="height:180px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#5856d6; color:white;" onclick="importData()">📥 불러오기</button>
</div>

<script>
    const quotes = [
        { q: "가장 위대한 영광은 한 번도 실패하지 않음이 아니라, 넘어질 때마다 다시 일어남에 있다.", a: "넬슨 만델라" },
        { q: "할 수 있다고 믿는 순간 이미 절반은 이룬 것이다.", a: "테오도르 루스벨트" },
        { q: "미래를 예측하는 가장 좋은 방법은 미래를 직접 창조하는 것이다.", a: "피터 드러커" },
        { q: "어제와 똑같이 살면서 다른 미래를 기대하는 것은 정신병 초기 증세이다.", a: "알베르트 아인슈타인" },
        { q: "작은 일에 충실한 사람이 큰 일에도 충실할 수 있다.", a: "성경" },
        { q: "당신의 시간은 한정되어 있다. 다른 사람의 삶을 사느라 낭비하지 마라.", a: "스티브 잡스" },
        { q: "성공이란 열정을 잃지 않고 실패에서 실패로 나아가는 능력이다.", a: "윈스턴 처칠" },
        { q: "시작하기 위해 위대해질 필요는 없지만, 위대해지기 위해 시작해야 한다.", a: "지그 지글러" }
    ];

    let data = JSON.parse(localStorage.getItem('finalFocusV4')) || {
        theme: 'light',
        title: "🏆 12-Week Masterpiece",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else {
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerDisplay();
                if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 시간 종료!"); timeLeft=1500; updateTimerDisplay(); }
            }, 1000);
            document.getElementById('timer-btn').innerText = "STOP";
        }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    function save() { localStorage.setItem('finalFocusV4', JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("기록이 저장되었습니다!"); }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-percent-display').innerText = `전체 달성률: ${per}%`;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week-data.json'; a.click();
    }
    function importData() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data = JSON.parse(reader.result); save(); render(); alert("데이터 복구 완료!"); };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks.map(w => w.title),
                datasets: [{ label: '성공률(%)', data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-3yr').value = data.goals.three;
        document.getElementById('goal-12wk').value = data.goals.twelve;

        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-display').innerText = `"${randomQuote.q}"`;
        document.getElementById('quote-author').innerText = `- ${randomQuote.a}`;

        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁 완료";

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : `<span style="color:var(--border); font-size:1.5em;">+</span>`}</div>`;
        });

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            board.innerHTML += `
                <div class="card">
                    <h3 style="margin:0 0 10px 0; font-size: 1.1em;">${w.title} <span style="color:var(--primary); float:right;">${per}%</span></h3>
                    <div style="background:var(--bg); height:6px; border-radius:3px; overflow:hidden;">
                        <div style="width:${per}%; background:var(--primary); height:100%; transition:0.4s;"></div>
                    </div>
                    <div style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" style="${t.important ? 'border-left: 4px solid var(--gold);' : ''}">
                                <button class="star-btn ${t.important ? 'active' : ''}" onclick="data.weeks[${wIdx}].todos[${tIdx}].important=!data.weeks[${wIdx}].todos[${tIdx}].important; save(); render();">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="data.weeks[${wIdx}].todos[${tIdx}].done=!data.weeks[${wIdx}].todos[${tIdx}].done; if(!t.done)confetti(); save(); render();">
                                <span style="flex:1; font-size: 0.9em; ${t.done?'text-decoration:line-through;opacity:0.5':''}">${t.text}</span>
                                <button onclick="data.weeks[${wIdx}].todos.splice(${tIdx},1); save(); render();" style="color:var(--accent); background:none;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가" style="flex:1; border:1px solid var(--border); border-radius:10px; padding:8px; background:var(--bg); color:var(--text); font-size: 0.9em;">
                        <button onclick="const v=document.getElementById('in-${wIdx}'); if(v.value){data.weeks[${wIdx}].todos.push({text:v.value,done:false,important:false}); save(); render();}" style="background:var(--primary); color:white;">+</button>
                    </div>
                    <textarea placeholder="주간 회고..." onchange="data.weeks[${wIdx}].review=this.value; save();" style="height:60px; width:100%; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); padding:10px; margin-top:10px; font-family:inherit; font-size: 0.85em;">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart();
        calculateTotalPercent();
    }
    render();
</script>
</body>
</html>
