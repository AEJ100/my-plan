<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Definitive</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
            --border: #d2d2d7; --quote-sub: #86868b;
        }
        [data-theme='dark'] {
            --bg: #000000; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); position: relative; transition: 0.3s; }
        
        /* 1. 시각적 피드백 (달성도별 색상) */
        .status-perfect { background: rgba(52, 199, 89, 0.08) !important; border-color: var(--success) !important; }
        .status-good { background: rgba(0, 113, 227, 0.05) !important; border-color: var(--primary) !important; }
        .status-warning { background: rgba(255, 149, 0, 0.08) !important; border-color: #ff9500 !important; }
        .current-week-card { border-width: 3px !important; box-shadow: 0 10px 30px rgba(0,113,227,0.2) !important; }

        /* 2. 모바일 최적화 (터치 영역) */
        .todo-item { display: flex; align-items: center; background: rgba(255,255,255,0.5); padding: 12px; border-radius: 12px; margin-bottom: 8px; gap: 10px; border: 1px solid var(--border); min-height: 48px; }
        .todo-edit-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 16px; font-family: inherit; } /* 16px로 폰트 키워 모바일 줌 방지 */
        .star-btn { cursor: pointer; font-size: 1.5em; color: #ccc; border: none; background: none; padding: 5px; line-height: 1; }
        .star-btn.active { color: var(--gold); }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }

        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; margin-bottom: 30px; }
        .dday-big { font-size: 3.5em; font-weight: 900; color: var(--accent); line-height: 1; }
        .progress-bar-bg { background: var(--border); height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background: var(--primary); transition: 0.8s; width: 0%; }

        .vision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .vision-img { aspect-ratio: 1/1; border-radius: 15px; border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }
        .goal-area { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 1em; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; margin-bottom: 15px; box-sizing: border-box; }
        .date-range { font-size: 0.85em; color: var(--quote-sub); font-weight: normal; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1000; background: var(--card); padding: 12px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); width: max-content; }
        button { cursor: pointer; border: none; border-radius: 10px; font-weight: bold; padding: 10px 14px; white-space: nowrap; }
        
        @media (max-width: 600px) {
            .header-grid { grid-template-columns: 1fr; text-align: center; }
            .dday-big { font-size: 2.5em; }
            .save-dock { bottom: 10px; padding: 8px 15px; }
            button { padding: 8px 10px; font-size: 0.8em; }
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px; align-items:center; flex-wrap: wrap; gap: 10px;">
        <h1 id="main-title" onclick="editTitle()" style="cursor:pointer; margin:0; font-size: 1.4em;">🏆 12-Week Masterpiece</h1>
        <div style="display:flex; align-items:center; gap:8px;">
            <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="border:1px solid var(--border); padding:8px; border-radius:8px; font-size: 0.9em;">
            <button onclick="toggleTheme()" style="background:var(--text); color:var(--card); padding: 8px 12px;">🌓</button>
        </div>
    </div>

    <div class="header-grid">
        <div>
            <div id="dday-display" class="dday-big">D-00</div>
            <div style="margin-top:8px; font-weight:bold; color:var(--primary); font-size:0.9em;">총 달성률: <span id="total-per-text">0%</span></div>
            <div class="progress-bar-bg"><div id="total-per-bar" class="progress-bar-fill"></div></div>
        </div>
        <div class="quote-side">
            <div id="quote-display" style="font-size: 0.9em; font-weight: 500;">"목표가 없으면 목표에 도달할 수 없다."</div>
            <div id="quote-author" style="font-size: 0.75em; color: var(--quote-sub); margin-top: 4px;"></div>
        </div>
        <div class="timer-box" style="padding: 10px 20px; border-radius: 15px;">
            <div id="timer" style="font-size: 1.5em; font-weight: bold;">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="width:100%; margin-top:4px; background:white; color:var(--primary); padding: 5px; font-size: 0.8em;">START</button>
        </div>
    </div>

    <details open>
        <summary>🖼️ 비전 보드 & 3단계 목표 시스템</summary>
        <div class="vision-grid" id="vision-gallery"></div>
        <div style="padding: 0 15px 15px 15px;">
            <label style="font-weight:bold; color:var(--primary); font-size:0.8em;">🌟 원대한 목표 (고정)</label>
            <textarea id="goal-long" class="goal-area" placeholder="내 인생의 궁극적인 비전..." onchange="data.goals.long=this.value; save();"></textarea>
            <label style="font-weight:bold; color:var(--primary); font-size:0.8em;">🎯 3년 목표 (고정)</label>
            <textarea id="goal-3yr" class="goal-area" placeholder="3년 뒤 나의 모습..." onchange="data.goals.three=this.value; save();"></textarea>
            <label style="font-weight:bold; color:var(--primary); font-size:0.8em;">🚀 12주 핵심 계획 (고정)</label>
            <textarea id="goal-12wk" class="goal-area" placeholder="이번 12주 핵심 KPI..." onchange="data.goals.twelve=this.value; save();"></textarea>
        </div>
    </details>

    <div class="card" style="padding: 15px;"><canvas id="weeklyChart" style="height:140px;"></canvas></div>
    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업</button>
    <button style="background:#5856d6; color:white;" onclick="importData()">📥 복원</button>
    <button style="background:#8e8e93; color:white;" onclick="resetAll()">🧹 초기화</button>
</div>

<script>
    const quotes = [
        { q: "시련은 있어도 실패는 없다.", a: "정주영" },
        { q: "운을 벌려고 하지 말고 때를 벌어라.", a: "이병철" },
        { q: "가장 큰 위험은 아무것도 감수하지 않는 것이다.", a: "마크 저커버그" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대입니다.", a: "스티브 잡스" }
    ];

    let data = JSON.parse(localStorage.getItem('12WeekDefinitiveV4')) || {
        theme: 'light', title: "🏆 12-Week Masterpiece", startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" }, images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem('12WeekDefinitiveV4', JSON.stringify(data)); updateChart(); calculateTotalPercent(); }
    function manualSave() { save(); confetti(); alert("성공적으로 저장되었습니다!"); }
    function updateStartDate(val) { data.startDate = val; updateDDay(); save(); render(); }

    function updateDDay() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const today = new Date(); today.setHours(0,0,0,0);
        const diff = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : (diff === 0 ? "D-Day" : "🏁 완료");
    }

    function calculateTotalPercent() {
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        const per = total === 0 ? 0 : Math.round((done / total) * 100);
        document.getElementById('total-per-text').innerText = `${per}%`;
        document.getElementById('total-per-bar').style.width = `${per}%`;
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long || "";
        document.getElementById('goal-3yr').value = data.goals.three || "";
        document.getElementById('goal-12wk').value = data.goals.twelve || "";
        updateDDay();

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => { gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : '+'}</div>`; });

        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            // 3. 주차별 날짜 범위 자동 표시
            const wS = new Date(start); wS.setDate(start.getDate() + (wIdx * 7));
            const wE = new Date(wS); wE.setDate(wS.getDate() + 6);
            const dateStr = `${wS.getMonth()+1}/${wS.getDate()} ~ ${wE.getMonth()+1}/${wE.getDate()}`;

            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            
            // 1. 시각적 피드백 (달성도별 색상)
            let statusClass = '';
            if(total > 0) {
                if(per >= 80) statusClass = 'status-perfect';
                else if(per >= 50) statusClass = 'status-good';
                else statusClass = 'status-warning';
            }
            const isCurrent = wIdx === currentWeekIdx;

            board.innerHTML += `
                <div class="card ${statusClass} ${isCurrent ? 'current-week-card' : ''}">
                    ${isCurrent ? '<small style="color:var(--primary); font-weight:bold;">진행 중인 주차 🔥</small>' : ''}
                    <h3 style="margin-top:0; margin-bottom:2px;">${w.title} <span style="float:right; color:var(--primary);">${per}%</span></h3>
                    <div class="date-range">${dateStr}</div>
                    <div style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" draggable="true" ondragstart="onDragStart(${wIdx}, ${tIdx})" ondrop="onDrop(${wIdx}, ${tIdx})">
                                <button class="star-btn ${t.important?'active':''}" onclick="toggleStar(${wIdx}, ${tIdx})">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-edit-input" value="${t.text}" onchange="editTodoText(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through;opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; color:var(--accent); font-size:1.2em; padding:5px;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" placeholder="할 일 입력" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); font-size:16px;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white; width:44px;">+</button>
                    </div>
                    <textarea placeholder="주간 회고 (엔터 가능)" onchange="data.weeks[${wIdx}].review=this.value; save();" style="width:100%; height:60px; margin-top:12px; border-radius:10px; border:1px solid var(--border); padding:10px; font-size:0.9em; background:rgba(255,255,255,0.3); font-family:inherit;">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart(); calculateTotalPercent();
    }

    // 별표 누르면 상단 이동 기능 포함
    function toggleStar(wIdx, tIdx) {
        const item = data.weeks[wIdx].todos[tIdx];
        item.important = !item.important;
        
        // 중요 표시(별표) 시 해당 항목을 배열의 맨 앞으로 보냄
        if(item.important) {
            data.weeks[wIdx].todos.splice(tIdx, 1);
            data.weeks[wIdx].todos.unshift(item);
        }
        save(); render();
    }

    function addTodo(wIdx) { const v = document.getElementById(`in-${wIdx}`); if(v.value){ data.weeks[wIdx].todos.push({text:v.value, done:false, important:false}); v.value=''; save(); render(); } }
    function toggleTodo(wIdx, tIdx) { data.weeks[wIdx].todos[tIdx].done = !data.weeks[wIdx].todos[tIdx].done; if(data.weeks[wIdx].todos[tIdx].done) confetti(); save(); render(); }
    function editTodoText(wIdx, tIdx, newText) { data.weeks[wIdx].todos[tIdx].text = newText; save(); }
    function deleteTodo(wIdx, tIdx) { data.weeks[wIdx].todos.splice(tIdx, 1); save(); render(); }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#0071e3', tension: 0.3, fill: true, backgroundColor: 'rgba(0,113,227,0.1)' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } });
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("Time Up!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; document.getElementById('timer-btn').innerText = "START"; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }
    function toggleTheme() { data.theme = data.theme === 'light' ? 'dark' : 'light'; save(); render(); }
    function exportData() { const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week-masterpiece.json'; a.click(); }
    function importData() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data = JSON.parse(reader.result); save(); render(); alert("복원 완료!"); };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem('12WeekDefinitiveV4'); location.reload(); } }
    
    render();
</script>
</body>
</html>
