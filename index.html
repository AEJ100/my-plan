<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece: Perfect Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.9); --card: #ffffff; --text: #1d1d1f;
            --primary: #0071e3; --success: #34c759; --accent: #ff3b30; --gold: #ffcc00;
        }
        [data-theme='dark'] {
            --bg-overlay: rgba(28, 28, 30, 0.85); --card: #2c2c2e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
        }
        body { 
            font-family: -apple-system, sans-serif; margin: 0; padding: 20px; transition: 0.3s; min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; color: var(--text); box-sizing: border-box; padding-bottom: 120px;
        }
        .container { max-width: 1200px; margin: auto; background: var(--bg-overlay); padding: 30px; border-radius: 30px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: 0.3s; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; transition: 0.3s; }
        
        /* 비전 보드 */
        .vision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
        .vision-img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; border: 2px dashed #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .vision-img img { width: 100%; height: 100%; object-fit: cover; }

        .goal-input { width: 100%; border: none; border-bottom: 2px solid #eee; padding: 10px 0; font-size: 1.1em; background: transparent; color: var(--text); margin-bottom: 15px; }

        .header-flex { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .timer-box { background: var(--primary); color: white; padding: 15px 25px; border-radius: 20px; text-align: center; min-width: 180px; }
        .timer-display { font-size: 2.2em; font-weight: bold; }

        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }
        .todo-item { display: flex; align-items: center; background: rgba(0,0,0,0.05); padding: 12px; border-radius: 15px; margin-bottom: 10px; gap: 10px; }
        .star-btn { cursor: pointer; font-size: 1.2em; color: #ccc; border: none; background: none; }
        .star-btn.active { color: var(--gold); }

        textarea { width: 100%; border: none; background: rgba(0,0,0,0.06); border-radius: 12px; padding: 12px; margin-top: 10px; resize: none; color: var(--text); font-family: inherit; }
        
        .save-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000; background: var(--card); padding: 12px 25px; border-radius: 50px; box-shadow: 0 15px 50px rgba(0,0,0,0.4); flex-wrap: wrap; justify-content: center; }
        button { cursor: pointer; border: none; border-radius: 15px; font-weight: bold; padding: 10px 18px; transition: 0.2s; }
        
        .theme-toggle { background: var(--text); color: var(--card); }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header-flex">
        <div>
            <div style="display:flex; align-items:center; gap:15px;">
                <h1 id="main-title" onclick="let v=prompt('제목:', this.innerText); if(v) {this.innerText=v; save();}" style="cursor:pointer; margin:0;">🏆 My Masterpiece</h1>
                <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️ 모드</button>
            </div>
            <p id="quote-display" style="font-style:italic; color:var(--primary); margin:15px 0;"></p>
            <div style="font-size:0.9em; font-weight:bold;">
                시작일: <input type="date" id="start-date" onchange="data.startDate=this.value; save(); render();" style="border:1px solid #ddd; padding:5px; border-radius:8px;">
                <span id="dday-display" style="color:var(--accent); margin-left:10px;"></span>
            </div>
        </div>
        <div class="timer-box">
            <div id="timer" class="timer-display">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" style="background:white; color:var(--primary); margin-top:10px; width:100%;">START</button>
        </div>
    </div>

    <div class="card">
        <h2>🖼️ Vision Board</h2>
        <div class="vision-grid" id="vision-gallery"></div>
        <div style="margin-top:20px;">
            <input type="text" id="goal-long" class="goal-input" placeholder="🌟 장기 비전" onchange="data.goals.long=this.value; save();">
            <input type="text" id="goal-3yr" class="goal-input" placeholder="🎯 3년 목표" onchange="data.goals.three=this.value; save();">
            <input type="text" id="goal-12wk" class="goal-input" placeholder="🚀 12주 핵심 계획" onchange="data.goals.twelve=this.value; save();">
        </div>
    </div>

    <div class="card">
        <h2 style="margin:0 0 15px 0;">📈 Achievement Graph</h2>
        <div style="height:200px;"><canvas id="weeklyChart"></canvas></div>
    </div>

    <div class="week-grid" id="board"></div>
</div>

<div class="save-dock">
    <button style="background:var(--success); color:white;" onclick="manualSave()">💾 저장</button>
    <button style="background:var(--primary); color:white;" onclick="exportData()">📤 백업(Export)</button>
    <button style="background:#5856d6; color:white;" onclick="importData()">📥 불러오기(Import)</button>
    <button style="background:#8e8e93; color:white;" onclick="location.reload()">🔄 배경교체</button>
</div>

<script>
    const quotes = ["할 수 있다고 믿는 순간 이미 반은 이룬 것이다.", "어제보다 나은 오늘을 기록하세요.", "작은 반복이 위대한 차이를 만듭니다.", "당신의 비전이 곧 당신의 미래입니다."];
    
    let data = JSON.parse(localStorage.getItem('finalMasterpieceV6')) || {
        theme: 'light',
        title: "🏆 My 12-Week Masterpiece",
        startDate: new Date().toISOString().split('T')[0],
        goals: { long: "", three: "", twelve: "" },
        images: [null, null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [], review: "" }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function toggleTheme() {
        data.theme = data.theme === 'light' ? 'dark' : 'light';
        save();
        render();
    }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else {
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerDisplay();
                if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("집중 시간 종료!"); timeLeft=1500; updateTimerDisplay(); }
            }, 1000);
            document.getElementById('timer-btn').innerText = "STOP";
        }
        isRunning = !isRunning;
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function save() { localStorage.setItem('finalMasterpieceV6', JSON.stringify(data)); updateChart(); }
    function manualSave() { save(); confetti(); alert("모든 기록이 안전하게 브라우저에 저장되었습니다!"); }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '12week-masterpiece-backup.json'; a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data = JSON.parse(reader.result); save(); render(); alert("데이터를 성공적으로 불러왔습니다!"); };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }

    function handleImage(idx) {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = () => { data.images[idx] = reader.result; save(); render(); };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks.map(w => w.title),
                datasets: [{ label: '달성률(%)', data: scores, borderColor: '#0a84ff', tension: 0.4, fill: true, backgroundColor: 'rgba(10,132,255,0.1)' }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
    }

    function render() {
        document.body.setAttribute('data-theme', data.theme);
        document.getElementById('main-title').innerText = data.title;
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-long').value = data.goals.long;
        document.getElementById('goal-3yr').value = data.goals.three;
        document.getElementById('goal-12wk').value = data.goals.twelve;
        document.getElementById('quote-display').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;

        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / 86400000);
        document.getElementById('dday-display').innerText = diff > 0 ? `(D-${diff})` : "(완료)";

        const gallery = document.getElementById('vision-gallery'); gallery.innerHTML = '';
        data.images.forEach((img, i) => {
            gallery.innerHTML += `<div class="vision-img" onclick="handleImage(${i})">${img ? `<img src="${img}">` : `+`}</div>`;
        });

        const board = document.getElementById('board'); board.innerHTML = '';
        data.weeks.forEach((w, wIdx) => {
            const done = w.todos.filter(t => t.done).length, total = w.todos.length;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            board.innerHTML += `
                <div class="card">
                    <h3>${w.title} <small style="color:var(--primary);">${per}%</small></h3>
                    <div style="background:rgba(0,0,0,0.1); height:8px; border-radius:4px; overflow:hidden;">
                        <div style="width:${per}%; background:var(--primary); height:100%; transition:0.5s;"></div>
                    </div>
                    <div style="margin-top:15px;">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item" style="${t.important ? 'border-left:4px solid var(--gold);' : ''}">
                                <button class="star-btn ${t.important ? 'active' : ''}" onclick="data.weeks[${wIdx}].todos[${tIdx}].important=!data.weeks[${wIdx}].todos[${tIdx}].important; save(); render();">★</button>
                                <input type="checkbox" ${t.done?'checked':''} onclick="data.weeks[${wIdx}].todos[${tIdx}].done=!data.weeks[${wIdx}].todos[${tIdx}].done; if(!t.done)confetti(); save(); render();">
                                <span style="flex:1; ${t.done?'text-decoration:line-through;opacity:0.5':''}">${t.text}</span>
                                <button onclick="data.weeks[${wIdx}].todos.splice(${tIdx},1); save(); render();" style="color:var(--accent); background:none;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가" style="flex:1; border:1px solid #ddd; border-radius:10px; padding:8px;">
                        <button onclick="const v=document.getElementById('in-${wIdx}'); if(v.value){data.weeks[${wIdx}].todos.push({text:v.value,done:false,important:false}); save(); render();}" style="background:var(--primary); color:white;">+</button>
                    </div>
                    <textarea placeholder="주간 회고..." onchange="data.weeks[${wIdx}].review=this.value; save();">${w.review || ''}</textarea>
                </div>`;
        });
        updateChart();
    }
    render();
</script>
</body>
</html>
