<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Masterpiece</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --card: #1c1c1e; --text: #f5f5f7;
            --primary: #0a84ff; --success: #30d158; --accent: #ff453a;
            --border: #3a3a3c; --quote-sub: #a1a1a6; --gold: #ffcc00;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        
        /* 너무 커지지 않도록 너비 제한 */
        .container { max-width: 900px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 1.2em; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        /* 대시보드: D-Day & 타이머 (이미지 UI 재현) */
        .dashboard { display: grid; grid-template-columns: 1fr auto; gap: 15px; margin-bottom: 20px; align-items: stretch; }
        .dday-card { background: var(--card); padding: 20px; border-radius: 18px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        .dday-val { font-size: 3em; font-weight: 900; color: var(--accent); line-height: 1; }
        .progress-info { font-weight: bold; color: var(--primary); margin-top: 8px; font-size: 0.9em; }

        .timer-card { background: var(--primary); color: white; padding: 15px 25px; border-radius: 18px; text-align: center; min-width: 140px; }
        .timer-val { font-size: 2.2em; font-weight: 900; margin-bottom: 5px; }
        .timer-btn { background: white; color: var(--primary); border: none; padding: 6px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 0.85em; cursor: pointer; }

        /* 명언 */
        .quote-area { background: rgba(255,255,255,0.03); padding: 15px 20px; border-radius: 12px; border-left: 3px solid var(--primary); margin-bottom: 20px; font-size: 0.95em; line-height: 1.4; }

        /* 주간 섹션 */
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .week-card { background: var(--card); padding: 18px; border-radius: 20px; border: 1px solid var(--border); transition: 0.2s; }
        .current-week { border: 2px solid var(--primary); box-shadow: 0 0 15px rgba(10,132,255,0.1); }
        
        .todo-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; margin-bottom: 8px; gap: 8px; }
        .todo-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 15px; outline: none; }

        /* 하단 바 (이미지 스타일: 둥근 바 형태) */
        .dock-container { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 1000; }
        .dock { display: flex; gap: 8px; background: rgba(44,44,46,0.9); backdrop-filter: blur(20px); padding: 10px 18px; border-radius: 50px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dock-btn { border: none; border-radius: 10px; padding: 8px 15px; color: white; font-weight: bold; cursor: pointer; font-size: 0.85em; display: flex; align-items: center; gap: 5px; }
        .btn-save { background: #30d158; }
        .btn-backup { background: #0a84ff; }
        .btn-load { background: #5e5ce6; }
        .btn-reset { background: #8e8e93; }

        /* 차트 컨테이너 */
        .chart-box { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; height: 120px; }

        @media (max-width: 500px) {
            .dashboard { grid-template-columns: 1fr; }
            .timer-card { min-width: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">🏆 12-Week Masterpiece</div>
        <input type="date" id="start-date" onchange="updateStartDate(this.value)" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:5px; border-radius:8px; font-size:0.8em;">
    </div>

    <div class="dashboard">
        <div class="dday-card">
            <div id="dday-display" class="dday-val">D-84</div>
            <div class="progress-info">성공 흐름: <span id="total-per">0%</span></div>
        </div>
        <div class="timer-card">
            <div style="font-size:0.75em; opacity:0.8; margin-bottom:4px;">집중 타이머</div>
            <div id="timer" class="timer-val">25:00</div>
            <button onclick="toggleTimer()" id="timer-btn" class="timer-btn">START</button>
        </div>
    </div>

    <div class="quote-area">
        <div id="quote-text" style="font-weight:bold;"></div>
        <div id="quote-author" style="font-size:0.85em; color:var(--quote-sub); margin-top:5px;"></div>
    </div>

    <div class="chart-box"><canvas id="weeklyChart"></canvas></div>

    <details style="margin-bottom:20px; font-size:0.9em;">
        <summary style="cursor:pointer; color:var(--primary); font-weight:bold;">🖼️ 비전 보드 & 핵심 목표</summary>
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px;">
            <div id="v-0" onclick="handleImage(0)" style="aspect-ratio:1; background:var(--card); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
            <div id="v-1" onclick="handleImage(1)" style="aspect-ratio:1; background:var(--card); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
            <div id="v-2" onclick="handleImage(2)" style="aspect-ratio:1; background:var(--card); border:1px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">+</div>
        </div>
        <textarea id="goal-input" onchange="data.goal=this.value; save();" placeholder="나의 12주 목표..." style="width:100%; height:60px; margin-top:10px; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:12px; font-family:inherit; box-sizing:border-box;"></textarea>
    </details>

    <div id="board" class="week-grid"></div>
</div>

<div class="dock-container">
    <div class="dock">
        <button class="dock-btn btn-save" onclick="manualSave()">💾 저장</button>
        <button class="dock-btn btn-backup" onclick="exportData()">📤 백업</button>
        <button class="dock-btn btn-load" onclick="importData()">📥 불러오기</button>
        <button class="dock-btn btn-reset" onclick="resetAll()">🧹 초기화</button>
    </div>
</div>

<script>
    const quotes = [
        { q: "작은 일에 충실한 사람이 큰 일에도 충실할 수 있다.", a: "성경" },
        { q: "시련은 있어도 실패는 없다.", a: "정주영 (현대)" },
        { q: "혁신은 리더와 추종자를 구분하는 잣대다.", a: "스티브 잡스" },
        { q: "준비하지 않은 자는 기회가 와도 잡지 못한다.", a: "나폴레옹" },
        { q: "끝까지 해보기 전까지는 늘 불가능해 보인다.", a: "넬슨 만델라" }
    ];

    const STORAGE_KEY = '12W_MASTER_COMPACT_FINAL';
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        startDate: new Date().toISOString().split('T')[0],
        goal: "", images: [null, null, null],
        weeks: Array.from({length: 12}, (_, i) => ({ title: `Week ${i+1}`, todos: [] }))
    };

    let timerInterval, timeLeft = 1500, isRunning = false, myChart;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); updateStatus(); updateChart(); }
    function manualSave() { save(); confetti(); alert("저장되었습니다!"); }

    function render() {
        document.getElementById('start-date').value = data.startDate;
        document.getElementById('goal-input').value = data.goal || "";
        data.images.forEach((img, i) => { const box = document.getElementById(`v-${i}`); box.innerHTML = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover;">` : '+'; });
        
        const rq = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-text').innerText = `"${rq.q}"`;
        document.getElementById('quote-author').innerText = `- ${rq.a}`;

        const board = document.getElementById('board');
        board.innerHTML = '';
        
        const start = new Date(data.startDate);
        const today = new Date(); today.setHours(0,0,0,0);
        const currentWeekIdx = Math.floor((today - start) / (1000 * 60 * 60 * 24 * 7));

        data.weeks.forEach((w, wIdx) => {
            const isCurrent = wIdx === currentWeekIdx;
            const done = w.todos.filter(t => t.done).length;
            const per = w.todos.length === 0 ? 0 : Math.round((done/w.todos.length)*100);

            board.innerHTML += `
                <div class="week-card ${isCurrent ? 'current-week' : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-weight:bold; font-size:0.95em;">${w.title}</span>
                        <span style="color:var(--primary); font-size:0.85em; font-weight:bold;">${per}%</span>
                    </div>
                    <div id="list-${wIdx}">
                        ${w.todos.map((t, tIdx) => `
                            <div class="todo-item">
                                <input type="checkbox" ${t.done?'checked':''} onclick="toggleTodo(${wIdx}, ${tIdx})">
                                <input type="text" class="todo-input" value="${t.text}" onchange="editTodo(${wIdx}, ${tIdx}, this.value)" style="${t.done?'text-decoration:line-through; opacity:0.4':''}">
                                <button onclick="deleteTodo(${wIdx}, ${tIdx})" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:1.1em;">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="in-${wIdx}" placeholder="할 일 추가" onkeypress="if(event.key==='Enter') addTodo(${wIdx})" style="flex:1; padding:8px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); font-size:0.85em;">
                        <button onclick="addTodo(${wIdx})" style="background:var(--primary); color:white; border:none; border-radius:10px; width:34px; cursor:pointer;">+</button>
                    </div>
                </div>`;
        });
        updateStatus();
        updateChart();
    }

    function updateStatus() {
        const start = new Date(data.startDate);
        const end = new Date(start); end.setDate(start.getDate() + 84);
        const diff = Math.ceil((end - new Date()) / (1000 * 60 * 60 * 24));
        document.getElementById('dday-display').innerText = diff > 0 ? `D-${diff}` : "🏁";
        let total = 0, done = 0;
        data.weeks.forEach(w => { total += w.todos.length; done += w.todos.filter(t => t.done).length; });
        document.getElementById('total-per').innerText = total === 0 ? '0%' : Math.round((done/total)*100) + '%';
    }

    function updateChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const scores = data.weeks.map(w => w.todos.length === 0 ? 0 : Math.round((w.todos.filter(t => t.done).length / w.todos.length) * 100));
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'line', data: { labels: data.weeks.map(w => w.title), datasets: [{ data: scores, borderColor: '#0a84ff', tension: 0.3, fill: true, backgroundColor: 'rgba(10,132,255,0.1)', pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, display: false }, x: { grid: { display: false } } } } });
    }

    function addTodo(w) { const v = document.getElementById(`in-${w}`); if(v.value){ data.weeks[w].todos.push({text:v.value, done:false}); v.value=''; save(); render(); } }
    function deleteTodo(w, t) { data.weeks[w].todos.splice(t, 1); save(); render(); }
    function toggleTodo(w, t) { data.weeks[w].todos[t].done = !data.weeks[w].todos[t].done; if(data.weeks[w].todos[t].done) confetti(); save(); render(); }
    function editTodo(w, t, val) { data.weeks[w].todos[t].text = val; save(); }
    function updateStartDate(v) { data.startDate = v; save(); render(); }
    function handleImage(idx) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => { const r = new FileReader(); r.onload = () => { data.images[idx] = r.result; save(); render(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }
    function exportData() { const b = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '12week_masterpiece.json'; a.click(); }
    function importData() { const i = document.createElement('input'); i.type = 'file'; i.onchange = e => { const r = new FileReader(); r.onload = () => { data = JSON.parse(r.result); save(); render(); }; r.readAsText(e.target.files[0]); }; i.click(); }
    function resetAll() { if(confirm("초기화하시겠습니까?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); } }

    function toggleTimer() {
        if(isRunning) { clearInterval(timerInterval); document.getElementById('timer-btn').innerText = "START"; }
        else { timerInterval = setInterval(() => { timeLeft--; updateTimerDisplay(); if(timeLeft <= 0) { clearInterval(timerInterval); confetti(); alert("Time Up!"); timeLeft=1500; updateTimerDisplay(); isRunning=false; } }, 1000); document.getElementById('timer-btn').innerText = "STOP"; }
        isRunning = !isRunning;
    }
    function updateTimerDisplay() { const m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`; }

    render();
</script>
</body>
</html>
